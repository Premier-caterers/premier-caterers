# Premier Caterers — Nightly Backup
# Saves a dated copy of index.html and grocery.html into the backups/ folder,
# writes a factual summary next to each, and deletes backups older than 60 days.
#
# This file lives at: .github/workflows/nightly-backup.yml
# It does NOT touch your live app code. It only adds files under backups/.
#
# NOTE: GitHub's scheduler is in UTC and is often late/imprecise, so instead of
# trying to hit an exact 3 AM, we simply run once a day (early Eastern morning)
# and back up whenever GitHub actually fires. A backup at an odd hour still
# protects you; the important thing is that it runs every day.

name: Nightly Backup

on:
  schedule:
    - cron: '0 7 * * *'   # ~3 AM Eastern (daylight) — may run later if GitHub is busy
  # Lets you also run it by hand from the Actions tab to test it.
  workflow_dispatch:

permissions:
  contents: write   # allows the job to commit the backup files

# If two runs ever overlap, let the newer one proceed cleanly.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Make the backups and a summary for each
        run: |
          set -e
          mkdir -p backups
          STAMP=$(TZ=America/New_York date +%Y-%m-%d)
          NICE=$(TZ=America/New_York date "+%A, %B %d %Y at %-I:%M %p %Z")

          backup_one () {
            FILE="$1"
            if [ ! -f "$FILE" ]; then
              echo "$FILE not found — skipping."
              return
            fi
            BASE=$(basename "$FILE" .html)
            cp "$FILE" "backups/${BASE}-${STAMP}.html"

            BYTES=$(stat -c%s "$FILE")
            KB=$(( BYTES / 1024 ))
            LINES=$(wc -l < "$FILE")
            SCREENS=$(grep -oE "showView\('[a-zA-Z]+'\)" "$FILE" | sort -u | sed "s/showView('//; s/')//" | paste -sd ', ' -)
            FUNCS=$(grep -oE "function [a-zA-Z0-9_]+" "$FILE" | sort -u | wc -l)

            # Health flag — your full app is ~641 KB. Warn loudly if it looks thin.
            FLAG="OK"
            if [ "$BASE" = "index" ] && [ "$KB" -lt 600 ]; then
              FLAG="*** WARNING: index is only ${KB} KB (full app is ~641 KB). This backup may be a shrunken/incomplete version. ***"
            fi

            {
              echo "# Backup summary — ${BASE}.html"
              echo ""
              echo "Taken: ${NICE}"
              echo "Size: ${KB} KB (${BYTES} bytes)"
              echo "Lines: ${LINES}"
              echo "Distinct functions: ${FUNCS}"
              echo ""
              echo "Screens present: ${SCREENS}"
              echo ""
              echo "Status: ${FLAG}"
            } > "backups/${BASE}-${STAMP}.summary.md"

            echo "Backed up ${FILE} -> backups/${BASE}-${STAMP}.html (${KB} KB)"
          }

          backup_one "index.html"
          backup_one "grocery.html"

      - name: Delete backups older than 60 days
        run: |
          CUTOFF=$(date -d '60 days ago' +%Y%m%d)
          shopt -s nullglob
          for f in backups/*; do
            # pull the YYYY-MM-DD out of the filename
            d=$(echo "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            [ -z "$d" ] && continue
            dnum=$(echo "$d" | tr -d '-')
            if [ "$dnum" -lt "$CUTOFF" ]; then
              echo "Removing old backup: $f"
              rm -f "$f"
            fi
          done

      - name: Save the backups to the repository
        run: |
          git config user.name "Premier Backup Bot"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit needed."
          else
            git commit -m "Nightly backup $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi
