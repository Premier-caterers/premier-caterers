<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Truck Checklist — Premier Caterers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#7A2E3D; --wine-tint:#F3E4E2;
    --bg:#F1F2ED; --card:#FFFFFF;
    --text1:#1D1F21; --text2:#63666A; --text3:#93968F;
    --hairline:#E7E7E3;
    --green:#3F7A44; --green-tint:#E7F2E8;
    --amber:#C9930F; --amber-tint:#FAF1DD;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text1);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
  header{padding:28px 20px 16px;text-align:center}
  header h1{font-family:'Fraunces',serif;font-weight:700;font-size:26px;margin:0 0 4px}
  header .sub{color:var(--text2);font-size:14.5px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 60px}
  .truck-card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;overflow:hidden}
  .truck-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .truck-head h2{font-family:'Fraunces',serif;font-size:19px;margin:0;font-weight:600}
  .truck-head .status{font-size:13px;font-weight:600;padding:5px 12px;border-radius:100px}
  .status.done{background:var(--green-tint);color:var(--green)}
  .status.todo{background:var(--amber-tint);color:var(--amber)}
  .truck-body{padding:0 20px 20px;display:none}
  .truck-body.open{display:block}
  .item{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-top:1px solid var(--hairline)}
  .item:first-child{border-top:none}
  .item input[type=checkbox]{width:26px;height:26px;flex-shrink:0;margin-top:2px;accent-color:var(--wine)}
  .item label{font-size:16px;line-height:1.4;flex:1}
  textarea{width:100%;border:1px solid var(--hairline);border-radius:10px;padding:12px;font-family:inherit;font-size:15px;margin-top:14px;resize:vertical;min-height:70px}
  .section-label{font-size:12.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--hairline)}
  .field-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
  .field-label{font-size:15px}
  .field-row select,.field-row input[type=number]{border:1px solid var(--hairline);border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit;width:130px;text-align:right}
  .photo-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
  .photo-btn{background:var(--wine-tint);color:var(--wine);border:none;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
  .photo-status{font-size:13px;color:var(--text3)}
  .photo-status.ok{color:var(--green);font-weight:600}
  .submit-btn{width:100%;background:var(--wine);color:#fff;border:none;border-radius:12px;padding:16px;font-size:16.5px;font-weight:600;margin-top:16px;cursor:pointer}
  .submit-btn:disabled{opacity:.5}
  .submitted-note{background:var(--green-tint);color:var(--green);border-radius:10px;padding:14px;font-size:14.5px;margin-top:14px;display:flex;align-items:center;gap:8px}
  .week-label{text-align:center;color:var(--text3);font-size:13.5px;margin-bottom:18px}
  .loading{text-align:center;color:var(--text3);padding:40px}
</style>
</head>
<body>
<header>
  <h1>Truck Checklist</h1>
  <div class="sub">Premier Caterers</div>
</header>
<div class="wrap">
  <div class="week-label" id="weekLabel"></div>
  <div id="app"><div class="loading">Loading…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeBI51t7ydOt6uOuvJ1BjQhwiX9d8jaJc",
  authDomain: "premier-caterers-internal-app.firebaseapp.com",
  projectId: "premier-caterers-internal-app",
  storageBucket: "premier-caterers-internal-app.firebasestorage.app",
  messagingSenderId: "471701398759",
  appId: "1:471701398759:web:559a7bee3b645ce545ee42"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// Each item is either a plain checkbox ('check'), a Full/OK/Low level pick
// ('level'), a fuel-tank fraction pick ('fuel'), or a number entry ('number').
// requirePhoto on an item means a photo must be attached before submitting —
// used here for mileage, so the number is backed by an odometer photo.
const LEVEL_OPTS = ['Full','OK','Low'];
const FUEL_LEVELS = ['Full','3/4','Half','1/4','Empty'];
const STANDARD_ITEMS = [
  { label:'Oil level checked',                                    type:'level' },
  { label:'Tire pressure & condition checked (all tires)',        type:'check' },
  { label:'Coolant / washer fluid / brake fluid levels checked',  type:'level' },
  { label:'Headlights, brake lights & turn signals working',      type:'check' },
  { label:'Interior clean',                                       type:'check' },
  { label:'Exterior clean, no new dents or damage',                type:'check' },
  { label:'Fuel level noted',                                     type:'fuel' },
  { label:'Mileage noted',                                        type:'number', placeholder:'e.g. 84210', requirePhoto:true, photoLabel:'Photo of odometer' }
];
const REEFER_EXTRA_ITEMS = [
  { label:'Refrigeration unit running & holding temperature', type:'check' },
  { label:'Reefer unit fuel level checked',                   type:'check' }
];
const TRUCKS = [
  { id:'reefer', name:'Reefer truck', items: STANDARD_ITEMS.concat(REEFER_EXTRA_ITEMS), hasFuelSection:true },
  { id:'large',  name:'Large truck',  items: STANDARD_ITEMS, hasFuelSection:true },
  { id:'van',    name:'Van',          items: STANDARD_ITEMS, hasFuelSection:false }
];

// "Week of" is always the most recent Tuesday (today, if today IS Tuesday) —
// this way it doesn't matter which day he actually gets to it, everything
// done in the same week groups together the same way.
function weekOfTuesday(){
  const d = new Date();
  const day = d.getDay(); // 0=Sun..6=Sat, Tuesday=2
  const diff = (day >= 2) ? (day - 2) : (day + 5);
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0,10);
}
const weekOf = weekOfTuesday();

// A different item requires a photo each week, on top of the mileage photo,
// so it's never predictable which one he'll need proof for. Deterministic
// from the week itself (not random per page load) — same item all week,
// same item for every truck, changes automatically the following week.
const SPOT_CHECK_POOL = STANDARD_ITEMS.filter(it=>!it.requirePhoto).map(it=>it.label);
const weekIndex = Math.floor(new Date(weekOf+'T00:00:00').getTime() / (7*24*60*60*1000));
const spotCheckLabel = SPOT_CHECK_POOL[((weekIndex % SPOT_CHECK_POOL.length) + SPOT_CHECK_POOL.length) % SPOT_CHECK_POOL.length];
document.getElementById('weekLabel').innerHTML = 'Week of ' + new Date(weekOf+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'}) + '<br><span style="color:var(--wine);font-weight:600">This week\'s spot check: ' + spotCheckLabel + '</span>';

let existing = {}; // truckId -> doc data, if already submitted this week

async function loadExisting(){
  const snap = await db.collection('truckChecklists').where('weekOf','==',weekOf).get();
  snap.forEach(doc=>{ existing[doc.data().truckId] = { id: doc.id, ...doc.data() }; });
}

function itemFieldHtml(truckId, item, i){
  const id = truckId+'-'+i;
  let fieldHtml;
  if(item.type==='level'){
    fieldHtml = `<div class="field-row"><label class="field-label" for="${id}">${item.label}</label><select id="${id}"><option value="">— select —</option>${LEVEL_OPTS.map(l=>`<option value="${l}">${l}</option>`).join('')}</select></div>`;
  } else if(item.type==='fuel'){
    fieldHtml = `<div class="field-row"><label class="field-label" for="${id}">${item.label}</label><select id="${id}"><option value="">— select —</option>${FUEL_LEVELS.map(l=>`<option value="${l}">${l}</option>`).join('')}</select></div>`;
  } else if(item.type==='number'){
    fieldHtml = `<div class="field-row"><label class="field-label" for="${id}">${item.label}</label><input type="number" id="${id}" placeholder="${item.placeholder||''}"></div>`;
  } else {
    fieldHtml = `<div class="item"><input type="checkbox" id="${id}"><label for="${id}">${item.label}</label></div>`;
  }
  const needsPhoto = item.requirePhoto || item.label===spotCheckLabel;
  if(!needsPhoto) return fieldHtml;
  const photoLabel = item.requirePhoto ? (item.photoLabel||'Take photo') : ('This week\'s spot check — photo of: '+item.label);
  return fieldHtml + `<div class="photo-row">
    <input type="file" accept="image/*" capture="environment" id="${id}-photo" style="display:none" onchange="handlePhotoSelected('${id}-photo')">
    <button type="button" class="photo-btn" onclick="document.getElementById('${id}-photo').click()"><i class="ti ti-camera"></i> ${photoLabel}</button>
    <span class="photo-status" id="${id}-photo-status">Required</span>
  </div>`;
}
function render(){
  const el = document.getElementById('app');
  el.innerHTML = TRUCKS.map(t=>{
    const done = existing[t.id];
    const fuelOpts = FUEL_LEVELS.map(l=>`<option value="${l}">${l}</option>`).join('');
    const fuelSection = t.hasFuelSection ? `
           <div class="section-label">Fuel &amp; DEF</div>
           <div class="field-row">
             <label class="field-label">DEF level</label>
             <select id="def-${t.id}"><option value="">— select —</option>${fuelOpts}</select>
           </div>
           <div class="item"><input type="checkbox" id="deftop-${t.id}"><label for="deftop-${t.id}">Did you top off DEF?</label></div>
           <div class="field-row">
             <label class="field-label">Fuel level before filling up</label>
             <select id="fuelbefore-${t.id}"><option value="">— select —</option>${fuelOpts}</select>
           </div>
           <div class="field-row">
             <label class="field-label">Gallons put in today</label>
             <input type="number" step="0.1" min="0" id="gallons-${t.id}" placeholder="e.g. 42.5">
           </div>
           <div class="field-row">
             <label class="field-label">What did the fill-up cost?</label>
             <input type="number" step="0.01" min="0" id="fillcost-${t.id}" placeholder="$">
           </div>
           <div class="photo-row">
             <input type="file" accept="image/*" capture="environment" id="receipt-${t.id}-photo" style="display:none" onchange="handlePhotoSelected('receipt-${t.id}-photo')">
             <button type="button" class="photo-btn" onclick="document.getElementById('receipt-${t.id}-photo').click()"><i class="ti ti-receipt"></i> Photo of fuel receipt</button>
             <span class="photo-status" id="receipt-${t.id}-photo-status">Required if you filled up</span>
           </div>` : '';
    return `<div class="truck-card">
      <div class="truck-head" onclick="toggleTruck('${t.id}')">
        <h2>${t.name}</h2>
        <span class="status ${done?'done':'todo'}">${done?'✓ Done':'Needs check'}</span>
      </div>
      <div class="truck-body" id="body-${t.id}">
        ${done ? `<div class="submitted-note">✓ Submitted ${new Date(done.submittedAt).toLocaleString()}${done.notes?' — "'+done.notes+'"':''}</div>` :
          `${t.items.map((item,i)=>itemFieldHtml(t.id,item,i)).join('')}
           ${fuelSection}
           <textarea id="notes-${t.id}" placeholder="Anything to flag? (optional)"></textarea>
           <button class="submit-btn" onclick="submitTruck('${t.id}')">Submit ${t.name} checklist</button>`}
      </div>
    </div>`;
  }).join('');
}

window.toggleTruck = function(id){
  document.querySelectorAll('.truck-body').forEach(b=>{
    if(b.id === 'body-'+id) b.classList.toggle('open');
    else b.classList.remove('open');
  });
};

window.handlePhotoSelected = function(fieldId){
  const input = document.getElementById(fieldId);
  const statusEl = document.getElementById(fieldId+'-status');
  if(input.files && input.files[0] && statusEl){
    statusEl.textContent = '✓ Photo attached';
    statusEl.classList.add('ok');
    statusEl.style.color = '';
  }
};
// Best-effort — if the phone denies permission or GPS is unavailable, we
// still let the submission through with location:null rather than blocking.
function captureLocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    const timer = setTimeout(()=>resolve(null), 8000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }); },
      ()=>{ clearTimeout(timer); resolve(null); },
      { enableHighAccuracy:true, timeout:7000 }
    );
  });
}

window.submitTruck = async function(id){
  const truck = TRUCKS.find(t=>t.id===id);
  const values = {};
  const photoFiles = {}; // item label -> File, for items with requirePhoto
  let allComplete = true;
  let missingPhoto = false;
  truck.items.forEach((item,i)=>{
    const el = document.getElementById(id+'-'+i);
    let v, filled;
    if(item.type==='check'){ v = el.checked; filled = el.checked; }
    else if(item.type==='number'){ v = el.value===''?null:parseFloat(el.value); filled = el.value!==''; }
    else { v = el.value||''; filled = !!v; }
    values[item.label] = v;
    if(!filled) allComplete = false;
    if(item.requirePhoto || item.label===spotCheckLabel){
      const photoInput = document.getElementById(id+'-'+i+'-photo');
      if(photoInput && photoInput.files && photoInput.files[0]){
        photoFiles[item.label] = photoInput.files[0];
      } else {
        missingPhoto = true;
        const statusEl = document.getElementById(id+'-'+i+'-photo-status');
        if(statusEl){ statusEl.textContent = 'Photo required'; statusEl.style.color = '#B3261E'; }
      }
    }
  });
  const notes = (document.getElementById('notes-'+id).value||'').trim();
  const fuelData = {};
  if(truck.hasFuelSection){
    fuelData.defLevel = document.getElementById('def-'+id).value || '';
    fuelData.defToppedOff = document.getElementById('deftop-'+id).checked;
    fuelData.fuelLevelBefore = document.getElementById('fuelbefore-'+id).value || '';
    const gal = parseFloat(document.getElementById('gallons-'+id).value);
    fuelData.gallonsAdded = isFinite(gal) ? gal : null;
    const cost = parseFloat(document.getElementById('fillcost-'+id).value);
    fuelData.fillCost = isFinite(cost) ? cost : null;

    const filledUpToday = fuelData.gallonsAdded!=null || fuelData.fillCost!=null;
    if(filledUpToday){
      const receiptInput = document.getElementById('receipt-'+id+'-photo');
      if(receiptInput && receiptInput.files && receiptInput.files[0]){
        photoFiles['Fuel receipt'] = receiptInput.files[0];
      } else {
        missingPhoto = true;
        const statusEl = document.getElementById('receipt-'+id+'-photo-status');
        if(statusEl){ statusEl.textContent = 'Receipt photo required — you logged a fill-up'; statusEl.style.color = '#B3261E'; }
      }
    }
  }
  if(missingPhoto){ alert('A required photo is missing — attach it before submitting.'); return; }
  if(!allComplete && !confirm('Not everything is filled in — submit anyway?')) return;
  const submitBtn = document.querySelector('#body-'+id+' .submit-btn');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Submitting…'; }
  try{
    const location = await captureLocation();
    const photoUrls = {};
    for(const label in photoFiles){
      const path = 'truckPhotos/'+id+'/'+weekOf+'_'+Date.now()+'_'+label.replace(/[^a-z0-9]/gi,'_')+'.jpg';
      const ref = storage.ref().child(path);
      await ref.put(photoFiles[label]);
      photoUrls[label] = await ref.getDownloadURL();
    }
    await db.collection('truckChecklists').add({
      truckId: id, truckName: truck.name, weekOf,
      items: values, notes, ...fuelData, photoUrls, location,
      submittedAt: Date.now()
    });
    await loadExisting();
    render();
  }catch(e){
    alert('Could not submit — check your connection and try again.\n'+e.message);
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Submit '+truck.name+' checklist'; }
  }
};


(async function init(){
  await loadExisting();
  render();
})();
</script>
</body>
</html>
