<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier Caterers — Event Inquiry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f7f5f2; color: #1a1a1a;
    min-height: 100vh; padding: 24px 16px 40px;
  }
  .form-wrap {
    max-width: 620px; margin: 0 auto; background: #fff;
    border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.10); overflow: hidden;
  }
  .form-header { background: #8B1A1A; padding: 28px 32px 24px; text-align: center; }
  .form-header img { height: 52px; object-fit: contain; margin-bottom: 12px; display: block; margin: 0 auto 12px; }
  .form-header h1 { color: #fff; font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .form-header p { color: rgba(255,255,255,.75); font-size: 14px; }
  .form-body { padding: 28px 32px 32px; }
  .section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: #8B1A1A; margin: 20px 0 12px;
    padding-bottom: 6px; border-bottom: 1.5px solid #f0e8e8;
  }
  .section-title:first-of-type { margin-top: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 14px; }
  label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
  label .req { color: #8B1A1A; }
  input, select, textarea {
    width: 100%; border: 1.5px solid #e0d8d8; border-radius: 8px;
    padding: 10px 13px; font-size: 14px; color: #1a1a1a;
    font-family: inherit; background: #faf9f8; transition: border-color .15s; appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #8B1A1A;
    background: #fff; box-shadow: 0 0 0 3px rgba(139,26,26,.08);
  }
  textarea { resize: vertical; min-height: 90px; }
  .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .radio-label {
    display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
    color: #444; padding: 8px 14px; border: 1.5px solid #e0d8d8;
    border-radius: 8px; cursor: pointer; background: #faf9f8; transition: all .15s;
  }
  .radio-label input { width: auto; padding: 0; border: none; background: none; box-shadow: none; accent-color: #8B1A1A; }
  .radio-label.selected { border-color: #8B1A1A; background: #fdf3f3; color: #8B1A1A; }
  .submit-btn {
    width: 100%; padding: 14px; background: #8B1A1A; color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: background .15s;
  }
  .submit-btn:hover { background: #7a1616; }
  .submit-btn:disabled { background: #c4a0a0; cursor: not-allowed; }
  .success-screen { display: none; text-align: center; padding: 48px 32px; }
  .success-icon { font-size: 56px; margin-bottom: 16px; }
  .success-screen h2 { font-size: 22px; color: #8B1A1A; margin-bottom: 8px; }
  .success-screen p { font-size: 14px; color: #666; line-height: 1.6; }
  .error-msg {
    background: #fdf0f0; border: 1px solid #e8b4b4; color: #8B1A1A;
    font-size: 13px; padding: 10px 14px; border-radius: 8px;
    margin-bottom: 14px; display: none;
  }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } .form-body { padding: 20px; } }
</style>
</head>

    <h1>Event Inquiry</h1>
    <p>Fill out the form below and we'll be in touch shortly</p>
  </div>
  <div class="form-body" id="formBody">
    <div class="error-msg" id="errorMsg"></div>
    <div class="section-title">Contact Information</div>
    <div class="row">
      <div class="field"><label>First name <span class="req">*</span></label><input id="firstName" placeholder="First name"></div>
      <div class="field"><label>Last name <span class="req">*</span></label><input id="lastName" placeholder="Last name"></div>
    </div>
    <div class="row">
      <div class="field"><label>Email address</label><input id="email" type="email" placeholder="your@email.com"></div>
      <div class="field"><label>Phone number</label><input id="phone" type="tel" placeholder="(555) 555-5555"></div>
    </div>
    <div class="section-title">Event Details</div>
    <div class="field"><label>Event name</label><input id="eventName" placeholder="e.g. Smith Bar Mitzvah"></div>
    <div class="row">
      <div class="field">
        <label>Event type <span class="req">*</span></label>
        <select id="eventType">
          <option value="">Select type...</option>
          <option>Aufruf</option><option>Bar Mitzvah</option><option>Bat Mitzvah</option>
          <option>Wedding</option><option>Kiddush</option><option>Bris</option>
          <option>Sheva Brachos</option><option>Vort</option><option>Shloshim</option>
          <option>Breakfast</option><option>Brunch</option><option>Corporate</option>
          <option>Drop off catering</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label>Event date</label><input id="eventDate" type="date"></div>
    </div>
    <div class="row">
      <div class="field"><label>Number of guests</label><input id="guestCount" type="number" placeholder="e.g. 150"></div>
      <div class="field">
        <label>Cuisine</label>
        <select id="cuisine">
          <option value="">Select...</option>
          <option>Meat</option><option>Dairy</option><option>Both</option><option>Not sure yet</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Is this a Shabbos event?</label>
      <div class="radio-group" id="shabbosGroup">
        <label class="radio-label" onclick="selectShabbos(this,'Yes')"><input type="radio" name="shabbos" value="Yes"> Yes — Shabbos</label>
        <label class="radio-label" onclick="selectShabbos(this,'No')"><input type="radio" name="shabbos" value="No"> No</label>
        <label class="radio-label" onclick="selectShabbos(this,'Both')"><input type="radio" name="shabbos" value="Both"> Both (multi-meal)</label>
      </div>
    </div>
    <div class="section-title">Venue</div>
    <div class="field"><label>Venue name</label><input id="venueName" placeholder="Venue or hall name"></div>
    <div class="field"><label>Venue location / address</label><input id="venueLocation" placeholder="City, State or full address"></div>
    <div class="section-title">How Can We Help?</div>
    <div class="field">
      <label>How did you hear about us?</label>
      <select id="howFound">
        <option value="">Select...</option>
        <option>Referral from friend or family</option>
        <option>Attended a Premier Caterers event</option>
        <option>Google search</option><option>Social media</option>
        <option>Party planner / coordinator</option>
        <option>Venue recommendation</option><option>Other</option>
      </select>
    </div>
    <div class="row">
      <div class="field"><label>Referred by</label><input id="referredBy" placeholder="Who referred you?"></div>
      <div class="field"><label>Event you attended</label><input id="eventAttended" placeholder="Event name / date"></div>
    </div>
    <div class="field"><label>Party planner / coordinator name</label><input id="plannerName" placeholder="Planner name (if applicable)"></div>
    <div class="field"><label>Questions or comments</label><textarea id="comments" placeholder="Tell us anything else about your event..."></textarea></div>
    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Send Inquiry</button>
  </div>
  <div class="success-screen" id="successScreen">
    <div class="success-icon">✅</div>
    <h2>Thank you!</h2>
    <p>Your inquiry has been received. A member of the Premier Caterers team will be in touch with you shortly.</p>
    <p style="margin-top:12px;color:#8B1A1A;font-weight:600">We look forward to making your event exceptional.</p>
  </div>

const db = firebase.firestore();

// Menu script URL — hardcoded same as app
const MENU_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbaB_BoY8YjIkJX1OKbiKJX9FgFZzLzdZwJhEDA4lNhS_Wb6g2B_GoDO7hgXEDJlTHgw/exec';

let shabbosValue = '';
function selectShabbos(el, val){
  shabbosValue = val;
  document.querySelectorAll('.radio-label').forEach(l => l.classList.remove('selected'));
  el.classList.add('selected');
}

function gv(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function showError(msg){
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'center'});
}

async function submitForm(){
  const btn = document.getElementById('submitBtn');
  const firstName = gv('firstName');
  const lastName  = gv('lastName');
  const eventType = gv('eventType');
  document.getElementById('errorMsg').style.display = 'none';

  if(!firstName || !lastName){ showError('Please enter your first and last name.'); return; }
  if(!eventType){ showError('Please select an event type.'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  // Build inquiry exactly like the app does
  const inquiryData = {
    id: Date.now() + '',
    firstName, lastName,
    email:         gv('email'),
    phone:         gv('phone'),
    eventName:     gv('eventName'),
    eventType,
    shabbos:       shabbosValue,
    eventDate:     gv('eventDate'),
    guestCount:    gv('guestCount'),
    cuisine:       gv('cuisine'),
    venueName:     gv('venueName'),
    venueLocation: gv('venueLocation'),
    howFound:      gv('howFound'),
    referredBy:    gv('referredBy'),
    eventAttended: gv('eventAttended'),
    plannerName:   gv('plannerName'),
    comments:      gv('comments'),
    meatDairy:     '',
    stage:         'new',
    source:        'website',
    submittedAt:   new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})
  };

  try {
    // Save to Firebase — exact same as app
    await db.collection('inquiries').doc(inquiryData.id).set(inquiryData);
    console.log('Inquiry saved to Firebase:', inquiryData.id);

    // Trigger menu automation — exact same fetch as app
    triggerMenuAutomation(inquiryData);

    // Show success
    document.getElementById('formBody').style.display = 'none';
    document.getElementById('successScreen').style.display = 'block';

  } catch(err){
    console.error('Submit error:', err);
    showError('Something went wrong. Please try again or call us directly.');
    btn.disabled = false;
    btn.textContent = 'Send Inquiry';
  }
}

// EXACT SAME triggerMenuAutomation as the app
function triggerMenuAutomation(inquiryData){
  const menuScriptUrl = MENU_SCRIPT_URL;
  if(!menuScriptUrl){ console.log('No menu script URL'); return; }
  const encoded = encodeURIComponent(JSON.stringify(inquiryData));
  const url = menuScriptUrl + '?data=' + encoded;
  console.log('Menu automation: calling script, URL length =', url.length);
  fetch(url, { method:'GET', redirect:'follow' })
    .then(r => r.json())
    .then(resp => {
      console.log('Menu automation response:', JSON.stringify(resp));
      if(resp.success && resp.result && resp.result.templatesCopied && resp.result.templatesCopied.length > 0){
        // Save menu docs back to Firebase
        const menuDocs = resp.result.templatesCopied.map(c => ({ name:c.name, url:c.url, templateNum:c.templateNum }));
        db.collection('inquiries').doc(inquiryData.id).update({ menuDocs })
          .catch(() => db.collection('inquiries').doc(inquiryData.id).set({ menuDocs }, { merge:true }));
        console.log('Menu docs saved:', menuDocs.length, 'files');
      }
    })
    .catch(err => console.log('Menu automation error:', err.message));
}
</script>
