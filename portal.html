<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Premier Caterers — Your Event Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
  :root{
    --bg3:#F1F2ED; --card:#FFFFFF;
    --maroon:#7A2E3D; --maroon-deep:#5C2230;
    --brass:#B98B2E; --brass-deep:#8F6A1E; --brass-tint:#FAF0DC;
    --nav-bg:#20262A;
    --text:#23262B; --text2:#62665D;
    --border:#E3E4DC;
    --green-bg:#E7F0E3; --green-text:#37613A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg3);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

  .frame{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

  .portal-header{background:var(--nav-bg);color:#fff;padding:26px 28px 0}
  .brand{font-family:'Fraunces',serif;font-size:14px;letter-spacing:.02em;color:var(--brass);margin-bottom:16px}
  .portal-header h1{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin:0 0 4px;color:#fff}
  .portal-header .sub{color:#A9AEB0;font-size:13.5px;margin-bottom:18px}
  .tabs{display:flex;gap:4px;overflow-x:auto}
  .tab{padding:11px 16px;font-size:13px;font-weight:600;color:#A9AEB0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
  .tab.active{color:#fff;border-bottom-color:var(--brass)}
  .tab:disabled{opacity:.4;cursor:not-allowed}

  .panel{padding:26px 28px 34px;display:none}
  .panel.active{display:block}

  .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .overview-cell{background:var(--card);padding:16px 18px}
  .overview-cell .label{font-size:11px;color:var(--text2);margin-bottom:4px}
  .overview-cell .value{font-size:15px;font-weight:600}
  .job-pill{display:inline-block;background:var(--maroon);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .type-pill{display:inline-block;background:var(--brass-tint);color:var(--brass-deep);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .welcome-note{color:var(--text2);font-size:13.5px;margin-top:20px;line-height:1.65}
  .welcome-note a{color:var(--maroon)}

  .invoice-summary{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .invoice-summary .total-label{color:var(--text2);font-size:12.5px}
  .invoice-summary .total-num{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--maroon)}
  table.invoice-table{width:100%;border-collapse:collapse;font-size:13.5px}
  table.invoice-table th{text-align:left;font-weight:600;color:var(--text2);font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--border)}
  table.invoice-table td{padding:11px 0;border-bottom:1px solid var(--border)}
  table.invoice-table td:last-child, table.invoice-table th:last-child{text-align:right}

  .deposit-box{margin-top:22px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .deposit-box .dep-label{font-size:12.5px;color:var(--text2);margin-bottom:2px}
  .deposit-box .dep-amt{font-family:'Fraunces',serif;font-size:20px}
  .btn-primary{background:var(--maroon);color:#fff;border:none;padding:12px 22px;font-size:13.5px;font-weight:700;border-radius:8px;font-family:inherit;cursor:pointer}
  .btn-primary:hover{background:var(--maroon-deep)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}

  .paid-banner{background:var(--green-bg);border:2px solid var(--green-text);border-radius:10px;padding:16px 18px;text-align:center;color:var(--green-text);font-weight:600;margin-top:22px}

  .placeholder-note{color:var(--text2);font-size:13.5px;text-align:center;padding:30px 10px}

  .form-progress{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:12.5px;color:var(--text2)}
  .form-progress .bar{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
  .form-progress .bar-fill{height:100%;background:var(--brass);transition:width .3s}
  .save-status{font-size:11.5px;color:var(--text2);white-space:nowrap}
  .save-status.saving{color:var(--brass-deep)}
  .save-status.saved{color:var(--green-text)}

  .submitted-banner{background:var(--green-bg);border:2px solid var(--green-text);border-radius:10px;padding:16px 18px;text-align:center;color:var(--green-text);font-weight:600;margin-bottom:20px}

  .section-block{border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px}
  .section-block h3{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 4px}
  .helper-link{font-size:12px;color:var(--maroon);text-decoration:none;display:inline-block;margin-bottom:12px}
  .helper-link:hover{text-decoration:underline}

  .field-row{margin-bottom:12px}
  .field-row:last-child{margin-bottom:0}
  .field-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
  .field-row input[type=text], .field-row input[type=number], .field-row input[type=time], .field-row textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13.5px;background:var(--bg3)
  }
  .field-row input:focus, .field-row textarea:focus{outline:none;border-color:var(--maroon);background:#fff}
  .field-row textarea{resize:vertical;min-height:64px}
  .field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:520px){ .field-grid-2, .field-grid-3{grid-template-columns:1fr} }

  .upload-slot{border:1px dashed var(--border);border-radius:7px;padding:12px;font-size:12.5px;color:var(--text2);background:var(--bg3)}
  .upload-slot input[type=file]{display:block;font-size:12px;margin-top:6px}
  .upload-list{list-style:none;margin-top:8px;padding:0}
  .upload-list li{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--border)}
  .upload-list a{color:var(--maroon);text-decoration:none}
  .upload-remove{background:none;border:none;color:#B15A38;font-size:12px;cursor:pointer;font-family:inherit;padding:0 0 0 8px}

  .meal-tag{display:inline-flex;align-items:center;gap:8px;background:var(--nav-bg);color:#fff;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:14px}
  .meal-remove{background:none;border:none;color:#DDBFC5;cursor:pointer;font-size:13px;font-family:inherit;padding:0}
  .add-meal-link{font-size:13px;color:var(--maroon);font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;padding:6px 0;display:inline-block}

  .toggle-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toggle-btn{padding:7px 14px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:var(--bg3);cursor:pointer;font-family:inherit}
  .toggle-btn.selected{background:var(--maroon);color:#fff;border-color:var(--maroon)}

  .reminder-note{background:var(--brass-tint);border-radius:7px;padding:11px 13px;font-size:12px;color:var(--brass-deep);margin-bottom:12px;line-height:1.5}
  .reminder-note a{color:var(--maroon);font-weight:600;text-decoration:none}
  .reminder-note a:hover{text-decoration:underline}

  .submit-bar{display:flex;justify-content:flex-end;margin-top:20px}
  .autosave-note{text-align:center;color:var(--text2);font-size:11.5px;margin-top:10px}

  .state{text-align:center;padding:60px 20px}
  .state .ic{font-size:44px}
  .state h1{font-family:'Fraunces',serif;margin:14px 0 6px;font-size:21px}
  .state p{color:var(--text2);font-size:14.5px}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--maroon);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:520px){
    .overview-grid{grid-template-columns:1fr}
    .invoice-summary .total-num{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="spinner"></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeBI51t7ydOt6uOuvJ1BjQhwiX9d8jaJc",
  authDomain: "premier-caterers-internal-app.firebaseapp.com",
  projectId: "premier-caterers-internal-app",
  storageBucket: "premier-caterers-internal-app.firebasestorage.app",
  messagingSenderId: "471701398759",
  appId: "1:471701398759:web:559a7bee3b645ce545ee42"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const root = document.getElementById('root');

function qp(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(v){ return '$'+(parseFloat(v||0)).toFixed(2); }
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso+'T00:00:00Z');
    return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
  }catch(e){ return iso; }
}

function stateScreen(icon, title, msg){
  root.innerHTML = '<div class="frame"><div class="state"><div class="ic">'+icon+'</div><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p></div></div>';
}

const pid = qp('p'), tok = qp('t');
let portalDoc = null;

(async function(){
  if(!pid || !tok){ stateScreen('🔗','Link incomplete','This portal link is missing information. Please use the exact link from your email.'); return; }
  let snap;
  try{
    snap = await db.collection('clientPortals').doc(pid).get();
  }catch(e){
    stateScreen('⚠️','Could not load','Something went wrong loading your event. Please try again, or contact us at events@thepremiercaterer.com.'); return;
  }
  if(!snap.exists){ stateScreen('🔍','Event not found','We could not find this event. Please contact Premier Caterers at events@thepremiercaterer.com.'); return; }
  portalDoc = snap.data();
  if(String(portalDoc.token||'') !== String(tok)){ stateScreen('🔒','Invalid link','This portal link is not valid. Please use the exact link from your email, or contact us at events@thepremiercaterer.com.'); return; }

  try{ db.collection('clientPortals').doc(pid).update({ lastViewedAt: Date.now() }); }catch(e){}

  renderShell();
})();

function renderShell(){
  root.innerHTML =
    '<div class="frame">'
    + '<div class="portal-header">'
      + '<div class="brand">Premier Caterers</div>'
      + '<h1>'+esc(portalDoc.eventName||'Your Event')+'</h1>'
      + '<div class="sub">'+esc(fmtDate(portalDoc.eventDate))+(portalDoc.venue?(' · '+esc(portalDoc.venue)):'')+'</div>'
      + '<div class="tabs">'
        + '<button class="tab active" data-tab="overview">Overview</button>'
        + '<button class="tab" data-tab="invoice">Invoice &amp; Payment</button>'
        + '<button class="tab" data-tab="details">Event Details</button>'
      + '</div>'
    + '</div>'
    + '<div class="panel active" id="panel-overview"></div>'
    + '<div class="panel" id="panel-invoice"></div>'
    + '<div class="panel" id="panel-details"></div>'
    + '</div>';

  document.querySelectorAll('.tab[data-tab]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  renderOverview();
  renderInvoice();
  renderDetails();
}

function renderOverview(){
  const el = document.getElementById('panel-overview');
  el.innerHTML =
    '<div class="overview-grid">'
    + '<div class="overview-cell"><div class="label">Job Number</div><div class="value"><span class="job-pill">'+esc(portalDoc.jobNumber||'—')+'</span></div></div>'
    + '<div class="overview-cell"><div class="label">Event Type</div><div class="value"><span class="type-pill">'+esc(portalDoc.eventType||'—')+'</span></div></div>'
    + '<div class="overview-cell"><div class="label">Date</div><div class="value">'+esc(fmtDate(portalDoc.eventDate))+'</div></div>'
    + '<div class="overview-cell"><div class="label">Venue</div><div class="value">'+esc(portalDoc.venue||'—')+'</div></div>'
    + '<div class="overview-cell"><div class="label">Balance Due</div><div class="value" style="color:var(--maroon)">'+money(balanceRemaining())+'</div></div>'
    + '</div>'
    + '<p class="welcome-note">Welcome — this is where you can review your invoice and pay your deposit. Questions any time? Reach us at <a href="mailto:events@thepremiercaterer.com">events@thepremiercaterer.com</a>.</p>';
}

function balanceRemaining(){
  const inv = portalDoc.invoiceSnapshot || {};
  return (parseFloat(inv.total||0)) - (parseFloat(inv.paid||0));
}

function renderInvoice(){
  const el = document.getElementById('panel-invoice');
  const inv = portalDoc.invoiceSnapshot || {};
  const items = inv.items || [];
  const balance = balanceRemaining();

  let rows = items.map(function(it){
    return '<tr><td>'+esc(it.name||'')+'</td><td>'+esc(it.qty!=null?it.qty:'')+'</td><td>'+money(it.amount)+'</td></tr>';
  }).join('');

  const depositPaid = !!portalDoc.depositPaid;
  const depositAmt = parseFloat(portalDoc.depositAmount||0);

  el.innerHTML =
    '<div class="invoice-summary">'
      + '<div><div class="total-label">Invoice '+esc(inv.number||'')+'</div><div class="total-num">'+money(inv.total)+'</div></div>'
      + '<div style="text-align:right"><div class="total-label">Balance remaining</div><div style="font-size:17px;font-weight:700;color:var(--maroon)">'+money(balance)+'</div></div>'
    + '</div>'
    + (items.length ? ('<table class="invoice-table"><tr><th>Item</th><th>Qty</th><th>Amount</th></tr>'+rows+'</table>') : '')
    + (depositPaid
        ? '<div class="paid-banner">✓ Deposit of '+money(depositAmt)+' received — thank you!</div>'
        : (depositAmt > 0
            ? ('<div class="deposit-box"><div><div class="dep-label">Deposit due to confirm date</div><div class="dep-amt">'+money(depositAmt)+'</div></div><button class="btn-primary" id="payBtn">Pay Deposit</button></div>')
            : ''));

  const payBtn = document.getElementById('payBtn');
  if(payBtn){
    payBtn.addEventListener('click', startCheckout);
  }
}

async function startCheckout(){
  const btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Redirecting…';
  try{
    // TODO: replace with the Stripe Checkout Apps Script relay endpoint once built.
    // Expected request: POST { portalId: pid, token: tok }
    // Expected response: { url: "https://checkout.stripe.com/..." }
    throw new Error('Stripe relay not yet connected');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Pay Deposit';
    alert('Online payment isn\'t connected yet. Please contact Premier Caterers at events@thepremiercaterer.com to arrange your deposit.');
  }
}

// ───────────────────────── Event Details (client intake) ─────────────────────────

const storage = firebase.storage();

function emptyMeal(label){
  return { label: label||'', guestAdults:'', guestKids:'', startTime:'',
    floorplanFiles:[], scheduleFiles:[],
    linenTable:'', linenBuffet:'', linenNapkins:'',
    clientProvidesLinens:false, clientLinenDetails:'' };
}

function initIntake(){
  const existing = portalDoc.clientIntake;
  if(existing && existing.meals && existing.meals.length) return existing;
  return {
    menuConfirmed:null, menuChangeNotes:'',
    meals:[ emptyMeal('Meal 1') ],
    wineLiquor:null, liquorListFiles:[],
    allergies:'', musicianName:'', floristName:'', photographerName:'',
    logoFiles:[], ceremonyFiles:[], otherNotes:'', otherFiles:[],
    submittedAt:null
  };
}

let intake = null;
let saveTimer = null;
let uploadInFlight = 0;

function isWedding(){
  return /wedding/i.test(portalDoc.eventType||'');
}

function scheduleSave(){
  const statusEl = document.getElementById('saveStatus');
  if(statusEl){ statusEl.textContent = 'Saving…'; statusEl.className = 'save-status saving'; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async function(){
    try{
      await db.collection('clientPortals').doc(pid).set({ clientIntake: intake }, { merge:true });
      const s = document.getElementById('saveStatus');
      if(s){ s.textContent = 'Saved ✓'; s.className = 'save-status saved'; }
    }catch(e){
      const s = document.getElementById('saveStatus');
      if(s){ s.textContent = 'Save failed — check connection'; s.className = 'save-status'; }
    }
  }, 700);
}

function progressPct(){
  const checks = [];
  checks.push(intake.menuConfirmed !== null);
  intake.meals.forEach(function(m){
    checks.push(!!m.guestAdults, !!m.startTime);
  });
  checks.push(intake.wineLiquor !== null);
  checks.push(!!intake.allergies || intake.allergies === '');
  checks.push(!!intake.musicianName || !!intake.floristName || !!intake.photographerName);
  const done = checks.filter(Boolean).length;
  return Math.round((done/checks.length)*100);
}

function renderDetails(){
  intake = initIntake();
  const el = document.getElementById('panel-details');

  if(intake.submittedAt){
    el.innerHTML =
      '<div class="submitted-banner">✓ Your event details were submitted on '+esc(new Date(intake.submittedAt).toLocaleDateString())+'. Need to make a change? Just email us.</div>'
      + '<div id="detailsFormHost"></div>';
  } else {
    el.innerHTML = '<div id="detailsFormHost"></div>';
  }

  renderDetailsForm(document.getElementById('detailsFormHost'));
}

function renderDetailsForm(host){
  let html = '';
  html += '<div class="form-progress"><span>'+progressPct()+'% complete</span><div class="bar"><div class="bar-fill" style="width:'+progressPct()+'%"></div></div><span class="save-status" id="saveStatus">Saves automatically</span></div>';

  // Menu confirmation
  html += '<div class="section-block">'
    + '<h3>Menu confirmation</h3>'
    + '<div class="toggle-row" data-toggle="menuConfirmed">'
      + '<button type="button" class="toggle-btn'+(intake.menuConfirmed===true?' selected':'')+'" data-val="true">Confirmed as-is</button>'
      + '<button type="button" class="toggle-btn'+(intake.menuConfirmed===false?' selected':'')+'" data-val="false">I need a change</button>'
    + '</div>'
    + (intake.menuConfirmed===false ? '<div class="field-row"><label>What needs to change?</label><textarea data-field="menuChangeNotes" rows="2">'+esc(intake.menuChangeNotes)+'</textarea></div>' : '')
    + '</div>';

  // Meal blocks
  intake.meals.forEach(function(m, i){
    html += renderMealBlock(m, i);
  });
  html += '<button type="button" class="add-meal-link" id="addMealBtn">+ Add another meal / session</button>';

  // Wine & liquor
  html += '<div class="section-block" style="margin-top:16px">'
    + '<h3>Wine &amp; liquor</h3>'
    + '<div class="toggle-row" data-toggle="wineLiquor">'
      + '<button type="button" class="toggle-btn'+(intake.wineLiquor===true?' selected':'')+'" data-val="true">Yes, there will be alcohol</button>'
      + '<button type="button" class="toggle-btn'+(intake.wineLiquor===false?' selected':'')+'" data-val="false">No alcohol</button>'
    + '</div>'
    + (intake.wineLiquor===true ?
        ('<div class="reminder-note">All wines must be mevushal, and all liquor must appear on the CRC or Star-K approved list. '
          + '<a href="https://consumer.crckosher.org/liquor/" target="_blank" rel="noopener">CRC approved list ↗</a> · '
          + '<a href="https://www.star-k.org/resource/list/W56J90P5/all_liquor" target="_blank" rel="noopener">Star-K approved list ↗</a></div>'
          + renderUploadField('Upload your wine / liquor list', 'liquorListFiles', 'liquor'))
      : '')
    + '</div>';

  // Allergies
  html += '<div class="section-block"><h3>Allergies</h3>'
    + '<div class="field-row"><textarea data-field="allergies" rows="2" placeholder="List any guest allergies we should know about">'+esc(intake.allergies)+'</textarea></div></div>';

  // Vendors
  html += '<div class="section-block"><h3>Vendors</h3>'
    + '<div class="field-grid-3">'
      + '<div class="field-row"><label>Musician</label><input type="text" data-field="musicianName" value="'+esc(intake.musicianName)+'" placeholder="Name"></div>'
      + '<div class="field-row"><label>Florist</label><input type="text" data-field="floristName" value="'+esc(intake.floristName)+'" placeholder="Name"></div>'
      + '<div class="field-row"><label>Photographer</label><input type="text" data-field="photographerName" value="'+esc(intake.photographerName)+'" placeholder="Name"></div>'
    + '</div></div>';

  // Logo
  html += '<div class="section-block"><h3>Logo</h3>' + renderUploadField('Upload your logo, if applicable', 'logoFiles', 'logo') + '</div>';

  // Ceremony (weddings only)
  if(isWedding()){
    html += '<div class="section-block"><h3>Ceremony procession &amp; music</h3>' + renderUploadField('Upload procession order and music list', 'ceremonyFiles', 'ceremony') + '</div>';
  }

  // Other
  html += '<div class="section-block"><h3>Anything else?</h3>'
    + '<div class="field-row"><textarea data-field="otherNotes" rows="3" placeholder="Any other important information">'+esc(intake.otherNotes)+'</textarea></div>'
    + renderUploadField('Upload any other files', 'otherFiles', 'other')
    + '</div>';

  html += '<div class="submit-bar"><button class="btn-primary" id="submitDetailsBtn">'+(intake.submittedAt?'Update Submission':'Submit Details')+'</button></div>'
    + '<div class="autosave-note">Your answers save automatically as you go — come back anytime with your link.</div>';

  host.innerHTML = html;
  wireDetailsEvents(host);
}

function renderMealBlock(m, i){
  const canRemove = intake.meals.length > 1;
  return '<div class="section-block" data-meal-index="'+i+'">'
    + '<span class="meal-tag">'+esc(m.label||('Meal '+(i+1)))+(canRemove?' <button type="button" class="meal-remove" data-remove-meal="'+i+'">✕ remove</button>':'')+'</span>'
    + '<div class="field-row"><label>Meal / session label</label><input type="text" data-meal-field="label" data-meal-index="'+i+'" value="'+esc(m.label)+'" placeholder="e.g. Friday Dinner"></div>'
    + '<div class="field-grid-3">'
      + '<div class="field-row"><label>Adults</label><input type="number" min="0" data-meal-field="guestAdults" data-meal-index="'+i+'" value="'+esc(m.guestAdults)+'"></div>'
      + '<div class="field-row"><label>Kids</label><input type="number" min="0" data-meal-field="guestKids" data-meal-index="'+i+'" value="'+esc(m.guestKids)+'"></div>'
      + '<div class="field-row"><label>Start time</label><input type="time" data-meal-field="startTime" data-meal-index="'+i+'" value="'+esc(m.startTime)+'"></div>'
    + '</div>'
    + '<div class="field-grid-2">'
      + '<div class="field-row"><label>Floorplan / seating list</label>'+renderMealUploadField('floorplanFiles', i)+'</div>'
      + '<div class="field-row"><label>Event schedule</label>'+renderMealUploadField('scheduleFiles', i)+'</div>'
    + '</div>'
    + '<h3 style="margin-top:14px;font-size:13.5px">Linens</h3>'
    + '<a class="helper-link" href="https://linenswatches.com/fabrics/basic-solids/standard-polyester/" target="_blank" rel="noopener">↗ Browse fabric swatches &amp; colors</a>'
    + '<div class="field-grid-3">'
      + '<div class="field-row"><label>Table linen color</label><input type="text" data-meal-field="linenTable" data-meal-index="'+i+'" value="'+esc(m.linenTable)+'"></div>'
      + '<div class="field-row"><label>Buffet / side tables</label><input type="text" data-meal-field="linenBuffet" data-meal-index="'+i+'" value="'+esc(m.linenBuffet)+'"></div>'
      + '<div class="field-row"><label>Napkins</label><input type="text" data-meal-field="linenNapkins" data-meal-index="'+i+'" value="'+esc(m.linenNapkins)+'"></div>'
    + '</div>'
    + '<div class="toggle-row" data-meal-toggle="clientProvidesLinens" data-meal-index="'+i+'">'
      + '<button type="button" class="toggle-btn'+(m.clientProvidesLinens?' selected':'')+'" data-val="true">I\'m providing my own linens</button>'
      + '<button type="button" class="toggle-btn'+(!m.clientProvidesLinens?' selected':'')+'" data-val="false">Using Premier\'s linens</button>'
    + '</div>'
    + (m.clientProvidesLinens ? '<div class="field-row"><label>Quantity, style, shape &amp; use</label><textarea data-meal-field="clientLinenDetails" data-meal-index="'+i+'" rows="2">'+esc(m.clientLinenDetails)+'</textarea></div>' : '')
    + '</div>';
}

function renderUploadField(labelText, field, pathTag){
  const files = intake[field] || [];
  return '<div class="field-row"><label>'+esc(labelText)+'</label>'
    + '<div class="upload-slot">Drop file or browse<input type="file" data-upload-field="'+field+'" data-upload-path="'+pathTag+'">'
    + (files.length ? ('<ul class="upload-list">'+files.map(function(f,idx){
        return '<li><a href="'+esc(f.url)+'" target="_blank" rel="noopener">📄 '+esc(f.name)+'</a><button type="button" class="upload-remove" data-remove-file-field="'+field+'" data-remove-file-idx="'+idx+'">remove</button></li>';
      }).join('')+'</ul>') : '')
    + '</div></div>';
}

function renderMealUploadField(field, mealIndex){
  const files = (intake.meals[mealIndex][field]) || [];
  return '<div class="upload-slot">Drop file or browse<input type="file" data-meal-upload-field="'+field+'" data-meal-upload-index="'+mealIndex+'">'
    + (files.length ? ('<ul class="upload-list">'+files.map(function(f,idx){
        return '<li><a href="'+esc(f.url)+'" target="_blank" rel="noopener">📄 '+esc(f.name)+'</a><button type="button" class="upload-remove" data-remove-meal-file-field="'+field+'" data-remove-meal-file-meal="'+mealIndex+'" data-remove-meal-file-idx="'+idx+'">remove</button></li>';
      }).join('')+'</ul>') : '')
    + '</div>';
}

function wireDetailsEvents(host){
  // simple top-level fields
  host.querySelectorAll('[data-field]').forEach(function(elx){
    elx.addEventListener('input', function(){
      intake[elx.dataset.field] = elx.value;
      scheduleSave();
    });
  });

  // top-level toggles (menuConfirmed, wineLiquor)
  host.querySelectorAll('[data-toggle]').forEach(function(group){
    group.querySelectorAll('.toggle-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        intake[group.dataset.toggle] = (btn.dataset.val === 'true');
        scheduleSave();
        renderDetailsForm(host);
      });
    });
  });

  // meal fields
  host.querySelectorAll('[data-meal-field]').forEach(function(elx){
    elx.addEventListener('input', function(){
      const idx = parseInt(elx.dataset.mealIndex, 10);
      intake.meals[idx][elx.dataset.mealField] = elx.value;
      if(elx.dataset.mealField === 'label'){
        const tag = host.querySelector('[data-meal-index="'+idx+'"] .meal-tag');
        // label shown live is minor cosmetic; full re-render happens on blur via scheduleSave chain
      }
      scheduleSave();
    });
  });

  // meal toggles (clientProvidesLinens)
  host.querySelectorAll('[data-meal-toggle]').forEach(function(group){
    const idx = parseInt(group.dataset.mealIndex, 10);
    group.querySelectorAll('.toggle-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        intake.meals[idx][group.dataset.mealToggle] = (btn.dataset.val === 'true');
        scheduleSave();
        renderDetailsForm(host);
      });
    });
  });

  // add meal
  const addBtn = document.getElementById('addMealBtn');
  if(addBtn){
    addBtn.addEventListener('click', function(){
      intake.meals.push(emptyMeal('Meal '+(intake.meals.length+1)));
      scheduleSave();
      renderDetailsForm(host);
    });
  }

  // remove meal
  host.querySelectorAll('[data-remove-meal]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const idx = parseInt(btn.dataset.removeMeal, 10);
      intake.meals.splice(idx, 1);
      scheduleSave();
      renderDetailsForm(host);
    });
  });

  // top-level file uploads
  host.querySelectorAll('[data-upload-field]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const file = inp.files[0];
      if(!file) return;
      handleUpload(file, inp.dataset.uploadPath).then(function(meta){
        intake[inp.dataset.uploadField].push(meta);
        scheduleSave();
        renderDetailsForm(host);
      }).catch(function(){
        alert('Upload failed. Please check your connection and try again.');
      });
    });
  });

  // meal-level file uploads
  host.querySelectorAll('[data-meal-upload-field]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const file = inp.files[0];
      if(!file) return;
      const idx = parseInt(inp.dataset.mealUploadIndex, 10);
      handleUpload(file, 'meal'+idx).then(function(meta){
        intake.meals[idx][inp.dataset.mealUploadField].push(meta);
        scheduleSave();
        renderDetailsForm(host);
      }).catch(function(){
        alert('Upload failed. Please check your connection and try again.');
      });
    });
  });

  // remove top-level file
  host.querySelectorAll('[data-remove-file-field]').forEach(function(btn){
    btn.addEventListener('click', function(){
      intake[btn.dataset.removeFileField].splice(parseInt(btn.dataset.removeFileIdx,10), 1);
      scheduleSave();
      renderDetailsForm(host);
    });
  });

  // remove meal file
  host.querySelectorAll('[data-remove-meal-file-field]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const mIdx = parseInt(btn.dataset.removeMealFileMeal,10);
      intake.meals[mIdx][btn.dataset.removeMealFileField].splice(parseInt(btn.dataset.removeMealFileIdx,10), 1);
      scheduleSave();
      renderDetailsForm(host);
    });
  });

  // submit
  const submitBtn = document.getElementById('submitDetailsBtn');
  if(submitBtn){
    submitBtn.addEventListener('click', async function(){
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
      intake.submittedAt = Date.now();
      try{
        await db.collection('clientPortals').doc(pid).set({ clientIntake: intake }, { merge:true });
        renderDetails();
      }catch(e){
        intake.submittedAt = null;
        submitBtn.disabled = false; submitBtn.textContent = 'Submit Details';
        alert('Something went wrong submitting. Please check your connection and try again.');
      }
    });
  }
}

function handleUpload(file, pathTag){
  const path = 'clientPortals/'+pid+'/intake/'+pathTag+'/'+Date.now()+'_'+file.name;
  const ref = storage.ref().child(path);
  return ref.put(file).then(function(snap){
    return snap.ref.getDownloadURL();
  }).then(function(url){
    return { name: file.name, url: url, uploadedAt: Date.now() };
  });
}
</script>
