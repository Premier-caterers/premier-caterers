<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Premier Caterers — Your Event Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
  :root{
    --bg3:#F1F2ED; --card:#FFFFFF;
    --maroon:#7A2E3D; --maroon-deep:#5C2230;
    --brass:#B98B2E; --brass-deep:#8F6A1E; --brass-tint:#FAF0DC;
    --nav-bg:#20262A;
    --text:#23262B; --text2:#62665D;
    --border:#E3E4DC;
    --green-bg:#E7F0E3; --green-text:#37613A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg3);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

  .frame{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

  .portal-header{background:var(--nav-bg);color:#fff;padding:26px 28px 0}
  .brand{font-family:'Fraunces',serif;font-size:14px;letter-spacing:.02em;color:var(--brass);margin-bottom:16px}
  .portal-header h1{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin:0 0 4px;color:#fff}
  .portal-header .sub{color:#A9AEB0;font-size:13.5px;margin-bottom:18px}
  .tabs{display:flex;gap:4px;overflow-x:auto}
  .tab{padding:11px 16px;font-size:13px;font-weight:600;color:#A9AEB0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
  .tab.active{color:#fff;border-bottom-color:var(--brass)}
  .tab:disabled{opacity:.4;cursor:not-allowed}

  .panel{padding:26px 28px 34px;display:none}
  .panel.active{display:block}

  .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .overview-cell{background:var(--card);padding:16px 18px}
  .overview-cell .label{font-size:11px;color:var(--text2);margin-bottom:4px}
  .overview-cell .value{font-size:15px;font-weight:600}
  .job-pill{display:inline-block;background:var(--maroon);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .type-pill{display:inline-block;background:var(--brass-tint);color:var(--brass-deep);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .welcome-note{color:var(--text2);font-size:13.5px;margin-top:20px;line-height:1.65}
  .welcome-note a{color:var(--maroon)}

  .invoice-summary{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .invoice-summary .total-label{color:var(--text2);font-size:12.5px}
  .invoice-summary .total-num{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--maroon)}

  /* Invoice document (mirrors the caterer's printed invoice) */
  .inv-doc{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .inv-doc-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg3)}
  .inv-doctype{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--maroon)}
  .inv-meta-line{font-size:12px;color:var(--text2);margin-top:2px}
  .inv-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .inv-table thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);padding:10px 20px;background:var(--bg3);border-bottom:1px solid var(--border)}
  .inv-table tbody td{padding:11px 20px;border-bottom:1px solid var(--border)}
  .inv-table tbody tr:last-child td{border-bottom:none}
  .inv-empty{padding:24px 20px;text-align:center;color:var(--text2);font-size:13px}
  .inv-totals{padding:14px 20px;background:var(--bg3);border-top:1px solid var(--border)}
  .inv-totals .tot-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;color:var(--text)}
  .inv-totals .tot-row.grand{font-family:'Fraunces',serif;font-size:16px;font-weight:600;border-top:1px solid var(--border);margin-top:4px;padding-top:9px}
  .inv-totals .tot-row.paid{color:var(--green-text)}
  .inv-totals .tot-row.balance{font-weight:700;color:var(--maroon);font-size:15px;border-top:2px solid var(--maroon);margin-top:4px;padding-top:9px}
  table.invoice-table{width:100%;border-collapse:collapse;font-size:13.5px}
  table.invoice-table th{text-align:left;font-weight:600;color:var(--text2);font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--border)}
  table.invoice-table td{padding:11px 0;border-bottom:1px solid var(--border)}
  table.invoice-table td:last-child, table.invoice-table th:last-child{text-align:right}

  .deposit-box{margin-top:22px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .deposit-box .dep-label{font-size:12.5px;color:var(--text2);margin-bottom:2px}
  .deposit-box .dep-amt{font-family:'Fraunces',serif;font-size:20px}
  .btn-primary{background:var(--maroon);color:#fff;border:none;padding:12px 22px;font-size:13.5px;font-weight:700;border-radius:8px;font-family:inherit;cursor:pointer}
  .btn-primary:hover{background:var(--maroon-deep)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}

  .paid-banner{background:var(--green-bg);border:2px solid var(--green-text);border-radius:10px;padding:16px 18px;text-align:center;color:var(--green-text);font-weight:600;margin-top:22px}

  .placeholder-note{color:var(--text2);font-size:13.5px;text-align:center;padding:30px 10px}

  .form-progress{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:12.5px;color:var(--text2)}
  .form-progress .bar{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
  .form-progress .bar-fill{height:100%;background:var(--brass);transition:width .3s}
  .save-status{font-size:11.5px;color:var(--text2);white-space:nowrap}
  .save-status.saving{color:var(--brass-deep)}
  .save-status.saved{color:var(--green-text)}

  .submitted-banner{background:var(--green-bg);border:2px solid var(--green-text);border-radius:10px;padding:16px 18px;text-align:center;color:var(--green-text);font-weight:600;margin-bottom:20px}

  .details-intro{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}

  .section-block{border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:16px;background:var(--card)}
  .section-block h3{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .section-block h3.tight{margin-bottom:10px;padding-bottom:0;border-bottom:none}
  .section-block h3 .step-dot{width:22px;height:22px;border-radius:50%;background:var(--brass-tint);color:var(--brass-deep);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .helper-link{font-size:12px;color:var(--maroon);text-decoration:none;display:inline-block;margin-bottom:12px}
  .helper-link:hover{text-decoration:underline}

  .field-row{margin-bottom:14px}
  .field-row:last-child{margin-bottom:0}
  .field-row label{display:block;font-size:11.5px;font-weight:500;color:var(--text2);margin-bottom:5px}
  .field-row input[type=text], .field-row input[type=number], .field-row input[type=time], .field-row textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13.5px;background:var(--bg3);transition:border-color .15s,background .15s
  }
  .field-row input:focus, .field-row textarea:focus{outline:none;border-color:var(--maroon);background:#fff;box-shadow:0 0 0 3px rgba(122,46,61,.08)}
  .field-row textarea{resize:vertical;min-height:64px}
  .field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:520px){ .field-grid-2, .field-grid-3{grid-template-columns:1fr} }

  .field-subhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:16px 0 10px}

  .upload-slot{border:1.5px dashed var(--border);border-radius:9px;padding:14px;font-size:12.5px;color:var(--text2);background:var(--bg3);transition:border-color .15s}
  .upload-slot:hover{border-color:var(--brass)}
  .upload-slot input[type=file]{display:block;font-size:12px;margin-top:8px}
  .upload-list{list-style:none;margin-top:10px;padding:0}
  .upload-list li{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-top:1px dashed var(--border)}
  .upload-list a{color:var(--maroon);text-decoration:none}
  .upload-remove{background:none;border:none;color:#B15A38;font-size:12px;cursor:pointer;font-family:inherit;padding:0 0 0 8px}

  .meal-block{border:1px solid var(--border);border-left:3px solid var(--brass);border-radius:10px;padding:18px 20px;margin-bottom:16px;background:var(--card)}
  .meal-tag{display:inline-flex;align-items:center;gap:8px;background:var(--nav-bg);color:#fff;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:16px}
  .meal-remove{background:none;border:none;color:#DDBFC5;cursor:pointer;font-size:13px;font-family:inherit;padding:0}
  .add-meal-link{font-size:13px;color:var(--maroon);font-weight:600;cursor:pointer;background:var(--brass-tint);border:1px dashed var(--brass);font-family:inherit;padding:10px 16px;display:block;width:100%;border-radius:9px;text-align:center;margin-bottom:16px}
  .add-meal-link:hover{background:#F6E9CE}

  .toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .toggle-btn{padding:9px 16px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:var(--bg3);cursor:pointer;font-family:inherit;transition:all .12s}
  .toggle-btn:hover{border-color:var(--maroon)}
  .toggle-btn.selected{background:var(--maroon);color:#fff;border-color:var(--maroon)}

  .reminder-note{background:var(--brass-tint);border:1px solid #EBD9AE;border-radius:8px;padding:12px 14px;font-size:12px;color:var(--brass-deep);margin-bottom:14px;line-height:1.55}
  .reminder-note a{color:var(--maroon);font-weight:600;text-decoration:none}
  .reminder-note a:hover{text-decoration:underline}

  .submit-bar{display:flex;justify-content:flex-end;margin-top:22px}
  .submit-bar .btn-primary{padding:13px 30px;font-size:14px}
  .autosave-note{text-align:center;color:var(--text2);font-size:11.5px;margin-top:12px}

  .doc-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin:20px 0 10px}
  .doc-group-title:first-child{margin-top:0}
  .doc-list{list-style:none}
  .doc-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--card)}
  .doc-item .doc-ic{font-size:16px}
  .doc-item a{color:var(--maroon);text-decoration:none;font-size:13.5px;font-weight:600;flex:1}
  .doc-item a:hover{text-decoration:underline}
  .doc-item .doc-meta{font-size:11.5px;color:var(--text2)}
  .doc-empty{color:var(--text2);font-size:13px;padding:10px 0}

  .thread-toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--text2);padding:8px 14px;font-size:12.5px;font-weight:600;border-radius:7px;cursor:pointer;font-family:inherit}
  .btn-ghost:hover{border-color:var(--maroon);color:var(--maroon)}
  .thread{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .thread-empty{color:var(--text2);font-size:13.5px;text-align:center;padding:24px 10px}
  .msg{max-width:80%;border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5}
  .msg-client{align-self:flex-end;background:var(--maroon);color:#fff;border-bottom-right-radius:3px}
  .msg-caterer{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:3px}
  .msg .msg-meta{font-size:10.5px;opacity:.75;margin-bottom:4px}
  .msg .msg-attach{display:block;margin-top:6px;font-size:12px}
  .msg-client .msg-attach a{color:#fff}
  .msg-caterer .msg-attach a{color:var(--maroon)}
  .composer{border:1px solid var(--border);border-radius:10px;padding:14px}
  .composer textarea{width:100%;border:none;resize:vertical;min-height:60px;font-family:inherit;font-size:13.5px;background:none}
  .composer textarea:focus{outline:none}
  .composer-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;border-top:1px solid var(--border);padding-top:10px}
  .composer-attach{font-size:12px;color:var(--text2)}
  .composer-attach input[type=file]{font-size:11.5px}

  @media print{
    body *{visibility:hidden}
    #panel-questions, #panel-questions *{visibility:visible}
    #panel-questions{position:absolute;top:0;left:0;width:100%;padding:0}
    .composer, .thread-toolbar{display:none}
    .msg{max-width:100%}
  }

  .state{text-align:center;padding:60px 20px}
  .state .ic{font-size:44px}
  .state h1{font-family:'Fraunces',serif;margin:14px 0 6px;font-size:21px}
  .state p{color:var(--text2);font-size:14.5px}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--maroon);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:520px){
    .overview-grid{grid-template-columns:1fr}
    .invoice-summary .total-num{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="spinner"></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeBI51t7ydOt6uOuvJ1BjQhwiX9d8jaJc",
  authDomain: "premier-caterers-internal-app.firebaseapp.com",
  projectId: "premier-caterers-internal-app",
  storageBucket: "premier-caterers-internal-app.firebasestorage.app",
  messagingSenderId: "471701398759",
  appId: "1:471701398759:web:559a7bee3b645ce545ee42"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const root = document.getElementById('root');

function qp(k){ return new URLSearchParams(location.search).get(k); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(v){ return '$'+(parseFloat(v||0)).toFixed(2); }
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso+'T00:00:00Z');
    return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
  }catch(e){ return iso; }
}

function stateScreen(icon, title, msg){
  root.innerHTML = '<div class="frame"><div class="state"><div class="ic">'+icon+'</div><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p></div></div>';
}

const pid = qp('p'), tok = qp('t');
let portalDoc = null;
let shellBuilt = false;
let activeTab = 'overview';

(function(){
  if(!pid || !tok){ stateScreen('🔗','Link incomplete','This portal link is missing information. Please use the exact link from your email.'); return; }

  db.collection('clientPortals').doc(pid).onSnapshot(function(snap){
    if(!snap.exists){ stateScreen('🔍','Event not found','We could not find this event. Please contact Premier Caterers at events@thepremiercaterer.com.'); return; }
    const data = snap.data();
    if(String(data.token||'') !== String(tok)){ stateScreen('🔒','Invalid link','This portal link is not valid. Please use the exact link from your email, or contact us at events@thepremiercaterer.com.'); return; }

    const firstLoad = !shellBuilt;
    portalDoc = data;

    if(firstLoad){
      try{ db.collection('clientPortals').doc(pid).update({ lastViewedAt: Date.now() }); }catch(e){}
      renderShell();
      shellBuilt = true;
    } else {
      // live update — refresh panels in place without disturbing the active tab
      refreshPanels();
    }
  }, function(err){
    if(!shellBuilt) stateScreen('⚠️','Could not load','Something went wrong loading your event. Please try again, or contact us at events@thepremiercaterer.com.');
  });
})();

function refreshPanels(){
  // Re-render everything EXCEPT the questions composer if the user is mid-type,
  // so a live caterer reply doesn't wipe what they're writing.
  renderOverview();
  renderInvoice();
  renderDetails();
  renderDocuments();
  const qEl = document.getElementById('questionText');
  const typing = qEl && document.activeElement === qEl && qEl.value.trim();
  if(typing){
    // just refresh the thread list, leave composer alone
    refreshThreadOnly();
  } else {
    renderQuestions();
  }
}

function renderShell(){
  root.innerHTML =
    '<div class="frame">'
    + '<div class="portal-header">'
      + '<div class="brand">Premier Caterers</div>'
      + '<h1>'+esc(portalDoc.eventName||'Your Event')+'</h1>'
      + '<div class="sub">'+esc(fmtDate(portalDoc.eventDate))+(portalDoc.venue?(' · '+esc(portalDoc.venue)):'')+'</div>'
      + '<div class="tabs">'
        + '<button class="tab'+(activeTab==='overview'?' active':'')+'" data-tab="overview">Overview</button>'
        + '<button class="tab'+(activeTab==='invoice'?' active':'')+'" data-tab="invoice">Invoice &amp; Payment</button>'
        + '<button class="tab'+(activeTab==='details'?' active':'')+'" data-tab="details">Event Details</button>'
        + '<button class="tab'+(activeTab==='documents'?' active':'')+'" data-tab="documents">Documents</button>'
        + '<button class="tab'+(activeTab==='questions'?' active':'')+'" data-tab="questions">Questions</button>'
      + '</div>'
    + '</div>'
    + '<div class="panel'+(activeTab==='overview'?' active':'')+'" id="panel-overview"></div>'
    + '<div class="panel'+(activeTab==='invoice'?' active':'')+'" id="panel-invoice"></div>'
    + '<div class="panel'+(activeTab==='details'?' active':'')+'" id="panel-details"></div>'
    + '<div class="panel'+(activeTab==='documents'?' active':'')+'" id="panel-documents"></div>'
    + '<div class="panel'+(activeTab==='questions'?' active':'')+'" id="panel-questions"></div>'
    + '</div>';

  document.querySelectorAll('.tab[data-tab]').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  renderOverview();
  renderInvoice();
  renderDetails();
  renderDocuments();
  renderQuestions();
}

function renderOverview(){
  const el = document.getElementById('panel-overview');
  el.innerHTML =
    '<div class="overview-grid">'
    + '<div class="overview-cell"><div class="label">Job Number</div><div class="value"><span class="job-pill">'+esc(portalDoc.jobNumber||'—')+'</span></div></div>'
    + '<div class="overview-cell"><div class="label">Event Type</div><div class="value"><span class="type-pill">'+esc(portalDoc.eventType||'—')+'</span></div></div>'
    + '<div class="overview-cell"><div class="label">Date</div><div class="value">'+esc(fmtDate(portalDoc.eventDate))+'</div></div>'
    + '<div class="overview-cell"><div class="label">Venue</div><div class="value">'+esc(portalDoc.venue||'—')+'</div></div>'
    + '<div class="overview-cell"><div class="label">Balance Due</div><div class="value" style="color:var(--maroon)">'+money(balanceRemaining())+'</div></div>'
    + '</div>'
    + '<p class="welcome-note">Welcome — this is where you can review your invoice and pay your deposit. Questions any time? Reach us at <a href="mailto:events@thepremiercaterer.com">events@thepremiercaterer.com</a>.</p>';
}

function balanceRemaining(){
  const inv = portalDoc.invoiceSnapshot || {};
  return (parseFloat(inv.total||0)) - (parseFloat(inv.paid||0));
}

function renderInvoice(){
  const el = document.getElementById('panel-invoice');
  const inv = portalDoc.invoiceSnapshot || {};
  const items = inv.items || [];
  const isInvoice = (inv.docType || 'invoice') !== 'quote';

  // Prefer the full breakdown pushed from the app; fall back to simple total/paid.
  const hasBreakdown = inv.subtotal != null || inv.tax != null || inv.logistics != null;
  const subtotal = parseFloat(inv.subtotal||0);
  const logistics = parseFloat(inv.logistics||0);
  const tax = parseFloat(inv.tax||0);
  const grand = inv.total != null ? parseFloat(inv.total) : (subtotal+logistics+tax);
  const deposit = parseFloat(inv.paid || portalDoc.depositAmount || 0);
  const balance = grand - deposit;

  let rows = items.map(function(it){
    const amt = it.amount != null ? it.amount : (parseFloat(it.qty||0)*parseFloat(it.price||0));
    return '<tr><td>'+esc(it.name||it.description||'')+'</td><td style="text-align:center">'+esc(it.qty!=null?it.qty:'')+'</td><td style="text-align:right">'+money(amt)+'</td></tr>';
  }).join('');

  const depositPaid = !!portalDoc.depositPaid || (deposit>0 && balance<=0.01);
  const depositAmt = parseFloat(portalDoc.depositAmount||0);

  let totalsRows = '';
  if(hasBreakdown){
    totalsRows =
      '<div class="tot-row"><span>Subtotal</span><span>'+money(subtotal)+'</span></div>'
      + (logistics>0 ? '<div class="tot-row"><span>Logistics &amp; service</span><span>'+money(logistics)+'</span></div>' : '')
      + (tax>0 ? '<div class="tot-row"><span>Tax</span><span>'+money(tax)+'</span></div>' : '');
  }

  el.innerHTML =
    '<div class="inv-doc">'
      + '<div class="inv-doc-head">'
        + '<div><div class="inv-doctype">'+(isInvoice?'Invoice':'Estimate')+'</div>'
          + '<div class="inv-meta-line">'+esc(inv.number||'')+(portalDoc.eventDate?(' · '+esc(fmtDate(portalDoc.eventDate))):'')+'</div></div>'
        + '<button class="btn-ghost" id="dlInvoiceBtn">⬇ Download</button>'
      + '</div>'
      + (items.length ? ('<table class="inv-table"><thead><tr><th>Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>') : '<div class="inv-empty">Your itemized invoice will appear here.</div>')
      + '<div class="inv-totals">'
        + totalsRows
        + '<div class="tot-row grand"><span>'+(isInvoice?'Total':'Estimate total')+'</span><span>'+money(grand)+'</span></div>'
        + (deposit>0 ? '<div class="tot-row paid"><span>Deposit / paid</span><span>−'+money(deposit)+'</span></div>' : '')
        + '<div class="tot-row balance"><span>Balance due</span><span>'+money(balance)+'</span></div>'
      + '</div>'
    + '</div>'
    + (depositPaid
        ? '<div class="paid-banner">✓ '+(balance<=0.01 && deposit>0 ? 'Paid in full' : 'Deposit of '+money(depositAmt))+' received — thank you!</div>'
        : (depositAmt > 0
            ? ('<div class="deposit-box"><div><div class="dep-label">Deposit due to confirm your date</div><div class="dep-amt">'+money(depositAmt)+'</div></div><button class="btn-primary" id="payBtn">Pay Deposit</button></div>')
            : ''));

  const payBtn = document.getElementById('payBtn');
  if(payBtn) payBtn.addEventListener('click', startCheckout);
  const dlBtn = document.getElementById('dlInvoiceBtn');
  if(dlBtn) dlBtn.addEventListener('click', downloadInvoicePdf);
}

function downloadInvoicePdf(){
  const inv = portalDoc.invoiceSnapshot || {};
  // If the app has pushed a ready-made invoice HTML document, use it verbatim
  // (this is the exact same document the caterer sees/prints). Otherwise build
  // a clean one from the snapshot fields.
  const html = inv.printHtml || buildPortalInvoiceHtml();
  const w = window.open('','_blank');
  if(!w){ alert('Please allow pop-ups to download your invoice.'); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 400);
}

function scheduleSave(){
  const statusEl = document.getElementById('saveStatus');
  if(statusEl){ statusEl.textContent = 'Saving…'; statusEl.className = 'save-status saving'; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async function(){
    try{
      await db.collection('clientPortals').doc(pid).set({ clientIntake: intake }, { merge:true });
      const s = document.getElementById('saveStatus');
      if(s){ s.textContent = 'Saved ✓'; s.className = 'save-status saved'; }
    }catch(e){
      const s = document.getElementById('saveStatus');
      if(s){ s.textContent = 'Save failed — check connection'; s.className = 'save-status'; }
    }
  }, 700);
}

function progressPct(){
  const checks = [];
  checks.push(intake.menuConfirmed !== null);
  intake.meals.forEach(function(m){
    checks.push(!!m.guestAdults, !!m.startTime);
  });
  checks.push(intake.wineLiquor !== null);
  checks.push(!!intake.allergies || intake.allergies === '');
  checks.push(!!intake.musicianName || !!intake.floristName || !!intake.photographerName);
  const done = checks.filter(Boolean).length;
  return Math.round((done/checks.length)*100);
}

function wireDetailsEvents(host){
  // simple top-level fields
  host.querySelectorAll('[data-field]').forEach(function(elx){
    elx.addEventListener('input', function(){
      intake[elx.dataset.field] = elx.value;
      scheduleSave();
    });
  });

  // top-level toggles (menuConfirmed, wineLiquor)
  host.querySelectorAll('[data-toggle]').forEach(function(group){
    group.querySelectorAll('.toggle-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        intake[group.dataset.toggle] = (btn.dataset.val === 'true');
        scheduleSave();
        renderDetailsForm(host);
      });
    });
  });

  // meal fields
  host.querySelectorAll('[data-meal-field]').forEach(function(elx){
    elx.addEventListener('input', function(){
      const idx = parseInt(elx.dataset.mealIndex, 10);
      intake.meals[idx][elx.dataset.mealField] = elx.value;
      if(elx.dataset.mealField === 'label'){
        const tag = host.querySelector('[data-meal-index="'+idx+'"] .meal-tag');
        // label shown live is minor cosmetic; full re-render happens on blur via scheduleSave chain
      }
      scheduleSave();
    });
  });

  // meal toggles (clientProvidesLinens)
  host.querySelectorAll('[data-meal-toggle]').forEach(function(group){
    const idx = parseInt(group.dataset.mealIndex, 10);
    group.querySelectorAll('.toggle-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        intake.meals[idx][group.dataset.mealToggle] = (btn.dataset.val === 'true');
        scheduleSave();
        renderDetailsForm(host);
      });
    });
  });

  // add meal
  const addBtn = document.getElementById('addMealBtn');
  if(addBtn){
    addBtn.addEventListener('click', function(){
      intake.meals.push(emptyMeal('Meal '+(intake.meals.length+1)));
      scheduleSave();
      renderDetailsForm(host);
    });
  }

  // remove meal
  host.querySelectorAll('[data-remove-meal]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const idx = parseInt(btn.dataset.removeMeal, 10);
      intake.meals.splice(idx, 1);
      scheduleSave();
      renderDetailsForm(host);
    });
  });

  // top-level file uploads
  host.querySelectorAll('[data-upload-field]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const file = inp.files[0];
      if(!file) return;
      handleUpload(file, inp.dataset.uploadPath).then(function(meta){
        intake[inp.dataset.uploadField].push(meta);
        scheduleSave();
        renderDetailsForm(host);
      }).catch(function(){
        alert('Upload failed. Please check your connection and try again.');
      });
    });
  });

  // meal-level file uploads
  host.querySelectorAll('[data-meal-upload-field]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const file = inp.files[0];
      if(!file) return;
      const idx = parseInt(inp.dataset.mealUploadIndex, 10);
      handleUpload(file, 'meal'+idx).then(function(meta){
        intake.meals[idx][inp.dataset.mealUploadField].push(meta);
        scheduleSave();
        renderDetailsForm(host);
      }).catch(function(){
        alert('Upload failed. Please check your connection and try again.');
      });
    });
  });

  // remove top-level file
  host.querySelectorAll('[data-remove-file-field]').forEach(function(btn){
    btn.addEventListener('click', function(){
      intake[btn.dataset.removeFileField].splice(parseInt(btn.dataset.removeFileIdx,10), 1);
      scheduleSave();
      renderDetailsForm(host);
    });
  });

  // remove meal file
  host.querySelectorAll('[data-remove-meal-file-field]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const mIdx = parseInt(btn.dataset.removeMealFileMeal,10);
      intake.meals[mIdx][btn.dataset.removeMealFileField].splice(parseInt(btn.dataset.removeMealFileIdx,10), 1);
      scheduleSave();
      renderDetailsForm(host);
    });
  });

  // submit
  const submitBtn = document.getElementById('submitDetailsBtn');
  if(submitBtn){
    submitBtn.addEventListener('click', async function(){
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';
      intake.submittedAt = Date.now();
      try{
        await db.collection('clientPortals').doc(pid).set({ clientIntake: intake }, { merge:true });
        renderDetails();
      }catch(e){
        intake.submittedAt = null;
        submitBtn.disabled = false; submitBtn.textContent = 'Submit Details';
        alert('Something went wrong submitting. Please check your connection and try again.');
      }
    });
  }
}

function handleUpload(file, pathTag, folder){
  const path = 'clientPortals/'+pid+'/'+(folder||'intake')+'/'+pathTag+'/'+Date.now()+'_'+file.name;
  const ref = storage.ref().child(path);
  return ref.put(file).then(function(snap){
    return snap.ref.getDownloadURL();
  }).then(function(url){
    return { name: file.name, url: url, uploadedAt: Date.now() };
  });
}

// ───────────────────────── Documents ─────────────────────────

function renderDocuments(){
  const el = document.getElementById('panel-documents');
  const catererDocs = portalDoc.catererDocuments || {};

  // Build the "From Premier Caterers" list. Menu uses the PDF export URL, never
  // the editable doc. Contract and Invoice are generated on demand.
  const catererEntries = [];
  if(catererDocs.menuPdf && catererDocs.menuPdf.url){
    catererEntries.push({ ic:'📋', label:'Menu (PDF)', url: catererDocs.menuPdf.url });
  } else if(catererDocs.menu && catererDocs.menu.url){
    catererEntries.push({ ic:'📋', label:'Menu (PDF)', url: toPdfUrl(catererDocs.menu.url) });
  }
  if(catererDocs.contract && catererDocs.contract.url){
    catererEntries.push({ ic:'📝', label:'Contract', url: catererDocs.contract.url });
  }

  let html = '<div class="doc-group-title">From Premier Caterers</div>';
  const invRow = '<li class="doc-item"><span class="doc-ic">🧾</span><a href="#" id="docInvoiceLink">Invoice (PDF)</a><span class="doc-meta">generated</span></li>';
  html += '<ul class="doc-list">'
    + catererEntries.map(function(e){
        return '<li class="doc-item"><span class="doc-ic">'+e.ic+'</span><a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.label)+'</a></li>';
      }).join('')
    + invRow
    + '</ul>';

  // Client's own uploads (from the Event Details form)
  const clientDocs = collectClientDocuments();
  html += '<div class="doc-group-title">Your Uploads</div>';
  html += clientDocs.length
    ? ('<ul class="doc-list">'+clientDocs.map(function(d){
        return '<li class="doc-item"><span class="doc-ic">📄</span><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.name)+'</a><span class="doc-meta">'+esc(d.category)+'</span></li>';
      }).join('')+'</ul>')
    : '<div class="doc-empty">Files you upload in the Event Details tab will show up here.</div>';

  // Optional: client can stash their own outside-vendor docs (florist, band contract, etc.)
  const vendorDocs = (portalDoc.clientVendorDocs || []);
  html += '<div class="doc-group-title">Other Vendor Documents <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text2)">(optional — keep everything in one place)</span></div>';
  if(vendorDocs.length){
    html += '<ul class="doc-list">'+vendorDocs.map(function(d,i){
      return '<li class="doc-item"><span class="doc-ic">📎</span><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.name)+'</a><button class="upload-remove" data-remove-vendor="'+i+'">remove</button></li>';
    }).join('')+'</ul>';
  }
  html += '<div class="upload-slot" style="margin-top:8px">Add a document (florist, band, photographer, etc.)<input type="file" id="vendorDocInput"></div>';

  el.innerHTML = html;

  const invLink = document.getElementById('docInvoiceLink');
  if(invLink) invLink.addEventListener('click', function(ev){ ev.preventDefault(); downloadInvoicePdf(); });

  const vInput = document.getElementById('vendorDocInput');
  if(vInput) vInput.addEventListener('change', function(){
    const file = vInput.files[0]; if(!file) return;
    handleUpload(file, 'vendor', 'vendorDocs').then(function(meta){
      const list = (portalDoc.clientVendorDocs||[]).concat([meta]);
      return db.collection('clientPortals').doc(pid).set({ clientVendorDocs: list }, { merge:true });
    }).catch(function(){ alert('Upload failed. Please try again.'); });
  });

  el.querySelectorAll('[data-remove-vendor]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const idx = parseInt(btn.dataset.removeVendor,10);
      const list = (portalDoc.clientVendorDocs||[]).slice();
      list.splice(idx,1);
      db.collection('clientPortals').doc(pid).set({ clientVendorDocs: list }, { merge:true });
    });
  });
}

// Convert a Google Docs/Sheets/Drive link into its direct PDF-export URL
// (mirrors the app's menuPdfUrl so clients never see an editable doc).
function toPdfUrl(link){
  if(!link) return '#';
  var doc = link.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
  var sheet = link.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  var file = link.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(doc)   return 'https://docs.google.com/document/d/'+doc[1]+'/export?format=pdf';
  if(sheet) return 'https://docs.google.com/spreadsheets/d/'+sheet[1]+'/export?format=pdf';
  if(file)  return 'https://drive.google.com/uc?export=download&id='+file[1];
  return link;
}

function collectClientDocuments(){
  const list = [];
  const ii = portalDoc.clientIntake;
  if(!ii) return list;
  (ii.meals||[]).forEach(function(m){
    (m.floorplanFiles||[]).forEach(function(f){ list.push({ name:f.name, url:f.url, category:(m.label||'Meal')+' — Floorplan' }); });
    (m.scheduleFiles||[]).forEach(function(f){ list.push({ name:f.name, url:f.url, category:(m.label||'Meal')+' — Schedule' }); });
  });
  (ii.liquorListFiles||[]).forEach(function(f){ list.push({ name:f.name, url:f.url, category:'Wine / liquor list' }); });
  (ii.logoFiles||[]).forEach(function(f){ list.push({ name:f.name, url:f.url, category:'Logo' }); });
  (ii.ceremonyFiles||[]).forEach(function(f){ list.push({ name:f.name, url:f.url, category:'Ceremony' }); });
  (ii.otherFiles||[]).forEach(function(f){ list.push({ name:f.name, url:f.url, category:'Other' }); });
  return list;
}

// ───────────────────────── Questions (chat thread) ─────────────────────────

function threadHtml(){
  const msgs = portalDoc.messages || [];
  let html = '';
  if(!msgs.length){
    html += '<div class="thread-empty">No questions yet — ask us anything about your event below.</div>';
  } else {
    msgs.forEach(function(m){
      const who = m.from === 'caterer' ? 'msg-caterer' : 'msg-client';
      const whoLabel = m.from === 'caterer' ? 'Premier Caterers' : 'You';
      html += '<div class="msg '+who+'">'
        + '<div class="msg-meta">'+esc(whoLabel)+' · '+esc(new Date(m.sentAt).toLocaleString())+'</div>'
        + '<div>'+esc(m.text||'').replace(/\n/g,'<br>')+'</div>'
        + (m.attachment ? ('<span class="msg-attach">📎 <a href="'+esc(m.attachment.url)+'" target="_blank" rel="noopener">'+esc(m.attachment.name)+'</a></span>') : '')
        + '</div>';
    });
  }
  return html;
}

function refreshThreadOnly(){
  const list = document.getElementById('threadList');
  if(list){ list.innerHTML = threadHtml(); list.scrollTop = list.scrollHeight; }
}

function renderQuestions(){
  const el = document.getElementById('panel-questions');

  let html = '<div class="thread-toolbar"><button type="button" class="btn-ghost" id="printThreadBtn">🖨 Print this thread</button></div>';
  html += '<div class="thread" id="threadList">'+threadHtml()+'</div>';
  html += '<div class="composer">'
    + '<textarea id="questionText" placeholder="Type a question or note for Premier Caterers…"></textarea>'
    + '<div class="composer-bar">'
      + '<span class="composer-attach">Attach a file (optional): <input type="file" id="questionFile"></span>'
      + '<button class="btn-primary" id="sendQuestionBtn">Send</button>'
    + '</div>'
  + '</div>';

  el.innerHTML = html;

  document.getElementById('sendQuestionBtn').addEventListener('click', sendQuestion);
  document.getElementById('printThreadBtn').addEventListener('click', function(){ window.print(); });

  const list = document.getElementById('threadList');
  if(list) list.scrollTop = list.scrollHeight;
}

async function sendQuestion(){
  const textEl = document.getElementById('questionText');
  const fileEl = document.getElementById('questionFile');
  const btn = document.getElementById('sendQuestionBtn');
  const text = textEl.value.trim();
  const file = fileEl.files[0];
  if(!text && !file) return;

  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    let attachment = null;
    if(file){
      attachment = await handleUpload(file, 'chat', 'messages');
    }
    const msg = { from:'client', text: text, attachment: attachment, sentAt: Date.now() };
    const msgs = (portalDoc.messages || []).concat([msg]);
    // Clear the composer immediately; the live listener will paint the new message.
    textEl.value = ''; fileEl.value = '';
    await db.collection('clientPortals').doc(pid).set({ messages: msgs }, { merge:true });
    btn.disabled = false; btn.textContent = 'Send';
  }catch(e){
    btn.disabled = false; btn.textContent = 'Send';
    alert('Could not send — please check your connection and try again.');
  }
}
</script>
