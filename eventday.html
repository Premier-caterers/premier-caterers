<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Day — Premier Caterers</title>
<meta name="theme-color" content="#7A2E3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" href="eventday-icon-192.png">
<link rel="manifest" href="eventday.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F1F2ED; --card:#FFFFFF; --maroon:#7A2E3D; --maroon-deep:#5C2230; --maroon-tint:#F6E9EC;
    --text:#23262B; --text2:#62665D; --text3:#8A8D84; --border:#E3E4DC;
    --red:#B3261E; --red-bg:#FDECEA; --green:#37613A; --green-bg:#E7F0E3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:16px}
  button{font:inherit;color:inherit}
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px)}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
  .top h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;flex:1;min-width:0}
  .top .who{font-size:13px;color:var(--text2);text-align:right}
  .back{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--text);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .muted{color:var(--text2)} .small{font-size:13px}
  .day-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:18px 2px 8px;display:flex;align-items:center;gap:6px}
  .ev{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;min-height:64px}
  .ev.today{border:3px solid var(--maroon)}
  .ev .nm{font-weight:600;font-size:17px}
  .ev .sub{font-size:13px;color:var(--text2);margin-top:2px}
  .ev .chev{margin-left:auto;font-size:22px;color:var(--text3);flex:none}
  .today-tag{display:inline-flex;align-items:center;gap:4px;background:var(--maroon);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:6px;margin-bottom:4px}
  .hdr h2{font-family:'Fraunces',serif;font-size:24px;font-weight:600;line-height:1.2}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{font-size:12.5px;font-weight:600;border:1px solid var(--border);border-radius:20px;padding:3px 10px;background:#fff;display:inline-flex;align-items:center;gap:4px}
  .staff-badge{display:inline-flex;align-items:center;gap:5px;border:2px dashed var(--maroon);color:var(--maroon-deep);background:var(--maroon-tint);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
  .allergy{display:flex;gap:10px;align-items:flex-start;border:3px solid var(--red);background:var(--red-bg);color:var(--red);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:600}
  .allergy i{font-size:24px;flex:none}
  .rows .r{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
  .rows .r:last-child{border-bottom:none}
  .rows .k{color:var(--text2);flex:none}
  .rows .v{text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
  .sec-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:20px 2px 8px;display:flex;align-items:center;gap:6px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 8px;min-height:96px;cursor:pointer;text-decoration:none;font-weight:600;font-size:14.5px}
  .tile i{font-size:30px}
  .tile.staff{border:2px solid var(--maroon);background:var(--maroon-tint);color:var(--maroon-deep)}
  .tile.none{border:2px dashed #C9CBC2;background:#FAFAF7;color:var(--text3);cursor:default}
  .tile .ts{font-size:11.5px;font-weight:500}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .act{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--text);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;text-decoration:none;min-height:44px}
  .meal-h{font-weight:700;margin:14px 0 4px;font-size:14px;color:var(--maroon-deep)}
  .eq-sec{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin:14px 0 4px}
  .eq-it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px;align-items:center}
  .eq-it .q{margin-left:auto;font-weight:700;flex:none}
  .eq-it.packed .n{text-decoration:line-through;color:var(--text3)}
  .cl-it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px;align-items:flex-start}
  .cl-it i{font-size:20px;flex:none;margin-top:1px}
  .cl-it.done .t{text-decoration:line-through;color:var(--text3)}
  .login{max-width:380px;margin:40px auto 0;text-align:center}
  .login img{width:84px;height:84px;border-radius:20px;margin-bottom:10px}
  .login h1{font-family:'Fraunces',serif;font-size:28px;font-weight:600}
  .who-btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .who-btn{border:2px solid var(--text);background:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:600;cursor:pointer;min-height:54px}
  .pw{width:100%;font:inherit;font-size:17px;padding:14px;border:2px solid var(--text);border-radius:12px;margin-top:16px}
  .go{width:100%;border:none;background:var(--maroon);color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin-top:10px;cursor:pointer;min-height:54px}
  .link{background:none;border:none;color:var(--text2);text-decoration:underline;font-size:14px;margin-top:14px;cursor:pointer;padding:8px}
  .err{color:var(--red);font-weight:600;font-size:14px;margin-top:10px;min-height:20px}
  .empty{text-align:center;color:var(--text2);padding:30px 10px}
  .spin{text-align:center;color:var(--text2);padding:40px 10px}
  .more{display:block;width:100%;border:2px solid var(--text);background:#fff;border-radius:12px;padding:12px;font-weight:600;margin-top:8px;cursor:pointer;min-height:48px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">Loading…</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeBI51t7ydOt6uOuvJ1BjQhwiX9d8jaJc",
  authDomain: "premier-caterers-internal-app.firebaseapp.com",
  projectId: "premier-caterers-internal-app",
  storageBucket: "premier-caterers-internal-app.firebasestorage.app",
  messagingSenderId: "471701398759",
  appId: "1:471701398759:web:559a7bee3b645ce545ee42"
};
// Who can use Event Day. Same sign-in accounts as the main app.
// To add someone later: add them here (and they must already be a staff login in the main app).
const USERS = {
  kenny:   { name:'Kenny',   email:'kenny@thepremiercaterer.com' },
  shelley: { name:'Shelley', email:'shelley@thepremiercaterer.com' },
  josh:    { name:'Josh',    email:'joshg@thepremiercaterer.com' }
};
const PORTAL_BASE_URL = 'portal.html';
const BACK_FROM_SUN = {sunday:0, saturday:1, friday:2, thursday:3, wednesday:4, tuesday:5, monday:6};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const $app = document.getElementById('app');

let me = null;            // key in USERS
let events = [];          // [{ev, inq, date}]
let showDays = 14;
const cache = { equip:{}, check:{}, portal:{} };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function userForEmail(email){ email=(email||'').toLowerCase(); return Object.keys(USERS).find(k=>USERS[k].email===email) || null; }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function dateFromWeekOfDay(weekOf, day){
  if(!weekOf) return null; const back = BACK_FROM_SUN[(day||'').toLowerCase()]; if(back==null) return null;
  return addDays(weekOf, -back);
}
function niceDate(iso, long){
  const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-US', long?{weekday:'long',month:'long',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'});
}
function dayHeading(iso){
  const t=isoLocal(new Date());
  if(iso===t) return 'Today · '+niceDate(iso);
  if(iso===addDays(t,1)) return 'Tomorrow · '+niceDate(iso);
  return niceDate(iso, true);
}
function telHref(p){ const d=String(p||'').replace(/[^\d+]/g,''); return d?('tel:'+d):''; }
function waHref(p){ let d=String(p||'').replace(/\D/g,''); if(d.length===10) d='1'+d; return d?('https://wa.me/'+d):''; }
function mapsHref(a){ return 'https://maps.apple.com/?q='+encodeURIComponent(a); }
function firstStr(){ for(const a of arguments){ if(a!==undefined && a!==null && String(a).trim()!=='') return String(a).trim(); } return ''; }
function clientName(inq, ev){ return inq ? firstStr([inq.firstName, inq.lastName].filter(Boolean).join(' '), inq.name, inq.clientName, ev && ev.name) : (ev && ev.name) || ''; }
function allergiesOf(inq){ return inq ? firstStr(inq.allergies, inq.allergyNotes) : ''; }

/* ---------------- Login ---------------- */
function showLogin(msg){
  $app.innerHTML = `<div class="login">
    <img src="eventday-icon-180.png" alt="">
    <h1>Event Day</h1>
    <p class="muted">Premier Caterers · staff only</p>
    <div class="who-btns">${Object.keys(USERS).map(k=>`<button class="who-btn" onclick="pickUser('${k}')">${esc(USERS[k].name)}</button>`).join('')}</div>
    <div class="err">${esc(msg||'')}</div>
  </div>`;
}
function pickUser(k){
  $app.innerHTML = `<div class="login">
    <img src="eventday-icon-180.png" alt="">
    <h1>Hi ${esc(USERS[k].name)}</h1>
    <p class="muted">Use the same password as the main Premier app.</p>
    <input id="pw" class="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin('${k}')">
    <button class="go" id="goBtn" onclick="doLogin('${k}')">Sign in</button>
    <div class="err" id="err"></div>
    <button class="link" onclick="resetPw('${k}')">Forgot password? Email me a reset link</button><br>
    <button class="link" onclick="showLogin()">← Not ${esc(USERS[k].name)}?</button>
  </div>`;
  setTimeout(()=>{ const i=document.getElementById('pw'); if(i) i.focus(); }, 60);
}
async function doLogin(k){
  const pw=(document.getElementById('pw')||{}).value||''; const err=document.getElementById('err'); const go=document.getElementById('goBtn');
  err.textContent=''; go.disabled=true; go.textContent='Signing in…';
  try{ await auth.signInWithEmailAndPassword(USERS[k].email, pw); }
  catch(e){
    go.disabled=false; go.textContent='Sign in';
    const c=e&&e.code;
    err.textContent = (c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials') ? 'Wrong password. Try again.'
      : c==='auth/user-not-found' ? 'No login set up for you yet. Ask Kenny.'
      : c==='auth/too-many-requests' ? 'Too many tries. Wait a minute and try again.'
      : c==='auth/network-request-failed' ? 'No internet connection.'
      : 'Could not sign in. Try again.';
  }
}
async function resetPw(k){
  const err=document.getElementById('err');
  try{ await auth.sendPasswordResetEmail(USERS[k].email); err.style.color='var(--green)'; err.textContent='Reset link sent to '+USERS[k].email; }
  catch(e){ err.textContent='Could not send the reset email.'; }
}
function signOut(){ if(confirm('Sign out of Event Day?')) auth.signOut(); }

auth.onAuthStateChanged(u=>{
  const k = (u && !u.isAnonymous) ? userForEmail(u.email) : null;
  if(k){ me=k; loadEvents().then(route); }
  else if(u && !u.isAnonymous){ auth.signOut(); showLogin('That account isn’t set up for Event Day.'); }
  else { me=null; showLogin(); }
});

/* ---------------- Data ---------------- */
async function loadEvents(){
  $app.innerHTML = '<div class="spin">Loading this week…</div>';
  const today = isoLocal(new Date());
  // weekOf is the Sunday that ends each event's week.
  const snap = await db.collection('events').where('weekOf','>=',today).where('weekOf','<=',addDays(today, 63)).get();
  const raw = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(e=>e.lost!==true);
  const inqIds = [...new Set(raw.map(e=>e.inquiryId || (String(e.id).indexOf('inq_')===0 ? String(e.id).slice(4) : '')).filter(Boolean))];
  const inqs = {};
  await Promise.all(inqIds.map(id=>db.collection('inquiries').doc(id).get().then(s=>{ if(s.exists) inqs[id]=Object.assign({id:s.id}, s.data()); }).catch(()=>{})));
  events = [];
  raw.forEach(ev=>{
    const inqId = ev.inquiryId || (String(ev.id).indexOf('inq_')===0 ? String(ev.id).slice(4) : '');
    const inq = inqId ? inqs[inqId] : null;
    if(String(ev.id).indexOf('inq_')===0 && !inq) return;   // inquiry deleted
    if(inq && inq.stage==='lost') return;
    const date = ev.eventDate || dateFromWeekOfDay(ev.weekOf, ev.day) || (inq && inq.eventDate) || null;
    if(!date || date < today) return;
    events.push({ev, inq, date});
  });
  events.sort((a,b)=> a.date.localeCompare(b.date) || String(a.ev.startTime||'').localeCompare(String(b.ev.startTime||'')) || String(a.ev.job||'').localeCompare(String(b.ev.job||'')));
}

/* ---------------- Routing (#/ , #/e/ID , #/e/ID/equip ...) ---------------- */
window.addEventListener('hashchange', ()=>{ if(me) route(); });
function go(h){ location.hash = h; }
function route(){
  const p = (location.hash||'#/').slice(2).split('/');
  if(p[0]==='e' && p[1]){
    const item = events.find(x=>x.ev.id===decodeURIComponent(p[1]));
    if(!item){ renderList(); return; }
    if(p[2]==='equip') return renderEquip(item);
    if(p[2]==='check') return renderCheck(item);
    if(p[2]==='floor') return renderFloor(item);
    return renderEvent(item);
  }
  renderList();
  window.scrollTo(0,0);
}

/* ---------------- List ---------------- */
function renderList(){
  const today = isoLocal(new Date());
  const last = addDays(today, showDays-1);
  const shown = events.filter(x=>x.date<=last);
  let h = `<div class="top"><h1>Event Day</h1><div class="who">${esc(USERS[me].name)}<br><button class="link" style="margin:0;padding:0" onclick="signOut()">Sign out</button></div></div>`;
  if(!shown.length) h += `<div class="card empty">No events in the next ${showDays} days.</div>`;
  let lastDay = '';
  shown.forEach(x=>{
    if(x.date!==lastDay){ h += `<div class="day-h">${x.date===today?'<i class="ti ti-star"></i>':'<i class="ti ti-calendar"></i>'}${esc(dayHeading(x.date))}</div>`; lastDay=x.date; }
    const ev=x.ev, inq=x.inq, isToday = x.date===today;
    const bits = [ev.startTime, firstStr(inq&&inq.guestCount, ev.guests) ? firstStr(inq&&inq.guestCount, ev.guests)+' guests' : '', ev.typeLabel || (inq&&inq.eventType)].filter(Boolean);
    h += `<button class="ev${isToday?' today':''}" onclick="go('#/e/${encodeURIComponent(ev.id)}')">
      <div style="min-width:0">${isToday?'<div class="today-tag"><i class="ti ti-star"></i>TODAY</div>':''}
        <div class="nm">${esc(ev.name || clientName(inq, ev) || 'Event')}</div>
        <div class="sub">${esc(bits.join(' · '))}</div>
        ${allergiesOf(inq)?'<div class="sub" style="color:var(--red);font-weight:600"><i class="ti ti-alert-triangle"></i> Allergy note</div>':''}
      </div><i class="ti ti-chevron-right chev"></i></button>`;
  });
  if(events.some(x=>x.date>last)) h += `<button class="more" onclick="showDays+=14;renderList()">Show later events</button>`;
  h += `<button class="more" onclick="loadEvents().then(route)"><i class="ti ti-refresh"></i> Refresh</button>`;
  $app.innerHTML = h;
}

/* ---------------- Event page ---------------- */
function topBack(label, hash){ return `<div class="top"><button class="back" onclick="go('${hash}')"><i class="ti ti-chevron-left"></i>${esc(label)}</button><div style="flex:1"></div><span class="staff-badge"><i class="ti ti-lock"></i>Staff view</span></div>`; }
function row(k,v,raw){ if(!v && v!==0) return ''; return `<div class="r"><span class="k">${esc(k)}</span><span class="v">${raw?v:esc(v)}</span></div>`; }
function tile(icon, label, opts){
  opts = opts||{};
  if(opts.none) return `<div class="tile none"><i class="ti ${icon}"></i>${esc(label)}<span class="ts">None yet</span></div>`;
  const cls = 'tile'+(opts.staff?' staff':'');
  if(opts.href) return `<a class="${cls}" href="${esc(opts.href)}" target="_blank" rel="noopener"><i class="ti ${icon}"></i>${esc(label)}${opts.sub?`<span class="ts">${esc(opts.sub)}</span>`:''}</a>`;
  return `<button class="${cls}" onclick="${opts.onclick}"><i class="ti ${icon}"></i>${esc(label)}${opts.sub?`<span class="ts">${esc(opts.sub)}</span>`:''}</button>`;
}
function staffRows(o){
  return row('Waiters', o.waiters) + row('Waiter arrival', o.waiterTime) + row('Bartenders', o.bartenders) + row('Chefs', o.chefs) + row('Chef arrival', o.chefTime) + row('Porters', o.porters) + row('Manager', o.manager) + row('Mashgiach', o.mashgiachNames || o.mashgiach);
}
function portalIdOf(item){ return (item.inq && item.inq.portalId) || item.ev.portalId || ''; }

async function renderEvent(item){
  const ev=item.ev, inq=item.inq, base='#/e/'+encodeURIComponent(ev.id);
  const guests = firstStr(inq&&inq.guestCount, ev.guests);
  const venue = firstStr(inq&&inq.venueName);
  const addr = firstStr(ev.addr, inq&&inq.venueLocation, inq&&inq.addr);
  const phone = inq && inq.phone;
  const allergy = allergiesOf(inq);
  const menuUrl = (inq && Array.isArray(inq.menus) && inq.menus[0] && inq.menus[0].url) || (inq && inq.menuLink) || ev.menuLink || '';
  const catererUrl = ev.catererCopyDoc || ev.catererCopyPdf || '';
  const floorN = (ev.floorplanFiles||[]).length;

  let h = topBack('All events', '#/');
  h += `<div class="card hdr"><h2>${esc(ev.name || clientName(inq, ev) || 'Event')}</h2>
    <div class="muted" style="margin-top:4px">${esc(niceDate(item.date, true))}${ev.startTime?' · '+esc(ev.startTime):''}</div>
    <div class="pills">${ev.job?`<span class="pill"><i class="ti ti-hash"></i>${esc(String(ev.job).replace(/^#/,''))}</span>`:''}${guests?`<span class="pill"><i class="ti ti-users"></i>${esc(guests)} guests</span>`:''}${(ev.typeLabel||(inq&&inq.eventType))?`<span class="pill">${esc(ev.typeLabel||inq.eventType)}</span>`:''}</div></div>`;
  if(allergy) h += `<div class="allergy"><i class="ti ti-alert-triangle"></i><div>ALLERGY<br><span style="font-weight:500">${esc(allergy)}</span></div></div>`;

  // At a glance
  h += `<div class="card"><div style="font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="ti ti-clock"></i>At a glance</div><div class="rows">
    ${row('Start time', ev.startTime)}
    ${row('Venue', venue)}
    ${addr?row('Address', `<a href="${esc(mapsHref(addr))}" target="_blank" rel="noopener">${esc(addr)}</a>`, true):''}
    ${row('Waiter arrival', ev.waiterTime)}${row('Chef arrival', ev.chefTime)}${row('Manager', ev.manager)}
    ${row('Client', clientName(inq, ev))}
    ${phone?row('Client phone', `<a href="${esc(telHref(phone))}">${esc(phone)}</a>`, true):''}
  </div>
  ${ev.notes?`<div style="margin-top:10px;white-space:pre-wrap;font-size:15px"><b>Notes:</b> ${esc(ev.notes)}</div>`:''}
  <div class="actions">${phone?`<a class="act" href="${esc(telHref(phone))}"><i class="ti ti-phone"></i>Call client</a><a class="act" href="${esc(waHref(phone))}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i>WhatsApp</a>`:''}${addr?`<a class="act" href="${esc(mapsHref(addr))}" target="_blank" rel="noopener"><i class="ti ti-map-pin"></i>Directions</a>`:''}</div></div>`;

  // Staff only tiles
  h += `<div class="sec-h"><i class="ti ti-lock"></i>Staff only</div><div class="grid">
    ${tile('ti-shopping-cart','Grocery list',{staff:1, href:'grocery.html?event='+encodeURIComponent(ev.id)})}
    ${tile('ti-tool','Equipment',{staff:1, onclick:`go('${base}/equip')`})}
    ${tile('ti-calendar-time','Staff & schedule',{staff:1, onclick:`document.getElementById('staffing').scrollIntoView({behavior:'smooth'})`})}
    ${tile('ti-checklist','Checklist',{staff:1, onclick:`go('${base}/check')`})}
    ${floorN?tile('ti-layout-2','Floor plan',{staff:1, onclick:`go('${base}/floor')`, sub:floorN>1?floorN+' files':''}):tile('ti-layout-2','Floor plan',{none:1})}
    ${tile('ti-tags','Pan labels',{staff:1, href:'grocery.html?event='+encodeURIComponent(ev.id)+'&labels=1'})}
    ${catererUrl?tile('ti-chef-hat','Caterer menu',{staff:1, href:catererUrl}):tile('ti-chef-hat','Caterer menu',{none:1})}
    ${ev.venueLink?tile('ti-building','Venue sheet',{staff:1, href:ev.venueLink}):tile('ti-building','Venue sheet',{none:1})}
  </div>`;

  // Client side
  h += `<div class="sec-h"><i class="ti ti-eye"></i>What the client sees</div><div class="grid">
    <div id="portalTile">${portalIdOf(item)?tile('ti-device-mobile','Client’s event page',{onclick:`openPortal('${esc(ev.id)}')`, sub:'Menu, invoice, contract…'}):tile('ti-device-mobile','Client’s event page',{none:1})}</div>
    ${menuUrl?tile('ti-file-text','Menu',{href:menuUrl}):tile('ti-file-text','Menu',{none:1})}
  </div>`;

  // Staffing
  h += `<div class="sec-h" id="staffing"><i class="ti ti-users"></i>Staff & schedule</div><div class="card"><div class="rows">`;
  const main = staffRows(ev);
  h += main || '<div class="muted small" style="padding:6px 0">No staffing entered yet.</div>';
  h += `</div>`;
  (ev.meals||[]).forEach((m,i)=>{
    const r = staffRows(m);
    h += `<div class="meal-h">${esc(m.label || m.dayLabel || ('Meal '+(i+1)))}${m.typeLabel?' — '+esc(m.typeLabel):''}${m.time||m.startTime?' · '+esc(m.time||m.startTime):''}</div><div class="rows">${r||'<div class="muted small">No staffing entered.</div>'}</div>`;
  });
  h += `</div><p class="muted small" style="text-align:center;margin-top:16px">To change anything, use the main Premier app.</p>`;
  $app.innerHTML = h;
  window.scrollTo(0,0);
}

async function openPortal(evId){
  const item = events.find(x=>x.ev.id===evId); if(!item) return;
  const pid = portalIdOf(item);
  const w = window.open('', '_blank');
  try{
    let p = cache.portal[pid];
    if(!p){ const s = await db.collection('clientPortals').doc(pid).get(); p = s.exists ? s.data() : null; cache.portal[pid]=p; }
    if(!p || !p.token){ if(w) w.close(); alert('This client’s event page isn’t set up yet.'); return; }
    const url = PORTAL_BASE_URL + '?p=' + encodeURIComponent(pid) + '&t=' + encodeURIComponent(p.token) + '&staff=1';
    if(w) w.location.href = url; else location.href = url;
  }catch(e){ if(w) w.close(); alert('Could not open the client’s page.'); }
}

/* ---------------- Equipment ---------------- */
async function renderEquip(item){
  const ev=item.ev, base='#/e/'+encodeURIComponent(ev.id);
  $app.innerHTML = topBack('Event', base) + '<div class="spin">Loading equipment…</div>';
  let eq = cache.equip[ev.id];
  if(eq===undefined){ try{ const s=await db.collection('equipment').doc(ev.id).get(); eq = s.exists ? s.data() : null; }catch(e){ eq=null; } cache.equip[ev.id]=eq; }
  let h = topBack('Event', base) + `<div class="card hdr"><h2 style="font-size:20px">Equipment</h2><div class="muted">${esc(ev.name||'')}</div>
    ${eq&&eq.meatDairyParve?`<div class="pills"><span class="pill" style="border:2px solid var(--text)">${esc(String(eq.meatDairyParve).toUpperCase())}</span></div>`:''}</div>`;
  const items = (eq && Array.isArray(eq.items)) ? eq.items.filter(i=>i.checked!==false || i.qty) : [];
  if(!items.length){ h += `<div class="card empty">No equipment list yet.<br><span class="small">Make it in the main app under Equipment.</span></div>`; }
  else{
    const stage = eq.stage==='complete' ? '✓ List complete' : '● Still being worked on';
    h += `<div class="card"><div class="small muted" style="margin-bottom:4px">${stage}</div>`;
    [...new Set(items.map(i=>i.section||'Other'))].forEach(sec=>{
      h += `<div class="eq-sec">${esc(sec)}</div>`;
      items.filter(i=>(i.section||'Other')===sec).forEach(i=>{
        h += `<div class="eq-it${i.packedCheck?' packed':''}"><i class="ti ${i.packedCheck?'ti-square-check':'ti-square'}"></i><span class="n">${esc(i.item)}</span><span class="q">${esc(i.qty||'')}</span></div>`;
      });
    });
    h += `</div>`;
  }
  $app.innerHTML = h; window.scrollTo(0,0);
}

/* ---------------- Checklist ---------------- */
function clDone(i){ if(i.done!==undefined) return !!i.done; return !!(i.assignees && i.assignees.some(a=>a.done)); }
async function renderCheck(item){
  const ev=item.ev, base='#/e/'+encodeURIComponent(ev.id);
  $app.innerHTML = topBack('Event', base) + '<div class="spin">Loading checklist…</div>';
  let cl = cache.check[ev.id];
  if(cl===undefined){ try{ const s=await db.collection('checklists').doc(ev.id).get(); cl = s.exists ? (s.data().items||[]) : null; }catch(e){ cl=null; } cache.check[ev.id]=cl; }
  let h = topBack('Event', base) + `<div class="card hdr"><h2 style="font-size:20px">Checklist</h2><div class="muted">${esc(ev.name||'')}</div></div>`;
  const items = (cl||[]).filter(i=>!i.na);
  if(!items.length) h += `<div class="card empty">No checklist yet.</div>`;
  else{
    const done = items.filter(clDone).length;
    h += `<div class="card"><div class="small muted" style="margin-bottom:4px">${done} of ${items.length} done</div>`;
    items.forEach(i=>{
      const d = clDone(i); const who = (i.assignees||[]).map(a=>a.otherName||a.person).filter(Boolean).join(', ');
      h += `<div class="cl-it${d?' done':''}"><i class="ti ${d?'ti-circle-check':'ti-circle'}"></i><div><div class="t">${esc(i.text)}</div>${who?`<div class="small muted">${esc(who)}</div>`:''}</div></div>`;
    });
    h += `</div>`;
  }
  $app.innerHTML = h; window.scrollTo(0,0);
}

/* ---------------- Floor plans ---------------- */
function renderFloor(item){
  const ev=item.ev, base='#/e/'+encodeURIComponent(ev.id);
  const files = (ev.floorplanFiles||[]).slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  let h = topBack('Event', base) + `<div class="card hdr"><h2 style="font-size:20px">Floor plan</h2><div class="muted">${esc(ev.name||'')}</div></div><div class="card">`;
  h += files.map((f,i)=>`<a class="act" style="width:100%;margin-bottom:8px" href="${esc(f.url)}" target="_blank" rel="noopener"><i class="ti ti-file"></i>${esc(f.name||'Floor plan')}${i===0&&files.length>1?' (newest)':''}</a>`).join('') || '<div class="empty">No floor plan yet.</div>';
  $app.innerHTML = h + '</div>'; window.scrollTo(0,0);
}
</script>
