// ════════ VENDOR REPLIES ════════
// Each reply is a Firestore doc in 'vendorReplies'. Keyed by messageId so a
// reply is only ever stored once. Status fields are set by humans (with help
// from a Claude pre-fill that lives on the relay side).
let vendorReplies = [];
let _repliesPolling = false;
let _repliesPollTimer = null;
let _repliesLastFetched = 0;

function startRepliesData(){
  try{ db.collection('vendorReplies').onSnapshot(s=>{ vendorReplies = s.docs.map(d=>({id:d.id,...d.data()})); renderReplies(); }); }catch(e){}
}

function _replyOrderId(r){
  if(r.orderId) return r.orderId;
  // Try the new human-readable form first: PO-1001-260630-CHEFS
  const m1 = String(r.subject||'').match(/\bPO-\d+-\d+-[A-Z0-9]+\b/);
  if(m1){
    const ord = orders.find(o => o.poNumber === m1[0]);
    if(ord) return ord.id;
  }
  // Legacy bracket form: [PO-firestoreId]
  const m2 = String(r.subject||'').match(/\[PO-([A-Za-z0-9_-]+)\]/);
  return m2 ? m2[1] : '';
}

async function checkReplies(manual){
  const relay = getOrdersRelayUrl();
  if(!relay){ if(manual) alert('The orders relay URL isn’t set yet. Open Settings to paste it.'); return; }
  if(_repliesPolling) return;
  _repliesPolling = true;
  const btn=document.getElementById('checkRepliesBtn');
  const upd=document.getElementById('repliesUpdated');
  if(manual && btn){ btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2"></i> Checking…'; }
  try{
    const sinceTs = _repliesLastFetched || 0;
    const url = relay + (relay.indexOf('?')>=0?'&':'?') + 'action=fetchReplies&since=' + sinceTs;
    const r = await fetch(url);
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||'fetch failed');
    const fresh = d.replies||[];
    // Store anything new in Firestore (idempotent by messageId)
    const batch = db.batch();
    let added = 0;
    fresh.forEach(rep=>{
      if(!rep.messageId) return;
      const exists = vendorReplies.find(x=>x.messageId===rep.messageId);
      if(exists) return;
      // Resolve orderId: prefer rep.orderId from the script; else look for
      // PO-1001-260630-CHEFS in the subject and map to an order with that
      // poNumber; else legacy [PO-firestoreId] bracket tag.
      let resolvedOrderId = rep.orderId || '';
      if(!resolvedOrderId){
        const m1 = String(rep.subject||'').match(/\bPO-\d+-\d+-[A-Z0-9]+\b/);
        if(m1){ const ord = orders.find(o => o.poNumber === m1[0]); if(ord) resolvedOrderId = ord.id; }
      }
      if(!resolvedOrderId){
        const m2 = String(rep.subject||'').match(/\[PO-([A-Za-z0-9_-]+)\]/);
        if(m2) resolvedOrderId = m2[1];
      }
      const ref = db.collection('vendorReplies').doc(rep.messageId);
      const docData = {
        messageId: rep.messageId,
        threadId: rep.threadId||'',
        from: rep.from||'',
        subject: rep.subject||'',
        snippet: rep.snippet||'',
        body: rep.body||'',
        receivedAt: rep.receivedAt || Date.now(),
        orderId: resolvedOrderId,
        aiStatus: rep.aiStatus || 'unclear',     // confirmed | issue | question | unclear
        aiSummary: rep.aiSummary || '',
        status: 'unread',                        // overall status the user sets
        addedAt: Date.now()
      };
      batch.set(ref, docData);
      added++;
    });
    if(added) await batch.commit();
    _repliesLastFetched = Date.now();
    if(upd){ upd.textContent = 'Last checked: '+new Date().toLocaleTimeString()+(added?(' · '+added+' new'):''); }
    if(manual && added===0) toast('No new replies');
    else if(added) toast(added+' new reply'+(added===1?'':'s')+' ✓');
  }catch(e){ if(manual) alert('Could not check replies: '+e.message); }
  finally{
    _repliesPolling = false;
    if(btn){ btn.disabled=false; btn.innerHTML='<i class="ti ti-refresh"></i> Check now'; }
  }
}

// Polling: every 2 minutes when the tab is visible. Paused when hidden.
function startRepliesPolling(){
  if(_repliesPollTimer) return;
  const tick = ()=>{ if(document.visibilityState==='visible' && getOrdersRelayUrl()) checkReplies(false); };
  _repliesPollTimer = setInterval(tick, 120000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') tick(); });
  // initial check shortly after login
  setTimeout(tick, 2500);
}

async function setReplyStatus(messageId, status){
  try{
    await db.collection('vendorReplies').doc(messageId).set({ status, statusBy:userLabel(), statusAt:Date.now() }, {merge:true});
    // also propagate to the matching order
    const r = vendorReplies.find(x=>x.messageId===messageId);
    if(r && r.orderId){
      const ord = orders.find(o=>o.id===r.orderId);
      if(ord){
        const orderStatus = status==='confirmed' ? 'confirmed'
                         : status==='issue'     ? 'issue'
                         : ord.status;
        if(orderStatus !== ord.status){
          await db.collection('orders').doc(r.orderId).set({ status:orderStatus, statusAt:Date.now(), statusBy:userLabel() }, {merge:true});
        }
      }
    }
    toast('Status saved');
  }catch(e){ alert('Could not save status: '+e.message); }
}

async function manuallyMatchReply(messageId){
  if(!orders.length){ alert('No saved orders to match against yet.'); return; }
  const recent = orders.slice().sort((a,b)=>(b.placedAt||0)-(a.placedAt||0)).slice(0, 30);
  const list = recent.map((o,i)=>{
    const when = o.placedAt?new Date(o.placedAt).toLocaleDateString():'';
    return (i+1)+'. '+o.vendorName+' — '+when+' ('+(o.lines||[]).length+' lines)';
  }).join('\n');
  const pick = prompt('Match this reply to which order?\n\n'+list+'\n\nEnter the number, or leave blank to cancel:');
  const n = parseInt(pick,10);
  if(!n || n<1 || n>recent.length) return;
  const o = recent[n-1];
  try{ await db.collection('vendorReplies').doc(messageId).set({orderId:o.id, matchedManually:true, matchedAt:Date.now()}, {merge:true}); toast('Matched ✓'); }
  catch(e){ alert('Could not match: '+e.message); }
}

function renderReplies(){
  // tab badge — unread count
  const unread = vendorReplies.filter(r=>r.status==='unread').length;
  const badge = document.getElementById('repliesBadge');
  if(badge){ if(unread){ badge.textContent=unread; badge.classList.add('show'); } else { badge.classList.remove('show'); badge.textContent=''; } }

  const body = document.getElementById('repliesBody'); if(!body) return;
  if(!vendorReplies.length){
    body.innerHTML = '<div class="dash-empty">No vendor replies yet. Once a vendor replies to an order, their message will show up here within a couple of minutes — Claude will read it and suggest whether it looks like a confirmation, an issue, or a question. You always get the final say.</div>';
    return;
  }
  // Newest first
  const list = vendorReplies.slice().sort((a,b)=>(b.receivedAt||0)-(a.receivedAt||0));
  body.innerHTML = list.map(r=>{
    const ord = r.orderId ? orders.find(o=>o.id===r.orderId) : null;
    const sugg = r.aiStatus || 'unclear';
    const suggIcon = sugg==='confirmed'?'ti-check' : sugg==='issue'?'ti-alert-triangle' : sugg==='question'?'ti-help' : 'ti-help-octagon';
    const cur = r.status || 'unread';
    const pill = (key, label, cls) => `<button class="reply-pill ${cur===key?'active '+cls:''}" onclick="setReplyStatus('${r.messageId}','${key}')">${label}</button>`;
    const orderTag = ord
      ? `<span class="reply-orderlink"><a class="reply-link" onclick="openOrderView('${ord.id}')">${esc(ord.vendorName||'Order')} \u2014 ${ord.placedAt?new Date(ord.placedAt).toLocaleDateString():''}</a></span>`
      : `<span class="reply-orderlink"><span class="reply-unmatched">unmatched</span> <a class="reply-link" onclick="manuallyMatchReply('${r.messageId}')">match to order</a></span>`;
    const when = r.receivedAt ? new Date(r.receivedAt).toLocaleString() : '';
    return `<div class="reply-card">
      <div class="reply-head">
        <span class="vname">${esc((r.from||'').replace(/<[^>]+>/g,'').trim() || r.from || 'Vendor')}</span>
        <span class="sugg"><i class="ti ${suggIcon}"></i>${esc(sugg)}</span>
        <span class="when">${esc(when)}</span>
      </div>
      ${r.aiSummary?`<div class="reply-summary"><b>Claude:</b> ${esc(r.aiSummary)}</div>`:''}
      <div class="reply-body">
        ${r.subject?`<div class="reply-subject">${esc(r.subject.replace(/\s*\[PO-[^\]]+\]\s*/g,' ').replace(/\s*PO-\d+-\d+-[A-Z0-9]+\s*/g,' ').trim())}</div>`:''}
        <div class="reply-snippet">${esc(r.body||r.snippet||'(no body)').slice(0,2000)}</div>
      </div>
      <div class="reply-actions">
        <span class="lbl">Your call:</span>
        ${pill('confirmed','Confirmed','confirmed')}
        ${pill('issue','Has issues','issue')}
        ${pill('question','Question','question')}
        ${pill('unclear','Unclear','unclear')}
        ${orderTag}
      </div>
    </div>`;
  }).join('');
  const upd=document.getElementById('repliesUpdated');
  if(upd && _repliesLastFetched && !upd.textContent) upd.textContent = 'Last checked: '+new Date(_repliesLastFetched).toLocaleTimeString();
}

window.checkReplies = checkReplies;
window.setReplyStatus = setReplyStatus;
window.manuallyMatchReply = manuallyMatchReply;

// ════════ ORDERS RELAY SETTINGS ════════
// The orders@thepremiercaterer.com Apps Script URL lives in localStorage so each
// browser/device can be pointed at the same deployment without hardcoding it.
function getOrdersRelayUrl(){ try{ return localStorage.getItem('pcOrdersRelay')||''; }catch(e){ return ''; } }
function setOrdersRelayUrl(url){ try{ localStorage.setItem('pcOrdersRelay', url||''); }catch(e){} }
function openOrdersSettings(){
  const cur=getOrdersRelayUrl();
  openModal(`<div class="modal-head"><div class="h">Orders relay</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="hint" style="margin-bottom:10px">This is the orders@ Apps Script URL. When you send an order, the purchasing app calls this URL — vendor email + printer copy go out from <b>orders@thepremiercaterer.com</b>.</div>
    <div class="fld"><label>Orders relay URL</label><input id="orl_url" value="${esc(cur)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="fld"><button class="btn ghost" onclick="testOrdersRelay()" type="button"><i class="ti ti-plug-connected"></i> Test connection</button> <span id="orl_status" style="margin-left:8px;font-size:12.5px"></span></div>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOrdersRelay()">Save</button></div>`);
}
async function testOrdersRelay(){
  const url=(document.getElementById('orl_url')||{}).value?.trim()||'';
  const st=document.getElementById('orl_status'); if(!st) return;
  if(!url){ st.textContent='Paste the URL first.'; st.style.color='var(--maroon)'; return; }
  st.textContent='Testing…'; st.style.color='var(--text3)';
  try{
    const r=await fetch(url);
    const d=await r.json();
    if(d.ok && d.as){ st.innerHTML='<span style="color:var(--green-text)">✓ Connected — runs as <b>'+esc(d.as)+'</b></span>'; }
    else st.innerHTML='<span style="color:var(--maroon)">Reached the URL but the response looked wrong: '+esc(JSON.stringify(d).slice(0,80))+'</span>';
  }catch(e){ st.innerHTML='<span style="color:var(--maroon)">Could not reach the URL: '+esc(e.message)+'</span>'; }
}
function saveOrdersRelay(){
  const url=(document.getElementById('orl_url')||{}).value?.trim()||'';
  setOrdersRelayUrl(url); closeModal(); toast('Orders relay saved');
}

// ════════ PRINTER-COPY PDF ════════
// Generates a clean, plain-styled PDF using jsPDF. Includes prices and an
// "ORDER PLACED" header. Returns base64 (no data: prefix), ready for the relay.
function buildOrderPdfBase64(order){
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF) throw new Error('PDF library not loaded yet — refresh and try again.');
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const W = doc.internal.pageSize.getWidth();
  const M = 48;
  let y = M;

  // Big header
  doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.text('ORDER PLACED', W/2, y, { align:'center' });
  y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(110);
  doc.text('Premier Caterers', W/2, y, { align:'center' });
  y += 14;
  if(order.poNumber){
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(40);
    doc.text(order.poNumber, W/2, y, { align:'center' });
    y += 10;
  }
  y += 12;

  // Meta block
  doc.setTextColor(40); doc.setFontSize(11);
  const placed = order.placedAt ? new Date(order.placedAt).toLocaleString() : '';
  const need   = order.neededBy ? fmtDate(order.neededBy) : '—';
  const lines = [
    ['Vendor', order.vendorName || ''],
    ['Vendor email', order.vendorEmail || ''],
    ['Needed by', need],
    ['Placed', placed],
    ['Placed by', order.placedBy || '']
  ];
  doc.setFont('helvetica','bold'); doc.text('Order details', M, y); y+=4;
  doc.setDrawColor(220); doc.line(M, y, W-M, y); y+=14;
  doc.setFont('helvetica','normal');
  lines.forEach(([k,v])=>{ if(!v) return; doc.setTextColor(120); doc.text(k+':', M, y); doc.setTextColor(40); doc.text(String(v), M+90, y); y+=15; });
  y += 6;

  // Table header
  doc.setFont('helvetica','bold'); doc.setTextColor(40);
  doc.text('Items', M, y); y+=4;
  doc.line(M, y, W-M, y); y+=14;
  const cols = { qty: M, item: M+50, code: W-260, pack: W-200, price: W-130, line: W-M };
  doc.setFontSize(9); doc.setTextColor(120);
  doc.text('Qty', cols.qty, y);
  doc.text('Item', cols.item, y);
  doc.text('Code', cols.code, y);
  doc.text('Pack', cols.pack, y);
  doc.text('Price', cols.price, y, {align:'right'});
  doc.text('Line total', cols.line, y, {align:'right'});
  y+=8; doc.line(M, y, W-M, y); y+=14;

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30);
  (order.lines||[]).forEach(L=>{
    if(y > 720){ doc.addPage(); y = M; }
    const pick = L.pick||{};
    const pack = pick.packDesc || ((pick.packSize||'?')+' '+(pick.unit||''));
    const itemName = pick.vendorItemName || L.productName || '';
    // Wrap long item names
    const wrapped = doc.splitTextToSize(itemName, cols.code - cols.item - 8);
    doc.text(String(L.qty||''), cols.qty, y);
    doc.text(wrapped, cols.item, y);
    doc.setTextColor(120); doc.text(String(pick.vendorCode||'—'), cols.code, y);
    doc.text(String(pack||''), cols.pack, y);
    doc.setTextColor(30);
    doc.text(fmtMoney(pick.price), cols.price, y, {align:'right'});
    doc.setFont('helvetica','bold'); doc.text(fmtMoney(L.lineTotal), cols.line, y, {align:'right'}); doc.setFont('helvetica','normal');
    const lineH = 14 * Math.max(1, wrapped.length);
    y += lineH;
  });
  y+=4; doc.line(M, y, W-M, y); y+=18;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Total cases: '+(order.totalCases||0), M, y);
  doc.text('Order total: '+fmtMoney(order.totalDollars||0), W-M, y, {align:'right'});

  // Warning footer if minimum wasn't met
  if(order.minWarning){
    y+=20; doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(170,30,30);
    doc.text('Note: '+order.minWarning, M, y);
  }

  // Vendor-prices-shown disclaimer
  y+=24; doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(140);
  doc.text('Prices shown are our last quote on file. Vendor invoice prices apply on delivery.', M, y);

  // Return base64 (jsPDF .output('datauristring') = "data:application/pdf;base64,...")
  const dataUri = doc.output('datauristring');
  const idx = dataUri.indexOf(',');
  return idx>=0 ? dataUri.slice(idx+1) : dataUri;
}

function orderPdfFilename(order){
  const v=(order.vendorName||'Order').replace(/[\/\\:*?"<>|]/g,'-').trim();
  const stamp = order.placedAt ? new Date(order.placedAt) : new Date();
  const d = (stamp.getMonth()+1)+'-'+stamp.getDate()+'-'+String(stamp.getFullYear()).slice(-2);
  return v + ' Order ('+d+').pdf';
}

// ════════ SEND ORDERS (vendor email + printer copy) ════════
async function sendOrderViaRelay(orderId){
  const order = orders.find(o=>o.id===orderId);
  if(!order){ alert('Order not found.'); return false; }
  if(order.status==='sent'){ if(!confirm('This order was already sent. Send again?')) return false; }
  const relay = getOrdersRelayUrl();
  if(!relay){ alert('The orders relay URL isn’t set yet. Open Settings (top right) and paste the orders@ Apps Script URL.'); openOrdersSettings(); return false; }
  if(!order.vendorEmail){ alert('No email address on file for this vendor. Open the vendor record and add one.'); return false; }

  // Build the vendor-facing copy (no prices) — quantities, vendor item names, codes, packs only.
  const escH=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const needBit = order.neededBy ? ' — needed by '+fmtDate(order.neededBy) : '';
  // Use the human-readable PO number as the matching tag too. If for any
  // reason it's missing (very old test orders), fall back to the bracket form.
  const poId = order.poNumber || ('PO-'+orderId);
  const subject = poId+(needBit?(' '+needBit):'')+' — '+(order.vendorName||'')+' (Premier Caterers)';
  // Plain-text body
  const ptLines = (order.lines||[]).map(L=>{
    const pick=L.pick||{}; const pack=pick.packDesc||((pick.packSize||'?')+' '+(pick.unit||''));
    return '  '+L.qty+' × '+(pick.vendorItemName||L.productName)+(pick.vendorCode?' (#'+pick.vendorCode+')':'')+'  —  '+pack;
  }).join('\n');
  const greet = 'Hello'+(order.vendorName?(' '+order.vendorName):'')+',\n\nPlease confirm receipt of the following order';
  const needLine = order.neededBy ? ('\nNeeded by: '+fmtDate(order.neededBy)) : '';
  const plain = greet+':'+needLine+'\n\n'+ptLines+'\n\nThank you,\nPremier Caterers\nevents@thepremiercaterer.com';
  // HTML body
  const htmlLines = (order.lines||[]).map(L=>{
    const pick=L.pick||{}; const pack=pick.packDesc||((pick.packSize||'?')+' '+(pick.unit||''));
    return '<tr><td style="padding:4px 10px 4px 0;font-weight:600;white-space:nowrap">'+L.qty+'</td>'+
           '<td style="padding:4px 10px">'+escH(pick.vendorItemName||L.productName)+'</td>'+
           '<td style="padding:4px 10px;color:#666;white-space:nowrap">'+escH(pick.vendorCode||'')+'</td>'+
           '<td style="padding:4px 0;color:#444">'+escH(pack)+'</td></tr>';
  }).join('');
  const html = '<div style="font-family:Arial,sans-serif;font-size:14px;color:#222;line-height:1.55">'+
    '<p>Hello'+(order.vendorName?(' '+escH(order.vendorName)):'')+',</p>'+
    '<p>Please confirm receipt of the following order'+(order.neededBy?(' — <b>needed by '+escH(fmtDate(order.neededBy))+'</b>'):'')+':</p>'+
    '<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin:8px 0 16px"><thead><tr style="text-align:left;color:#888;border-bottom:1px solid #ddd"><th style="padding:6px 10px 6px 0">Qty</th><th style="padding:6px 10px">Item</th><th style="padding:6px 10px">Code</th><th style="padding:6px 0">Pack</th></tr></thead><tbody>'+htmlLines+'</tbody></table>'+
    '<p>Thank you,<br>Premier Caterers<br><a href="mailto:events@thepremiercaterer.com">events@thepremiercaterer.com</a></p></div>';

  // Build PDF for the printer
  let pdfBase64, pdfFilename;
  try{
    pdfBase64 = buildOrderPdfBase64(order);
    pdfFilename = orderPdfFilename(order);
  }catch(e){ alert('Could not build the printer PDF: '+e.message); return false; }

  const payload = {
    action: 'sendOrder',
    vendorTo: order.vendorEmail,
    vendorSubject: subject,
    vendorBody: plain,
    vendorHtml: html,
    printerSubject: 'ORDER PLACED — '+poId+' — '+(order.vendorName||'')+(order.neededBy?(' (needed '+fmtDate(order.neededBy)+')'):''),
    pdfBase64: pdfBase64,
    pdfFilename: pdfFilename
  };

  try{
    const r = await fetch(relay, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||'send failed');
    const vOk = d.results && d.results.vendor && d.results.vendor.sent;
    const pOk = d.results && d.results.printer && d.results.printer.sent;
    // Update status on the order
    await db.collection('orders').doc(orderId).set({
      status: (vOk && pOk) ? 'sent' : 'partial',
      sentAt: Date.now(),
      sentBy: userLabel(),
      lastSendResult: d.results || {}
    }, {merge:true});
    if(vOk && pOk) toast('Order sent ✓ (vendor + printer)');
    else if(vOk)   toast('Vendor email sent — printer copy FAILED');
    else if(pOk)   toast('Printer copy sent — vendor email FAILED');
    else { alert('Both sends failed: '+JSON.stringify(d.results||d)); return false; }
    return true;
  }catch(e){ alert('Could not send via relay: '+e.message); return false; }
}

async function sendAllSavedOrders(){
  // Send every just-confirmed order that's still 'saved' (created in the last few seconds by this user).
  const recent = orders
    .filter(o=>o.status==='saved' && (Date.now()-(o.placedAt||0) < 5*60*1000))
    .sort((a,b)=>(a.placedAt||0)-(b.placedAt||0));
  if(!recent.length){ alert('No fresh saved orders to send.'); return; }
  for(const o of recent){ await sendOrderViaRelay(o.id); }
  renderOrderHistory();
}

// ════════ PO NUMBER (human-readable order identifier) ════════
// Format: PO-1001-260630-CHEFS  (sequence-date-vendor short code)
// Sequence is a global counter living at meta/counters; never resets.
function vendorShortCode(name){
  return String(name||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5) || 'VENDR';
}
function formatPoNumber(seq, placedAt, vendorName){
  const d = placedAt ? new Date(placedAt) : new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return 'PO-'+seq+'-'+yy+mm+dd+'-'+vendorShortCode(vendorName);
}
// Atomically reserve the next sequence number (1001+).
async function nextPoSeq(){
  const ref = db.collection('meta').doc('counters');
  return db.runTransaction(async tx=>{
    const snap = await tx.get(ref);
    let cur = (snap.exists && typeof snap.data().poSeq === 'number') ? snap.data().poSeq : 1000;
    cur = cur + 1;
    tx.set(ref, { poSeq: cur }, { merge:true });
    return cur;
  });
}

// One-time backfill: any order without poNumber gets one assigned, in the
// order it was placed. Bumps the counter so future orders continue from there.
let _renumberRan = false;
async function backfillPoNumbersOnce(){
  if(_renumberRan) return; _renumberRan = true;
  try{
    const needs = orders.filter(o=>!o.poNumber).sort((a,b)=>(a.placedAt||0)-(b.placedAt||0));
    if(!needs.length) return;
    const ref = db.collection('meta').doc('counters');
    await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      let cur = (snap.exists && typeof snap.data().poSeq === 'number') ? snap.data().poSeq : 1000;
      for(const o of needs){
        cur = cur + 1;
        const poNumber = formatPoNumber(cur, o.placedAt||Date.now(), o.vendorName||'');
        tx.set(db.collection('orders').doc(o.id), { poNumber, poSeq:cur }, { merge:true });
      }
      tx.set(ref, { poSeq: cur }, { merge:true });
    });
    console.log('Backfilled PO numbers for', needs.length, 'order(s)');
  }catch(e){ console.warn('PO backfill skipped:', e); _renumberRan = false; }
}

// ════════ ORDER BUILDER ════════
// Cart shape: { [productKey]: { qty:number, vendorItemId:string, manual:boolean } }
let orderCart = {};
let orders = []; // history

function startOrdersCollection(){
  // separate listener so it doesn't block main data
  try{ db.collection('orders').onSnapshot(s=>{ orders=s.docs.map(d=>({id:d.id,...d.data()})); backfillPoNumbersOnce(); renderOrderHistory(); }); }catch(e){}
}
// cheapest vendor item for a product group (by unit cost; null if none determinable)
function cheapestItem(g){
  let best=null, bestUc=null;
  g.items.forEach(x=>{ const uc=unitCost(x.price,x.packSize); if(uc==null) return; if(bestUc==null||uc<bestUc){ bestUc=uc; best=x; } });
  return best;
}
function selectedVendorItem(g){
  const sel = orderCart[g.key]?.vendorItemId;
  if(sel){ const x=g.items.find(i=>i.id===sel); if(x) return x; }
  return cheapestItem(g);
}
function isManualPick(g){ const sel=orderCart[g.key]; if(!sel||!sel.vendorItemId) return false; return !!sel.manual; }

function renderOrderPicker(){
  const list=document.getElementById('ordersList'); if(!list) return;
  const q=((document.getElementById('oSearch')||{}).value||'').toLowerCase();
  const groups=ourProducts().filter(g=>!q||g.name.toLowerCase().includes(q)||(g.useFor||'').toLowerCase().includes(q)||(g.category||'').toLowerCase().includes(q));
  if(!groups.length){ list.innerHTML='<div class="dash-empty">No products yet — add items first so they can be ordered.</div>'; renderCart(); return; }
  // group by category
  const byCat={};
  groups.forEach(g=>{ const c=g.category||'Uncategorized'; (byCat[c]=byCat[c]||[]).push(g); });
  const cats=Object.keys(byCat).sort();
  list.innerHTML = cats.map(c=>{
    const rows=byCat[c].map(g=>{
      const pick=selectedVendorItem(g);
      const cur=orderCart[g.key];
      const qty=cur?cur.qty:'';
      let vendorBlock;
      if(!pick){ vendorBlock=`<div class="op-vendor"><span class="name muted" onclick="openVendorPick(event,'${esc(g.key)}')">No price on file</span><span class="tag none">no quote</span></div>`; }
      else{
        const uc=unitCost(pick.price,pick.packSize);
        const isMan=isManualPick(g);
        const tagHtml = isMan ? '<span class="tag manual">manual</span>' : (g.items.length>1 ? '<span class="tag cheap">cheapest</span>' : '');
        vendorBlock=`<div class="op-vendor"><span class="name" onclick="openVendorPick(event,'${esc(g.key)}')">${esc(vendorName(pick.vendorId))} <i class="ti ti-chevron-down" style="font-size:11px;opacity:.6"></i></span><span class="cost">${uc!=null?fmtMoney(uc)+'/'+esc(pick.unit||'unit'):'—'}</span>${tagHtml}</div>`;
      }
      const packTxt = pick ? (pick.packDesc || ((pick.packSize||'?')+' '+(pick.unit||''))) : '—';
      const conv = (pick && qty && pick.packSize) ? `<div class="conv">${qty} × ${pick.packSize} ${esc(pick.unit||'')} = ${(parseFloat(qty)*parseFloat(pick.packSize)).toLocaleString()} ${esc(pick.unit||'')}</div>` : '';
      return `<div class="op-row">
        <div class="op-prod"><b>${esc(g.name)}</b>${g.useFor?`<div class="sub">${esc(g.useFor)}</div>`:''}</div>
        ${vendorBlock}
        <div class="op-pack">${esc(packTxt)}</div>
        <div class="op-qty"><input type="number" min="0" step="any" value="${esc(qty)}" placeholder="cases" oninput="setQty('${esc(g.key)}', this.value)"><div class="op-conv-wrap">${conv}</div></div>
      </div>`;
    }).join('');
    return `<div class="cat-group" data-cat="${esc(c)}"><div class="cat-head" onclick="this.parentNode.classList.toggle('collapsed')"><span>${esc(c)} <span style="color:var(--text3);font-weight:400;font-size:12px">· ${byCat[c].length}</span></span><i class="ti ti-chevron-down chev"></i></div><div class="cat-body">${rows}</div></div>`;
  }).join('');
  renderCart();
}

function setQty(key, v){
  const n=parseFloat(v);
  if(!v || isNaN(n) || n<=0){ if(orderCart[key]){ delete orderCart[key]; } } else {
    orderCart[key]=orderCart[key]||{};
    orderCart[key].qty=n;
    if(!orderCart[key].vendorItemId){
      const g=ourProducts().find(x=>x.key===key); const pick=g?cheapestItem(g):null;
      if(pick){ orderCart[key].vendorItemId=pick.id; orderCart[key].manual=false; }
    }
  }
  // update just the conversion text for this row + the cart — don't re-render the picker (would steal focus)
  try{
    const g=ourProducts().find(x=>x.key===key);
    const pick=g?selectedVendorItem(g):null;
    const inp=document.querySelector('input[oninput*="setQty(\''+key.replace(/'/g,"\\'")+'\'"]');
    const wrap=inp?inp.parentNode.querySelector('.op-conv-wrap'):null;
    if(wrap){
      const qty=orderCart[key]?orderCart[key].qty:0;
      wrap.innerHTML = (pick && qty && pick.packSize)
        ? `<div class="conv">${qty} × ${pick.packSize} ${esc(pick.unit||'')} = ${(parseFloat(qty)*parseFloat(pick.packSize)).toLocaleString()} ${esc(pick.unit||'')}</div>` : '';
    }
  }catch(e){}
  renderCart();
}

function clearOrderCart(){
  if(!Object.keys(orderCart).length) return;
  if(!confirm('Clear all quantities from the cart?')) return;
  orderCart={}; renderOrderPicker();
}

function renderCart(){
  const el=document.getElementById('ordersCart'); if(!el) return;
  const keys=Object.keys(orderCart);
  if(!keys.length){
    el.innerHTML='<div class="cart-head">Cart <span class="count">empty</span></div><div class="cart-empty">Type a quantity beside any product on the left and it will appear here, grouped by vendor.</div>';
    return;
  }
  const groups=ourProducts();
  // bucket lines by vendor
  const buckets={};
  keys.forEach(k=>{
    const g=groups.find(x=>x.key===k); if(!g) return;
    const pick=selectedVendorItem(g); if(!pick){ buckets._novendor=buckets._novendor||[]; buckets._novendor.push({g,qty:orderCart[k].qty,pick:null}); return; }
    const b=buckets[pick.vendorId]=buckets[pick.vendorId]||{ vendorId:pick.vendorId, lines:[], totalCases:0, totalDollars:0 };
    const qty=orderCart[k].qty;
    const lineTotal=(parseFloat(pick.price)||0)*qty;
    b.lines.push({ g, qty, pick, lineTotal });
    b.totalCases += qty;
    b.totalDollars += lineTotal;
  });
  let html='<div class="cart-head">Cart <span class="count">'+keys.length+' line'+(keys.length===1?'':'s')+'</span></div><div class="cart-body">';
  Object.values(buckets).forEach(b=>{
    if(b.vendorId===undefined) return;
    const v=vendors.find(x=>x.id===b.vendorId)||{};
    const minWarn = minimumWarning(v, b);
    html += '<div class="cart-vendor"><div class="vh"><span class="name">'+esc(v.name||'(vendor)')+'</span><span class="tot">'+fmtMoney(b.totalDollars)+'</span></div>';
    b.lines.forEach(L=>{
      html += '<div class="vline"><span class="qn">'+L.qty+' × '+esc(L.g.name)+'</span><span class="px">'+fmtMoney(L.lineTotal)+'</span></div>';
    });
    if(minWarn) html += '<div class="warn">'+esc(minWarn)+'</div>';
    html += '</div>';
  });
  if(buckets._novendor && buckets._novendor.length){
    html += '<div class="cart-vendor"><div class="vh"><span class="name" style="color:var(--maroon)">No vendor chosen</span></div>';
    buckets._novendor.forEach(L=>{ html += '<div class="vline"><span class="qn">'+L.qty+' × '+esc(L.g.name)+'</span><span class="px muted">pick a vendor</span></div>'; });
    html += '</div>';
  }
  html += '</div><div class="cart-foot"><button class="btn" style="width:100%" onclick="openReviewOrders()"><i class="ti ti-clipboard-check"></i> Review & build orders</button></div>';
  el.innerHTML=html;
}

function minimumWarning(v, bucket){
  const t=(v.minType||'none'), amt=parseFloat(v.minAmount||0);
  if(t==='none' || !(amt>0)) return '';
  if(t==='dollars' && bucket.totalDollars < amt) return 'Below minimum: $'+(amt-bucket.totalDollars).toFixed(2)+' short of $'+amt.toFixed(2)+' minimum';
  if(t==='cases'   && bucket.totalCases   < amt) return 'Below minimum: '+(amt-bucket.totalCases)+' more cases needed (min '+amt+')';
  return '';
}

// ── Vendor pick popover (override) ──
let _vpopKey=null;
function openVendorPick(evt,key){
  if(evt){ evt.stopPropagation(); }
  const g=ourProducts().find(x=>x.key===key); if(!g) return;
  closeVendorPick();
  _vpopKey=key;
  const bg=document.createElement('div'); bg.className='vpop-bg show'; bg.onclick=closeVendorPick;
  const pop=document.createElement('div'); pop.className='vpop';
  const cheap=cheapestItem(g);
  const items=g.items.slice().sort((a,b)=>{ const A=unitCost(a.price,a.packSize), B=unitCost(b.price,b.packSize); if(A==null) return 1; if(B==null) return -1; return A-B; });
  pop.innerHTML = '<div class="h">Pick vendor for '+esc(g.name)+'</div>' + items.map(x=>{
    const uc=unitCost(x.price,x.packSize);
    const isCh=(cheap && x.id===cheap.id);
    return '<div class="vpop-opt '+(isCh?'cheapest':'')+'" onclick="pickVendor(\''+esc(key)+'\',\''+x.id+'\')"><span><b>'+esc(vendorName(x.vendorId))+'</b><div class="sub">'+esc(x.vendorItemName||'—')+'</div></span><span class="vc">'+(uc!=null?fmtMoney(uc)+'/'+esc(x.unit||'u'):'—')+(isCh?' · cheapest':'')+'</span></div>';
  }).join('');
  document.body.appendChild(bg);
  // anchor near the trigger
  const r=evt.currentTarget.getBoundingClientRect();
  pop.style.left=Math.min(window.innerWidth-340, r.left)+'px';
  pop.style.top=(r.bottom+window.scrollY+6)+'px';
  document.body.appendChild(pop);
  pop.id='_vpopEl';
}
function closeVendorPick(){
  document.querySelectorAll('.vpop-bg,#_vpopEl').forEach(n=>n.remove());
  _vpopKey=null;
}
function pickVendor(key, vendorItemId){
  const g=ourProducts().find(x=>x.key===key); if(!g){ closeVendorPick(); return; }
  const cheap=cheapestItem(g);
  const isManual = !(cheap && cheap.id===vendorItemId);
  orderCart[key]=orderCart[key]||{};
  orderCart[key].vendorItemId=vendorItemId;
  orderCart[key].manual=isManual;
  if(!orderCart[key].qty) orderCart[key].qty=1; // typing implied intent
  closeVendorPick();
  renderOrderPicker();
}

function openReviewOrders(){
  // bucket cart by vendor
  const groups=ourProducts();
  const buckets={};
  Object.keys(orderCart).forEach(k=>{
    const g=groups.find(x=>x.key===k); if(!g) return;
    const pick=selectedVendorItem(g); if(!pick) return;
    const b=buckets[pick.vendorId]=buckets[pick.vendorId]||{ vendorId:pick.vendorId, lines:[], totalCases:0, totalDollars:0 };
    const qty=orderCart[k].qty;
    const lineTotal=(parseFloat(pick.price)||0)*qty;
    b.lines.push({ key:k, productName:g.name, useFor:g.useFor||'', qty, pick, lineTotal });
    b.totalCases+=qty; b.totalDollars+=lineTotal;
  });
  const list=Object.values(buckets);

    if(v.phone) html += '<span>Phone: <b>'+esc(v.phone)+'</b></span>';
    if(v.deliveryDays) html += '<span>Delivery days: <b>'+esc(v.deliveryDays)+'</b></span>';
    html += '<span class="po-need">Needed by: <input type="date" id="need_'+idx+'"></span>';
    html += '</div>';
    html += '<table><thead><tr><th>Qty</th><th>Item</th><th>Code</th><th>Pack</th><th style="text-align:right">Price</th><th style="text-align:right">Line total</th></tr></thead><tbody>';
    b.lines.forEach(L=>{
      const pack = L.pick.packDesc || ((L.pick.packSize||'?')+' '+(L.pick.unit||''));
      html += '<tr><td><b>'+L.qty+'</b></td><td>'+esc(L.pick.vendorItemName||L.productName)+(L.useFor?'<div class="sub" style="font-size:11px;color:var(--text3)">'+esc(L.useFor)+'</div>':'')+'</td><td class="muted">'+esc(L.pick.vendorCode||'—')+'</td><td>'+esc(pack)+'</td><td style="text-align:right">'+fmtMoney(L.pick.price)+'</td><td style="text-align:right">'+fmtMoney(L.lineTotal)+'</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="po-foot"><span class="muted">Vendor sees quantities + their item names/codes only. The printer copy will include prices.</span><span class="gt">Total: '+fmtMoney(b.totalDollars)+'</span></div>';
    if(warn) html += '<div class="po-warn">'+esc(warn)+'</div>';
    html += '</div>';
  });
  html += '</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Back to cart</button><button class="btn" onclick="confirmAndSaveOrders()"><i class="ti ti-check"></i> Confirm and save</button></div>';
  openModal(html);
}

async function confirmAndSaveOrders(){
  // re-bucket (in case user opened picker behind & changed) and capture needed-by dates from the modal
  const groups=ourProducts();
  const buckets={};
  Object.keys(orderCart).forEach(k=>{
    const g=groups.find(x=>x.key===k); if(!g) return;
    const pick=selectedVendorItem(g); if(!pick) return;
    const b=buckets[pick.vendorId]=buckets[pick.vendorId]||{ vendorId:pick.vendorId, lines:[], totalCases:0, totalDollars:0 };
    const qty=orderCart[k].qty;
    const lineTotal=(parseFloat(pick.price)||0)*qty;
    b.lines.push({ productKey:k, productName:g.name, useFor:g.useFor||'', qty, lineTotal,
      pick:{ id:pick.id, vendorItemName:pick.vendorItemName||'', vendorCode:pick.vendorCode||'', packDesc:pick.packDesc||'', packSize:pick.packSize||0, unit:pick.unit||'', price:pick.price||0 }
    });
    b.totalCases+=qty; b.totalDollars+=lineTotal;
  });
  const list=Object.values(buckets);
  if(!list.length){ alert('Cart is empty.'); return; }
  const cards=document.querySelectorAll('#modal .po-card');
  const neededBy={};
  cards.forEach(c=>{ const vid=c.getAttribute('data-vid'); const inp=c.querySelector('input[type="date"]'); if(vid && inp) neededBy[vid]=inp.value||''; });
  const batch = db.batch();
  const stamp = Date.now();
  try{
    // Allocate one sequence number per order, then build the batch with poNumber attached.
    const seqs = [];
    for(let i=0;i<list.length;i++){ seqs.push(await nextPoSeq()); }
    list.forEach((b, idx)=>{
      const v=vendors.find(x=>x.id===b.vendorId)||{};
      const ref = db.collection('orders').doc();
      const seq = seqs[idx];
      const poNumber = formatPoNumber(seq, stamp, v.name||'');
      batch.set(ref, {
        poNumber: poNumber,
        poSeq: seq,
        vendorId: b.vendorId,
        vendorName: v.name||'',
        vendorEmail: v.email||'',
        neededBy: neededBy[b.vendorId]||'',
        lines: b.lines,
        totalCases: b.totalCases,
        totalDollars: b.totalDollars,
        minType: v.minType||'none',
        minAmount: v.minAmount||0,
        minWarning: minimumWarning(v,b),
        status: 'saved',
        sendAttempts: [],
        placedBy: userLabel(),
        placedAt: stamp,
        createdAt: stamp
      });
    });
    await batch.commit();
    orderCart={};
    closeModal();
    toast('Orders saved ✓ ('+list.length+')');
    renderOrderPicker();
    // Offer to send them immediately if a relay is configured.
    if(getOrdersRelayUrl()){
      // small delay so Firestore listeners catch up with the just-written orders
      setTimeout(async ()=>{
        if(confirm('Saved '+list.length+' order'+(list.length===1?'':'s')+'. Send '+(list.length===1?'it':'them')+' now via orders@thepremiercaterer.com?')){
          await sendAllSavedOrders();
        }
        showView('orderhist');
      }, 600);
    } else {
      if(confirm('Saved. The orders relay URL isn’t set yet — open Settings to paste it?')){ openOrdersSettings(); }
      else showView('orderhist');
    }
  }catch(e){ alert('Could not save orders: '+e.message); }
}

    html += '<tr><td><b>'+L.qty+'</b></td><td>'+esc((L.pick&&L.pick.vendorItemName)||L.productName||'')+'</td><td class="muted">'+esc((L.pick&&L.pick.vendorCode)||'—')+'</td><td>'+esc(pack)+'</td><td style="text-align:right">'+fmtMoney(L.pick&&L.pick.price)+'</td><td style="text-align:right">'+fmtMoney(L.lineTotal)+'</td></tr>'; });

  html += '</div><div class="modal-foot">'+
    (canEdit()&&o.vendorEmail?`<button class="btn" onclick="sendOrderViaRelay('${o.id}').then(()=>{closeModal();renderOrderHistory();})"><i class="ti ti-send"></i> ${o.status==='sent'?'Resend':'Send order'}</button>`:'')+
    '<button class="btn ghost" onclick="closeModal()">Close</button></div>';
  openModal(html);
}
function reorderFromHistory(id){
  const o=orders.find(x=>x.id===id); if(!o) return;
  if(Object.keys(orderCart).length && !confirm('This will add to your current cart. Continue?')) return;
  const groups=ourProducts();
  (o.lines||[]).forEach(L=>{
    // try to match the product by key (productKey saved on the line)
    const key = L.productKey || groups.find(g=>normName(g.name)===normName(L.productName))?.key;
    if(!key) return;
    orderCart[key]=orderCart[key]||{};
    orderCart[key].qty = (orderCart[key].qty||0)+L.qty;
    // Try to keep the same vendor item if it still exists
    if(L.pick && L.pick.id){
      const stillThere = items.find(x=>x.id===L.pick.id);
      if(stillThere){ orderCart[key].vendorItemId=L.pick.id; const g=groups.find(g=>g.key===key); const cheap=g?cheapestItem(g):null; orderCart[key].manual = !(cheap && cheap.id===L.pick.id); }
    }
  });
  toast('Copied to cart');
  showView('orders');
}

// Vendor item
// ════════ BULK ADD ITEMS ════════
// One vendor, many items at once. Grid you can type into directly or paste
// into from a spreadsheet. Validation runs on save and flags any row that's
// missing required fields. Valid rows commit in a single Firestore batch.
const BULK_COLS = [
  { key:'ourName',        label:'Our product name', req:true,  cls:'' },
  { key:'useFor',         label:'Use for',          req:false, cls:'' },
  { key:'category',       label:'Category',         req:false, cls:'' },
  { key:'unit',           label:'Our unit',         req:true,  cls:'' },
  { key:'vendorItemName', label:'Vendor item',      req:false, cls:'' },
  { key:'vendorCode',     label:'Vendor code',      req:false, cls:'' },
  { key:'packDesc',       label:'Pack desc',        req:false, cls:'' },
  { key:'packSize',       label:'Pack size',        req:true,  cls:'num' },
  { key:'price',          label:'Pack price',       req:true,  cls:'num' },
  { key:'date',           label:'Date',             req:false, cls:'date' },
  { key:'notes',          label:'Notes',            req:false, cls:'' }
];
function openBulkAdd(){
  if(!canEdit()) return;
  if(!vendors.length){ alert('Add at least one vendor first (Vendors tab).'); return; }
  const vOpts = vendors.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''))
    .map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');
  const ths = BULK_COLS.map(c=>`<th class="${c.req?'req':''}">${esc(c.label)}</th>`).join('')+'<th></th>';
  const blankRow = '<tr>'+BULK_COLS.map(c=>`<td class="${c.cls}"><input data-k="${c.key}" type="${c.cls==='num'?'number':(c.cls==='date'?'date':'text')}" ${c.cls==='num'?'step="any"':''} ></td>`).join('')+'<td class="del"><button onclick="this.closest(\'tr\').remove();updateBulkStatus()" title="Remove row"><i class="ti ti-x"></i></button></td></tr>';
  const startingRows = Array.from({length:8}).map(()=>blankRow).join('');

  // Build the modal directly (skipping openModal's max-width) so we can be wider.
  const mb=document.getElementById('modalBg'), m=document.getElementById('modal');
  m.style.maxWidth='1080px';
  m.innerHTML = `<div class="modal-head"><div class="h">Bulk add items</div><button class="icon-btn" onclick="closeBulkAdd()"><i class="ti ti-x"></i></button></div>
  <div class="bulk-vendor">
    <label style="font-size:12px;color:var(--text2);font-weight:600">Vendor *</label>
    <select id="bulkVendor">${vOpts}</select>
    <span style="font-size:12px;color:var(--text3)">All items below will be saved as this vendor's.</span>
  </div>
  <div class="bulk-hint">Type in rows or paste a block from a spreadsheet (tab-separated). Each row becomes one item. Required: <b>Our product name</b>, <b>Our unit</b>, <b>Pack size</b>, <b>Pack price</b>.</div>
  <div class="bulk-grid-wrap"><table class="bulk-grid"><thead><tr>${ths}</tr></thead><tbody id="bulkBody">${startingRows}</tbody></table></div>
  <div class="bulk-actions">
    <div class="left">
      <button class="btn ghost" onclick="bulkAddRows(5)"><i class="ti ti-plus"></i> Add 5 rows</button>
      <button class="btn ghost" onclick="bulkClear()"><i class="ti ti-eraser"></i> Clear all</button>
      <span class="bulk-status" id="bulkStatus">Ready</span>
    </div>
    <div>
      <button class="btn ghost" onclick="closeBulkAdd()">Cancel</button>
      <button class="btn" onclick="bulkSave()"><i class="ti ti-device-floppy"></i> Save all</button>
    </div>
  </div>`;
  mb.classList.add('show');
  // Wire paste handler — paste tab-separated rows into a starting cell to fill across.
  const body = document.getElementById('bulkBody');
  body.addEventListener('paste', onBulkPaste);
  // Live status as user types
  body.addEventListener('input', updateBulkStatus);
  setTimeout(()=>{ const first=body.querySelector('input'); if(first) first.focus(); },80);
}
function closeBulkAdd(){
  document.getElementById('modalBg').classList.remove('show');
  const m=document.getElementById('modal'); m.style.maxWidth=''; m.innerHTML='';
}
function bulkAddRows(n){
  const body=document.getElementById('bulkBody'); if(!body) return;
  for(let i=0;i<n;i++){
    const row=document.createElement('tr');
    row.innerHTML = BULK_COLS.map(c=>`<td class="${c.cls}"><input data-k="${c.key}" type="${c.cls==='num'?'number':(c.cls==='date'?'date':'text')}" ${c.cls==='num'?'step="any"':''} ></td>`).join('')+'<td class="del"><button onclick="this.closest(\'tr\').remove();updateBulkStatus()" title="Remove row"><i class="ti ti-x"></i></button></td>';
    body.appendChild(row);
  }
  updateBulkStatus();
}
function bulkClear(){
  if(!confirm('Clear every row in the grid?')) return;
  const body=document.getElementById('bulkBody'); if(!body) return;
  body.querySelectorAll('input').forEach(i=>{ i.value=''; i.classList.remove('err'); });
  body.querySelectorAll('tr').forEach(tr=>tr.classList.remove('err'));
  updateBulkStatus();
}

// Paste handler: if the user pastes a block of TSV (Excel/Sheets copy) into a
// cell, expand it across columns and down rows from the focused cell.
function onBulkPaste(e){
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!txt) return;
  // Only intercept if the paste actually looks like multiple cells / rows
  if(txt.indexOf('\t')<0 && txt.indexOf('\n')<0) return;
  e.preventDefault();
  const target=e.target;
  if(!target.matches('input')) return;
  const startTr = target.closest('tr');
  const startTd = target.closest('td');
  const startTdIdx = Array.prototype.indexOf.call(startTr.children, startTd);
  const tbody=startTr.parentNode;
  // Split into rows
  const rows = txt.replace(/\r/g,'').split('\n').filter(r=>r.length);
  rows.forEach((rowText, ri)=>{
    const cells = rowText.split('\t');
    // Ensure a target row exists
    let tr = tbody.children[ Array.prototype.indexOf.call(tbody.children, startTr) + ri ];
    if(!tr){ bulkAddRows(1); tr = tbody.lastElementChild; }
    cells.forEach((val, ci)=>{
      const tdIdx = startTdIdx + ci;
      const td = tr.children[tdIdx]; if(!td || !td.querySelector('input')) return;
      td.querySelector('input').value = val.trim();
    });
  });
  updateBulkStatus();
}

function readBulkRow(tr){
  const out={};
  tr.querySelectorAll('input').forEach(i=>{ out[i.dataset.k] = (i.value||'').trim(); });
  return out;
}
function rowIsEmpty(r){ return BULK_COLS.every(c=>!r[c.key]); }
function rowMissing(r){
  const missing=[];
  BULK_COLS.filter(c=>c.req).forEach(c=>{ if(!r[c.key]) missing.push(c.label); });
  // numeric sanity
  if(r.packSize && !(parseFloat(r.packSize)>0)) missing.push('Pack size (must be > 0)');
  if(r.price && !(parseFloat(r.price)>0)) missing.push('Pack price (must be > 0)');
  return missing;
}
function updateBulkStatus(){
  const body=document.getElementById('bulkBody'); const st=document.getElementById('bulkStatus');
  if(!body||!st) return;
  let filled=0, errs=0;
  body.querySelectorAll('tr').forEach(tr=>{
    tr.classList.remove('err'); tr.querySelectorAll('input').forEach(i=>i.classList.remove('err'));
    const r=readBulkRow(tr); if(rowIsEmpty(r)) return;
    filled++;
    if(rowMissing(r).length) errs++;
  });
  if(!filled){ st.className='bulk-status'; st.textContent='Ready'; return; }
  if(errs){ st.className='bulk-status err'; st.textContent=filled+' filled · '+errs+' need attention'; }
  else { st.className='bulk-status'; st.textContent=filled+' ready to save ✓'; }
}

async function bulkSave(){
  const vendorSel=document.getElementById('bulkVendor');
  const vendorId = vendorSel ? vendorSel.value : '';
  if(!vendorId){ alert('Pick a vendor.'); return; }
  const body=document.getElementById('bulkBody'); if(!body) return;
  const rows=Array.from(body.querySelectorAll('tr'));
  const toSave=[]; let errCount=0;
  rows.forEach(tr=>{
    tr.classList.remove('err'); tr.querySelectorAll('input').forEach(i=>i.classList.remove('err'));
    const r=readBulkRow(tr); if(rowIsEmpty(r)) return;
    const miss=rowMissing(r);
    if(miss.length){
      tr.classList.add('err');
      // mark the actual missing inputs
      BULK_COLS.filter(c=>c.req).forEach(c=>{ if(!r[c.key]){ const inp=tr.querySelector('input[data-k="'+c.key+'"]'); if(inp) inp.classList.add('err'); } });
      if(r.packSize && !(parseFloat(r.packSize)>0)){ const inp=tr.querySelector('input[data-k="packSize"]'); if(inp) inp.classList.add('err'); }
      if(r.price && !(parseFloat(r.price)>0)){ const inp=tr.querySelector('input[data-k="price"]'); if(inp) inp.classList.add('err'); }
      errCount++;
      return;
    }
    toSave.push(r);
  });
  if(errCount){ document.getElementById('bulkStatus').textContent=errCount+' row'+(errCount===1?'':'s')+' need fixing — others ready'; document.getElementById('bulkStatus').className='bulk-status err'; }
  if(!toSave.length){ if(!errCount) alert('No rows to save.'); return; }
  if(errCount && !confirm('Save '+toSave.length+' valid row'+(toSave.length===1?'':'s')+' and skip the '+errCount+' with errors?')) return;
  // Commit
  const batch=db.batch(); const ts=Date.now();
  toSave.forEach(r=>{
    const ref=db.collection('vendorItems').doc();
    batch.set(ref, {
      vendorId,
      ourName: r.ourName,
      useFor:  r.useFor||'',
      category: r.category||'',
      unit:    r.unit,
      vendorItemName: r.vendorItemName||'',
      vendorCode:     r.vendorCode||'',
      packDesc:       r.packDesc||'',
      packSize: parseFloat(r.packSize),
      price:    parseFloat(r.price),
      date:     r.date||'',
      notes:    r.notes||'',
      createdAt: ts, updatedAt: ts
    });
  });
  try{ await batch.commit(); toast('Saved '+toSave.length+' item'+(toSave.length===1?'':'s')+' ✓'); closeBulkAdd(); }
  catch(e){ alert('Could not save: '+e.message); }
}
window.openBulkAdd = openBulkAdd;
window.closeBulkAdd = closeBulkAdd;
window.bulkAddRows = bulkAddRows;
window.bulkClear = bulkClear;
window.bulkSave = bulkSave;
window.updateBulkStatus = updateBulkStatus;

// ════════ Single-item edit/add ════════
function openItem(id){
  if(!canEdit()) return;
  if(!vendors.length){ alert('Add at least one vendor first (Vendors tab).'); return; }
  const x = id?items.find(q=>q.id===id):{date:'', unit:'lb'};
  const vOpts=vendors.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(v=>`<option value="${v.id}" ${x.vendorId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');
  const catOpts=CATEGORIES.map(c=>`<option value="${c}" ${x.category===c?'selected':''}>${c||'—'}</option>`).join('');
  openModal(`<div class="modal-head"><div class="h">${id?'Edit item':'Add item'}</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="sec-label first">What you call it</div>
    <div class="fld"><label>Our product name *</label><input id="i_ourname" list="ourNameList" value="${esc(x.ourName||'')}" placeholder="e.g. Chicken Breast" autocomplete="off"><div class="hint">Use the same name across vendors — that’s how they get compared. Start typing to reuse an existing one.</div></div>
    <div class="fld"><label>What we use it for</label><input id="i_usefor" value="${esc(x.useFor||'')}" placeholder="e.g. cutlets, fried chicken"></div>
    <div class="fld-row">
      <div class="fld"><label>Category</label><select id="i_cat">${catOpts}</select></div>
      <div class="fld"><label>Our unit (for comparing) *</label><input id="i_unit" value="${esc(x.unit||'')}" placeholder="e.g. lb, each, dozen"></div>
    </div>
    <div class="sec-label">How the vendor sells it</div>
    <div class="fld"><label>Vendor *</label><select id="i_vendor">${vOpts}</select></div>
    <div class="fld-row">
      <div class="fld"><label>Vendor’s item name</label><input id="i_vname" value="${esc(x.vendorItemName||'')}" placeholder="their description"></div>
      <div class="fld"><label>Vendor’s item code</label><input id="i_vcode" value="${esc(x.vendorCode||'')}" placeholder="their SKU"></div>
    </div>
    <div class="fld"><label>How they pack it (optional)</label><input id="i_packdesc" value="${esc(x.packDesc||'')}" placeholder="e.g. 40 lb case, 12 × 2 lb bags"></div>
    <div class="fld-row">
      <div class="fld"><label>Pack size (number) *</label><input id="i_pack" type="number" step="any" value="${esc(x.packSize||'')}" placeholder="e.g. 40"><div class="hint">Total units in the pack, in your unit above.</div></div>
      <div class="fld"><label>Pack price *</label><input id="i_price" type="number" step="any" value="${esc(x.price||'')}" placeholder="e.g. 92.50"></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>Date (optional)</label><input id="i_date" type="date" value="${esc(x.date||'')}"></div>
      <div class="fld"><label>Notes</label><input id="i_notes" value="${esc(x.notes||'')}" placeholder="fresh / frozen / brand"></div>
    </div>
    <div class="hint" id="i_uc"></div>
  </div>
  <div class="modal-foot">${id?`<button class="btn ghost" onclick="deleteItem('${id}')" style="margin-right:auto;color:#c0392b">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveItem('${id||''}')">${id?'Save':'Add item'}</button></div>`);
  const upd=()=>{ const uc=unitCost(val('i_price'),val('i_pack')); document.getElementById('i_uc').innerHTML=uc!=null?('Unit cost: <b>'+fmtMoney(uc)+'/'+esc(val('i_unit')||'unit')+'</b>'):''; };
  ['i_pack','i_price','i_unit'].forEach(i=>{ const e=document.getElementById(i); if(e) e.addEventListener('input',upd); });
  // auto-fill use/category/unit when an existing product name is typed
  const on=document.getElementById('i_ourname');
  if(on) on.addEventListener('change',()=>{ const g=ourProducts().find(p=>p.key===normName(on.value)); if(g){ if(!val('i_usefor')&&g.useFor) document.getElementById('i_usefor').value=g.useFor; if(g.category) document.getElementById('i_cat').value=g.category; const ex=g.items[0]; if(ex&&ex.unit&&!val('i_unit')){ document.getElementById('i_unit').value=ex.unit; } upd(); } });
  setTimeout(()=>document.getElementById('i_ourname').focus(),60); upd();
}
async function saveItem(id){
  const ourName=val('i_ourname'), unit=val('i_unit'), vendorId=val('i_vendor'), packSize=val('i_pack'), price=val('i_price');
  if(!ourName){ alert('“Our product name” is required — it’s how vendors get compared.'); return; }
  if(!unit){ alert('“Our unit” is required (e.g. lb) — it’s the basis for unit cost.'); return; }
  if(!vendorId){ alert('Pick a vendor.'); return; }
  if(!packSize||!price){ alert('Pack size and pack price are required.'); return; }
  const data={ ourName, useFor:val('i_usefor'), category:val('i_cat'), unit,
    vendorId, vendorItemName:val('i_vname'), vendorCode:val('i_vcode'), packDesc:val('i_packdesc'),
    packSize:parseFloat(packSize), price:parseFloat(price), date:val('i_date'), notes:val('i_notes'), updatedAt:Date.now() };
  try{ if(id){ await db.collection('vendorItems').doc(id).set(data,{merge:true}); } else { data.createdAt=Date.now(); await db.collection('vendorItems').add(data); } closeModal(); toast('Item saved ✓'); }
  catch(e){ alert('Could not save: '+e.message); }
}
async function deleteItem(id){ if(!confirm('Delete this item?')) return; try{ await db.collection('vendorItems').doc(id).delete(); closeModal(); toast('Item deleted'); }catch(e){ alert('Could not delete: '+e.message); } }

// Vendor
function openVendor(id){
  if(!canEdit()) return;
  const v=id?vendors.find(x=>x.id===id):{};
  openModal(`<div class="modal-head"><div class="h">${id?'Edit vendor':'New vendor'}</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="fld"><label>Vendor name *</label><input id="v_name" value="${esc(v.name||'')}"></div>
    <div class="fld-row"><div class="fld"><label>Contact person</label><input id="v_contact" value="${esc(v.contact||'')}"></div><div class="fld"><label>Sales rep</label><input id="v_rep" value="${esc(v.rep||'')}"></div></div>
    <div class="fld-row"><div class="fld"><label>Phone</label><input id="v_phone" value="${esc(v.phone||'')}"></div><div class="fld"><label>Email</label><input id="v_email" value="${esc(v.email||'')}"></div></div>
    <div class="fld-row"><div class="fld"><label>Payment terms</label><input id="v_terms" value="${esc(v.terms||'')}" placeholder="e.g. Net 30"></div><div class="fld"><label>Delivery days</label><input id="v_delivery" value="${esc(v.deliveryDays||'')}" placeholder="e.g. Mon, Thu"></div></div>
    <div class="fld-row">
      <div class="fld"><label>Minimum order</label>
        <select id="v_mintype">
          <option value="none" ${(v.minType||'none')==='none'?'selected':''}>None</option>
          <option value="dollars" ${v.minType==='dollars'?'selected':''}>Dollar amount</option>
          <option value="cases" ${v.minType==='cases'?'selected':''}>Number of cases</option>
        </select>
      </div>
      <div class="fld"><label>Minimum amount</label><input id="v_minamt" type="number" step="any" value="${esc(v.minAmount||'')}" placeholder="e.g. 250 or 5"><div class="hint">$ for dollar minimums, count for case minimums.</div></div>
    </div>
    <div class="fld"><label>Notes</label><textarea id="v_notes">${esc(v.notes||'')}</textarea></div>
  </div>
  <div class="modal-foot">${id?`<button class="btn ghost" onclick="deleteVendor('${id}')" style="margin-right:auto;color:#c0392b">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveVendor('${id||''}')">Save</button></div>`);
  setTimeout(()=>document.getElementById('v_name').focus(),60);
}
async function saveVendor(id){
  const name=val('v_name'); if(!name){ alert('Vendor name is required.'); return; }
  const data={ name, contact:val('v_contact'), rep:val('v_rep'), phone:val('v_phone'), email:val('v_email'), terms:val('v_terms'), deliveryDays:val('v_delivery'), minType:val('v_mintype')||'none', minAmount:val('v_minamt')?parseFloat(val('v_minamt')):0, notes:val('v_notes'), updatedAt:Date.now() };
  try{ if(id){ await db.collection('vendors').doc(id).set(data,{merge:true}); } else { data.createdAt=Date.now(); await db.collection('vendors').add(data); } closeModal(); toast('Vendor saved ✓'); }
  catch(e){ alert('Could not save: '+e.message); }
}
async function deleteVendor(id){
  if(items.some(x=>x.vendorId===id)){ alert('This vendor has items — remove those first.'); return; }
  if(!confirm('Delete this vendor?')) return;
  try{ await db.collection('vendors').doc(id).delete(); closeModal(); toast('Vendor deleted'); }catch(e){ alert('Could not delete: '+e.message); }
}

let _toastT=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),2200); }
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

if(!tryResumeSession()) showLogin();
</script>
