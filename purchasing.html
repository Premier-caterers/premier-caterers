<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier Caterers — Purchasing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg2:#FCFAF6;--bg3:#F7F3EC;
  --text:#2B2420;--text2:#6B6058;--text3:#9A8E84;
  --border:#EAE2D6;--border2:#DDD3C4;
  --maroon:#8B1A1A;--maroon-deep:#6E1414;--maroon-tint:#F3E4E2;
  --brass:#B0894B;--brass-deep:#8C6B36;--brass-tint:#F6EEDF;
  --green:#2E7D5B;--green-bg:#E4F1EA;--green-text:#216B47;
  --radius:9px;--radius-lg:14px;
  --shadow:0 1px 2px rgba(43,36,32,.04),0 4px 14px rgba(43,36,32,.06);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5}
.serif{font-family:'Fraunces',Georgia,serif}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--maroon);text-decoration:none}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(247,243,236,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;color:var(--maroon);display:flex;align-items:center;gap:9px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brass),var(--brass-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.topbar .spacer{flex:1}
.topbar .who{font-size:12.5px;color:var(--text2)}
.topbar .tb-link{font-size:12.5px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer}
.topbar .tb-link:hover{border-color:var(--border2)}

.tabs{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap}
.tab{padding:9px 16px;border:none;background:transparent;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:9px 9px 0 0;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--maroon);border-bottom-color:var(--maroon);background:var(--bg)}

.wrap{padding:20px;max-width:1200px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.row-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.row-head .title{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;flex:1}
.search{flex:1;min-width:200px;max-width:340px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}
.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}

.btn{padding:9px 15px;border:none;border-radius:9px;background:var(--maroon);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--maroon-deep)}
.btn.ghost{background:var(--bg2);color:var(--text2);border:1px solid var(--border2)}
.btn.ghost:hover{background:var(--bg3);color:var(--text)}

.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
.muted{color:var(--text3)}
.sub{font-size:11.5px;color:var(--text3)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--brass-tint);color:var(--brass-deep)}
.chip.cat{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.lowest{background:var(--green-bg) !important}
.lowest td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.tag-low{font-size:10px;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.unit-cost{font-family:'Fraunces',Georgia,serif;font-weight:600}
.empty{text-align:center;color:var(--text3);padding:48px 20px}
.icon-btn{border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:16px;padding:5px;border-radius:6px}
.icon-btn:hover{background:var(--bg3);color:var(--maroon)}
.cmp-pick select{width:100%;max-width:440px;padding:11px 13px;border:1px solid var(--border2);border-radius:10px;background:var(--bg)}
.cmp-meta{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;color:var(--text2);font-size:13px}
.cmp-meta b{color:var(--text);font-family:'Fraunces',Georgia,serif}

/* ── alerts ── */
.tab-badge{display:none;background:var(--maroon);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;letter-spacing:.02em}
.tab-badge.show{display:inline-block}
.alert-sec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.alert-sec-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2)}
.alert-sec-head .icn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.alert-sec-head.sev-hi .icn{background:var(--maroon-tint);color:var(--maroon-deep)}
.alert-sec-head.sev-md .icn{background:var(--brass-tint);color:var(--brass-deep)}
.alert-sec-head.sev-lo .icn{background:var(--bg3);color:var(--text2)}
.alert-sec-head .ttl{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;color:var(--text);flex:1}
.alert-sec-head .ttl .sub{font-size:11.5px;color:var(--text3);font-family:'Inter',sans-serif;font-weight:400;margin-top:1px}
.alert-sec-head .count{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--text2);font-size:13px}
.alert-row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.alert-row:last-child{border-bottom:none}
.alert-row .what{flex:1;min-width:0}
.alert-row .what b{color:var(--text)}
.alert-row .what .sub{font-size:11.5px;color:var(--text3);margin-top:1px}
.alert-row .age{font-size:11.5px;color:var(--text3);min-width:80px;text-align:right}
.alert-row .age.hi{color:var(--maroon);font-weight:600}
.alert-row .age.md{color:var(--brass-deep);font-weight:600}
.alert-row .fix{font-size:11.5px;padding:4px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit}
.alert-row .fix:hover{background:var(--bg3);color:var(--maroon);border-color:var(--maroon)}
.alert-clean{background:var(--green-bg);border:1px solid #cfe6da;border-radius:var(--radius-lg);padding:18px 20px;color:var(--green-text);font-size:13.5px;text-align:center;font-weight:500}

/* ── vendor replies ── */
.reply-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.reply-head{padding:11px 15px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reply-head .vname{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--text);font-size:15px;flex:1;min-width:140px}
.reply-head .when{font-size:11.5px;color:var(--text3)}
.reply-head .from{font-size:11.5px;color:var(--text3)}
.reply-head .sugg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px;border:1px solid var(--brass);background:var(--brass-tint);color:var(--brass-deep)}
.reply-head .sugg i{font-size:13px}
.reply-link{font-size:11.5px;color:var(--text2);text-decoration:underline dotted;cursor:pointer}
.reply-link:hover{color:var(--maroon)}
.reply-body{padding:12px 15px}
.reply-subject{font-size:12.5px;color:var(--text2);margin-bottom:6px}
.reply-snippet{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;background:var(--bg2);border-left:3px solid var(--border2);padding:8px 12px;border-radius:0 6px 6px 0}
.reply-actions{padding:10px 15px;border-top:1px solid var(--border);background:var(--bg2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reply-actions .lbl{font-size:11.5px;color:var(--text3);margin-right:4px}
.reply-pill{font-size:11.5px;padding:5px 11px;border:1px solid var(--border2);border-radius:18px;background:var(--bg);color:var(--text2);cursor:pointer;font-family:inherit}
.reply-pill:hover{border-color:var(--maroon);color:var(--maroon)}
.reply-pill.active.confirmed{background:var(--green-bg);border-color:var(--green-text);color:var(--green-text);font-weight:600}
.reply-pill.active.issue{background:var(--maroon-tint);border-color:var(--maroon);color:var(--maroon);font-weight:600}
.reply-pill.active.question{background:var(--brass-tint);border-color:var(--brass-deep);color:var(--brass-deep);font-weight:600}
.reply-pill.active.unclear{background:var(--bg3);border-color:var(--text3);color:var(--text2);font-weight:600}
.reply-orderlink{margin-left:auto;font-size:11.5px}
.reply-unmatched{background:var(--brass-tint);color:var(--brass-deep);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.reply-summary{font-size:12.5px;color:var(--text2);background:var(--brass-tint);padding:8px 12px;border-radius:8px;margin:0 15px 10px;border-left:3px solid var(--brass)}
.reply-summary b{color:var(--brass-deep)}

/* ── bulk add items grid ── */
.bulk-modal{max-width:1080px !important}
.bulk-vendor{padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bulk-vendor select{padding:8px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);min-width:200px}
.bulk-hint{font-size:11.5px;color:var(--text3);padding:10px 20px 0}
.bulk-grid-wrap{padding:10px 20px 14px;overflow-x:auto}
.bulk-grid{width:100%;border-collapse:collapse;font-size:12.5px}
.bulk-grid th{position:sticky;top:0;background:var(--bg2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600;padding:7px 6px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.bulk-grid th.req::after{content:' *';color:var(--maroon)}
.bulk-grid td{padding:0;border-bottom:1px solid var(--border)}
.bulk-grid td input{width:100%;border:none;background:transparent;padding:8px 7px;font-size:12.5px;font-family:inherit;color:var(--text);min-width:80px}
.bulk-grid td input:focus{outline:2px solid var(--maroon);outline-offset:-2px;background:var(--bg2)}
.bulk-grid td input.err{background:#fdebe9}
.bulk-grid tr.err{background:#fef5f4}
.bulk-grid td.del{width:36px;text-align:center;color:var(--text3)}
.bulk-grid td.del button{border:none;background:transparent;cursor:pointer;color:var(--text3);font-size:14px;padding:6px}
.bulk-grid td.del button:hover{color:var(--maroon)}
.bulk-grid td.num{width:80px}
.bulk-grid td.date{width:120px}
.bulk-actions{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border-top:1px solid var(--border);flex-wrap:wrap}
.bulk-actions .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk-status{font-size:12px;color:var(--text3)}
.bulk-status.err{color:var(--maroon);font-weight:600}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.dash-tile{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow)}
.dash-tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600}
.dash-tile .v{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;color:var(--text);margin-top:3px;line-height:1.1}
.dash-tile .sub{font-size:11px;color:var(--text3);margin-top:3px}
.dash-tile.warn .v{color:var(--brass-deep)}
.dash-tile.alert .v{color:var(--maroon)}
.dash-sec{margin-top:22px}
.dash-sec-title{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;margin-bottom:9px;display:flex;align-items:baseline;gap:9px}
.dash-sec-title .note{font-size:11.5px;color:var(--text3);font-family:'Inter',sans-serif;font-weight:400}
.change-up{color:#b1361a;font-weight:600}
.change-down{color:var(--green-text);font-weight:600}
.stale-30{color:var(--brass-deep);font-weight:600}
.stale-60{color:var(--maroon);font-weight:600}
.dash-empty{background:var(--bg2);border:1px dashed var(--border2);border-radius:9px;padding:14px;text-align:center;color:var(--text3);font-size:12.5px}

/* ── history view ── */
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-row .when{font-size:12px;color:var(--text3);min-width:90px}
.hist-row .who{font-size:11px;color:var(--text3)}
.hist-row .price{font-family:'Fraunces',Georgia,serif;font-weight:600}
.hist-row .pack{font-size:11.5px;color:var(--text2)}
.hist-current{background:var(--brass-tint);border-radius:7px;padding:9px 12px;margin:0 -12px 4px}

/* small "new quote" button inside the item row */
.btn-newq{padding:5px 10px;border:1px solid var(--green-text);background:var(--green-bg);color:var(--green-text);border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.btn-newq:hover{background:#d1e8dc}

/* ── order builder ── */
.orders-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media(max-width:900px){.orders-layout{grid-template-columns:1fr}.orders-cart{position:static !important;max-height:none !important}}
.orders-list{}
.cat-group{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.cat-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;color:var(--text)}
.cat-head .chev{transition:transform .15s;color:var(--text3)}
.cat-group.collapsed .chev{transform:rotate(-90deg)}
.cat-group.collapsed .cat-body{display:none}
.cat-body{padding:4px 0}
.op-row{display:grid;grid-template-columns:1fr 180px 110px 90px;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border)}
.op-row:last-child{border-bottom:none}
.op-row:hover{background:var(--bg2)}
.op-prod{min-width:0}
.op-prod b{display:block;font-weight:600;color:var(--text)}
.op-prod .sub{font-size:11.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-vendor{font-size:12.5px;display:flex;flex-direction:column;gap:1px;min-width:0}
.op-vendor .name{color:var(--text);font-weight:500;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.op-vendor .name:hover{color:var(--maroon)}
.op-vendor .cost{font-size:11px;color:var(--text3);font-family:'Fraunces',Georgia,serif}
.op-vendor .tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:9px;margin-top:2px;width:fit-content}
.op-vendor .tag.cheap{background:var(--green-bg);color:var(--green-text)}
.op-vendor .tag.manual{background:var(--brass-tint);color:var(--brass-deep)}
.op-vendor .tag.none{background:var(--bg3);color:var(--text3)}
.op-pack{font-size:11.5px;color:var(--text2)}
.op-qty input{width:70px;padding:7px 8px;border:1px solid var(--border2);border-radius:7px;text-align:center;font-size:13px}
.op-qty input:focus{outline:none;border-color:var(--maroon)}
.op-qty .conv{font-size:10.5px;color:var(--text3);text-align:right;margin-top:2px}
@media(max-width:640px){.op-row{grid-template-columns:1fr 1fr;grid-template-areas:'prod qty' 'vend pack';row-gap:6px}.op-prod{grid-area:prod}.op-vendor{grid-area:vend}.op-pack{grid-area:pack}.op-qty{grid-area:qty;text-align:right}}

/* sticky cart */
.orders-cart{position:sticky;top:80px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.cart-head{padding:12px 14px;border-bottom:1px solid var(--border);font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.cart-head .count{font-size:11px;color:var(--text3);font-family:'Inter',sans-serif;font-weight:400}
.cart-body{flex:1;overflow-y:auto;padding:6px 0}
.cart-empty{text-align:center;color:var(--text3);font-size:12.5px;padding:30px 18px}
.cart-vendor{padding:10px 14px;border-bottom:1px solid var(--border)}
.cart-vendor:last-child{border-bottom:none}
.cart-vendor .vh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cart-vendor .vh .name{font-weight:600;color:var(--text)}
.cart-vendor .vh .tot{font-family:'Fraunces',Georgia,serif;font-weight:600}
.cart-vendor .vline{font-size:12px;color:var(--text2);padding:3px 0;display:flex;justify-content:space-between;gap:8px}
.cart-vendor .vline .qn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-vendor .vline .px{color:var(--text3);font-size:11px;white-space:nowrap}
.cart-vendor .warn{font-size:11px;color:var(--maroon);font-weight:600;margin-top:5px}
.cart-foot{padding:12px 14px;border-top:1px solid var(--border);background:var(--bg2)}

/* vendor-pick popover (override) */
.vpop-bg{position:fixed;inset:0;z-index:300;display:none}
.vpop-bg.show{display:block}
.vpop{position:absolute;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 36px rgba(43,36,32,.25);min-width:240px;max-width:320px;overflow:hidden}
.vpop .h{padding:9px 12px;border-bottom:1px solid var(--border);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:600}
.vpop-opt{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.vpop-opt:hover{background:var(--bg2)}
.vpop-opt .vc{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--text2)}
.vpop-opt.cheapest .vc{color:var(--green-text)}

/* review modal */
.po-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;padding:14px 16px}
.po-card h4{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.po-card h4 .sm{font-size:11px;color:var(--text3);font-family:'Inter',sans-serif;font-weight:400}
.po-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin-bottom:9px}
.po-meta b{color:var(--text)}
.po-card table{margin-top:5px}
.po-card th,.po-card td{padding:6px 9px;font-size:12.5px}
.po-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px}
.po-foot .gt{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15px}
.po-warn{background:var(--maroon-tint);color:var(--maroon-deep);font-size:12px;padding:7px 10px;border-radius:8px;margin-top:6px}
.po-need input{padding:6px 9px;border:1px solid var(--border2);border-radius:7px;font-size:13px}

.modal-bg{position:fixed;inset:0;background:rgba(43,36,32,.4);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:0 20px 60px rgba(43,36,32,.3);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head .h{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600}
.modal-body{padding:18px 20px;max-height:68vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--bg2)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text)}
.fld textarea{min-height:52px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--maroon)}
.fld-row{display:flex;gap:10px}
.fld-row .fld{flex:1}
.hint{font-size:11px;color:var(--text3);margin-top:3px}
.sec-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--brass-deep);margin:4px 0 10px;padding-top:6px;border-top:1px solid var(--border)}
.sec-label.first{border-top:none;padding-top:0}

.login-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--bg);border-radius:18px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
.lg-title{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;color:var(--maroon)}
.lg-sub{font-size:13px;color:var(--text2);margin:5px 0 18px}
.lg-users{display:flex;flex-direction:column;gap:9px}
.lg-user{padding:12px;border:1px solid var(--border2);border-radius:10px;background:var(--bg2);font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.lg-user:hover{border-color:var(--maroon);background:var(--maroon-tint)}
.lg-input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:10px;margin-bottom:10px;font-size:14px}
.lg-input:focus{outline:none;border-color:var(--maroon)}
.lg-go{width:100%;padding:12px;border:none;border-radius:10px;background:var(--maroon);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.lg-back{margin-top:10px;background:none;border:none;color:var(--text3);font-size:12.5px;cursor:pointer}
.lg-err{color:#c0392b;font-size:12.5px;min-height:16px;margin-bottom:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){.fld-row{flex-direction:column;gap:0}.wrap{padding:14px}.topbar{padding:10px 14px}.brand small{display:none}}
</style>
</head>
<body>

<div class="login-bg" id="loginOverlay"><div class="login-card" id="loginStep"></div></div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="mark serif">P</span><div>Purchasing<small>Premier Caterers</small></div></div>
    <div class="spacer"></div>
    <span class="who" id="whoBar"></span>
    <a class="tb-link" href="./index.html"><i class="ti ti-arrow-left"></i> Operations Hub</a>
    <button class="tb-link" onclick="openOrdersSettings()" title="Orders relay setup"><i class="ti ti-settings"></i> Settings</button>
    <button class="tb-link" onclick="logout()"><i class="ti ti-logout"></i> Log out</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="dashboard" onclick="showView('dashboard')">Dashboard</button>
    <button class="tab" data-view="alerts" onclick="showView('alerts')"><i class="ti ti-bell"></i> Alerts <span class="tab-badge" id="alertsBadge"></span></button>
    <button class="tab" data-view="orders" onclick="showView('orders')"><i class="ti ti-shopping-cart-plus"></i> Place Orders</button>
    <button class="tab" data-view="compare" onclick="showView('compare')">Compare Vendors</button>
    <button class="tab" data-view="items" onclick="showView('items')">All Items</button>
    <button class="tab" data-view="products" onclick="showView('products')">Our Products</button>
    <button class="tab" data-view="vendors" onclick="showView('vendors')">Vendors</button>
    <button class="tab" data-view="replies" onclick="showView('replies')"><i class="ti ti-message-circle-2"></i> Vendor Replies <span class="tab-badge" id="repliesBadge"></span></button>
    <button class="tab" data-view="orderhist" onclick="showView('orderhist')">Order History</button>
  </div>

  <div class="wrap">
    <div class="view active" id="view-dashboard">
      <div class="row-head"><div class="title">Dashboard</div></div>
      <div id="dashBody"></div>
    </div>

    <div class="view" id="view-alerts">
      <div class="row-head"><div class="title">Alerts</div><div class="muted" style="font-size:12.5px">Things worth your eye, by priority</div></div>
      <div id="alertsBody"></div>
    </div>

    <div class="view" id="view-compare">
      <div class="row-head"><div class="title">Compare Vendors</div></div>
      <div class="cmp-pick"><select id="cmpProduct" onchange="renderCompare()"><option value="">Choose one of your products…</option></select></div>
      <div id="cmpResult"></div>
    </div>

    <div class="view" id="view-items">
      <div class="row-head">
        <div class="title">All Items</div>
        <div class="search"><i class="ti ti-search"></i><input id="iSearch" placeholder="Search your name, vendor, vendor item, code…" oninput="renderItems()"></div>
        <button class="btn ghost" id="bulkAddBtn" onclick="openBulkAdd()"><i class="ti ti-table"></i> Bulk add</button>
        <button class="btn" id="addItemBtn" onclick="openItem()"><i class="ti ti-plus"></i> Add item</button>
      </div>
      <div class="card"><div id="itemsTable"></div></div>
    </div>

    <div class="view" id="view-products">
      <div class="row-head">
        <div class="title">Our Products</div>
        <div class="search"><i class="ti ti-search"></i><input id="pSearch" placeholder="Search products…" oninput="renderProducts()"></div>
      </div>
      <div class="card"><div id="productsTable"></div></div>
    </div>

    <div class="view" id="view-vendors">
      <div class="row-head">
        <div class="title">Vendors</div>
        <div class="search"><i class="ti ti-search"></i><input id="vSearch" placeholder="Search vendors…" oninput="renderVendors()"></div>
        <button class="btn" id="addVendorBtn" onclick="openVendor()"><i class="ti ti-plus"></i> Add vendor</button>
      </div>
      <div class="card"><div id="vendorsTable"></div></div>
    </div>

    <div class="view" id="view-orders">
      <div class="row-head"><div class="title">Place Orders</div>
        <div class="search"><i class="ti ti-search"></i><input id="oSearch" placeholder="Search products…" oninput="renderOrderPicker()"></div>
        <button class="btn ghost" onclick="clearOrderCart()" title="Clear all quantities"><i class="ti ti-trash"></i> Clear cart</button>
      </div>
      <div class="orders-layout">
        <div class="orders-list" id="ordersList"></div>
        <aside class="orders-cart" id="ordersCart"></aside>
      </div>
    </div>

    <div class="view" id="view-orderhist">
      <div class="row-head"><div class="title">Order History</div></div>
      <div id="orderHistBody"></div>
    </div>

    <div class="view" id="view-replies">
      <div class="row-head">
        <div class="title">Vendor Replies</div>
        <span class="muted" id="repliesUpdated" style="font-size:12px"></span>
        <div style="flex:1"></div>
        <button class="btn ghost" onclick="checkReplies(true)" id="checkRepliesBtn"><i class="ti ti-refresh"></i> Check now</button>
      </div>
      <div id="repliesBody"></div>
    </div>
  </div>
</div>

<datalist id="ourNameList"></datalist>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ════════ FIREBASE (same project as the main app) ════════
const firebaseConfig = {
  apiKey: "AIzaSyCeBI51t7ydOt6uOuvJ1BjQhwiX9d8jaJc",
  authDomain: "premier-caterers-internal-app.firebaseapp.com",
  projectId: "premier-caterers-internal-app",
  storageBucket: "premier-caterers-internal-app.firebasestorage.app",
  messagingSenderId: "471701398759",
  appId: "1:471701398759:web:559a7bee3b645ce545ee42"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ════════ AUTH (shared with the main app) ════════
const roles = { admin:{canEdit:true}, kenny:{canEdit:true}, shelley:{canEdit:true}, josh:{canEdit:false}, kitchen:{canEdit:false} };
const OWNER_HASH   = 'd4ae28692a6a51cd93378a6ae5d3c004920edfaaa688e4dbeefb8cbe4730dcae';
const DEFAULT_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
let authUser=null, currentRole=null;
async function pcHash(s){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s))); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function loginRoleFor(u){ return u==='owner'?'admin':u; }
function prettyName(u){ return u==='owner'?'Kenny / Admin':(u?u.charAt(0).toUpperCase()+u.slice(1):''); }
function canEdit(){ return !!(roles[currentRole] && roles[currentRole].canEdit); }
function showLogin(){
  authUser=null; currentRole=null; document.getElementById('app').style.display='none';
  document.getElementById('loginOverlay').style.display='flex';
  document.getElementById('loginStep').innerHTML =
    `<div class="lg-title">Purchasing</div><div class="lg-sub">Who's signing in?</div>
     <div class="lg-users">
       <button class="lg-user" onclick="loginPick('owner')">Kenny / Admin</button>
       <button class="lg-user" onclick="loginPick('shelley')">Shelley</button>
       <button class="lg-user" onclick="loginPick('josh')">Josh</button>
       <button class="lg-user" onclick="loginPick('kitchen')">Kitchen</button>
     </div>`;
}
function loginPick(u){
  if(u==='kitchen'){ finishLogin('kitchen'); return; }
  document.getElementById('loginStep').innerHTML =
    `<div class="lg-title">${prettyName(u)}</div><div class="lg-sub">Enter your password</div>
     <input id="lgPw" type="password" class="lg-input" placeholder="Password" onkeydown="if(event.key==='Enter')loginSubmit('${u}')">
     <div id="lgErr" class="lg-err"></div>
     <button class="lg-go" onclick="loginSubmit('${u}')">Sign in</button>
     <button class="lg-back" onclick="showLogin()">&larr; back</button>`;
  setTimeout(()=>{const i=document.getElementById('lgPw'); if(i)i.focus();},60);
}
async function loginSubmit(u){
  const pw=(document.getElementById('lgPw')||{}).value||''; const err=document.getElementById('lgErr'); if(err)err.textContent='';
  const h=await pcHash(pw);
  if(u==='owner'){ if(h===OWNER_HASH){ finishLogin('owner'); } else if(err){ err.textContent='Incorrect password.'; } return; }
  let doc=null; try{ const s=await db.collection('appAuth').doc(u).get(); if(s.exists) doc=s.data(); }catch(e){}
  const storedHash=(doc&&doc.hash)?doc.hash:DEFAULT_HASH;
  if(h!==storedHash){ if(err)err.textContent='Incorrect password.'; return; }
  finishLogin(u);
}
function finishLogin(u){
  authUser=u; currentRole=loginRoleFor(u);
  try{ localStorage.setItem('pcSession', JSON.stringify({user:u, ts:Date.now()})); }catch(e){}
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoBar').textContent=prettyName(u);
  applyEditPerms(); startData();
}
function logout(){ try{ localStorage.removeItem('pcSession'); }catch(e){} showLogin(); }
function tryResumeSession(){ try{ const s=JSON.parse(localStorage.getItem('pcSession')||'null'); if(s&&s.user&&(s.user==='owner'||roles[loginRoleFor(s.user)])){ finishLogin(s.user); return true; } }catch(e){} return false; }
function applyEditPerms(){ const show=canEdit(); ['addItemBtn','addVendorBtn','bulkAddBtn'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display=show?'inline-flex':'none'; }); }

// ════════ DATA ════════
// items collection: each doc = one product as a specific vendor sells it.
//   ourName (what WE call it — the comparison key), useFor (what we use it for),
//   vendorId, vendorItemName, vendorCode, packSize, unit, packDesc, price, date, category, notes
// priceHistory collection: archived prior prices when you record a new quote.
//   {itemId, ourName, vendorId, packSize, unit, price, date, by, ts}
let vendors=[], items=[], priceHistory=[];
let _started=false;
function startData(){
  if(_started) return; _started=true;
  db.collection('vendors').onSnapshot(s=>{ vendors=s.docs.map(d=>({id:d.id,...d.data()})); renderAll(); });
  db.collection('vendorItems').onSnapshot(s=>{ items=s.docs.map(d=>({id:d.id,...d.data()})); renderAll(); });
  db.collection('priceHistory').onSnapshot(s=>{ priceHistory=s.docs.map(d=>({id:d.id,...d.data()})); renderAll(); });
  startOrdersCollection();
  startRepliesData();
  startRepliesPolling();
}
function renderAll(){ renderDashboard(); renderAlerts(); renderVendors(); renderItems(); renderProducts(); fillProductPicker(); fillOurNameList(); renderCompare(); renderOrderPicker(); renderOrderHistory(); renderReplies(); }

function vendorName(id){ const v=vendors.find(x=>x.id===id); return v?v.name:'(unknown vendor)'; }
function fmtMoney(n){ n=parseFloat(n); return isNaN(n)?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const p=String(d).split('-'); return p.length===3?(parseInt(p[1])+'/'+parseInt(p[2])+'/'+p[0].slice(-2)):d; }
function unitCost(price,packSize){ price=parseFloat(price); packSize=parseFloat(packSize); if(isNaN(price)||isNaN(packSize)||packSize<=0) return null; return price/packSize; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function packLabel(x){ if(x.packDesc) return esc(x.packDesc); if(x.packSize) return esc(x.packSize)+' '+esc(x.unit||''); return '—'; }

// Roll vendor items up into the distinct products WE buy (grouped by our name).
function ourProducts(){
  const map={};
  items.forEach(x=>{ const k=normName(x.ourName); if(!k) return;
    if(!map[k]) map[k]={ key:k, name:x.ourName, useFor:x.useFor||'', category:x.category||'', items:[], _ts:0 };
    const g=map[k]; g.items.push(x);
    const ts=x.updatedAt||x.createdAt||0;
    if(ts>=g._ts){ g._ts=ts; g.name=x.ourName||g.name; if(x.useFor) g.useFor=x.useFor; if(x.category) g.category=x.category; }
  });
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
}

function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.view===v));
  const el=document.getElementById('view-'+v); if(el) el.classList.add('active');
}

// ── Vendors ──
function renderVendors(){
  const ql=((document.getElementById('vSearch')||{}).value||'').toLowerCase();
  const rows=vendors.filter(v=>!ql||(v.name||'').toLowerCase().includes(ql)||(v.rep||'').toLowerCase().includes(ql)||(v.contact||'').toLowerCase().includes(ql)).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const el=document.getElementById('vendorsTable'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No vendors yet.'+(canEdit()?' Click “Add vendor”.':'')+'</div>'; return; }
  el.innerHTML='<table><thead><tr><th>Vendor</th><th>Contact</th><th>Phone</th><th>Email</th><th>Terms</th>'+(canEdit()?'<th></th>':'')+'</tr></thead><tbody>'+
    rows.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.contact||v.rep||'—')}</td><td>${esc(v.phone||'—')}</td><td>${v.email?`<a href="mailto:${esc(v.email)}">${esc(v.email)}</a>`:'—'}</td><td>${esc(v.terms||'—')}</td>${canEdit()?`<td style="text-align:right"><button class="icon-btn" onclick="openVendor('${v.id}')"><i class="ti ti-edit"></i></button></td>`:''}</tr>`).join('')+'</tbody></table>';
}

// ── All Items ──
function renderItems(){
  const ql=((document.getElementById('iSearch')||{}).value||'').toLowerCase();
  const rows=items.map(x=>({...x,_v:vendorName(x.vendorId)}))
    .filter(x=>!ql||[x.ourName,x._v,x.vendorItemName,x.vendorCode,x.category].some(f=>String(f||'').toLowerCase().includes(ql)))
    .sort((a,b)=>normName(a.ourName).localeCompare(normName(b.ourName))||a._v.localeCompare(b._v));
  const el=document.getElementById('itemsTable'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No items yet.'+(canEdit()?' Click “Add item” to enter a product the way a vendor sells it.':'')+'</div>'; return; }
  el.innerHTML='<table><thead><tr><th>Our product</th><th>Vendor</th><th>Vendor’s item</th><th>Pack</th><th>Price</th><th>Unit cost</th>'+(canEdit()?'<th></th>':'')+'</tr></thead><tbody>'+
    rows.map(x=>{ const uc=unitCost(x.price,x.packSize);
      return `<tr>
      <td><b>${esc(x.ourName||'—')}</b>${x.useFor?`<div class="sub">${esc(x.useFor)}</div>`:''}</td>
      <td>${esc(x._v)}</td>
      <td>${esc(x.vendorItemName||'—')}${x.vendorCode?`<div class="sub">#${esc(x.vendorCode)}</div>`:''}</td>
      <td>${packLabel(x)}</td>
      <td>${fmtMoney(x.price)}</td>
      <td class="unit-cost">${uc!=null?fmtMoney(uc)+'<span class="muted" style="font-weight:400">/'+esc(x.unit||'unit')+'</span>':'—'}</td>
      ${canEdit()?`<td style="text-align:right;white-space:nowrap"><button class="btn-newq" onclick="openNewQuote('${x.id}')" title="Save current price as history and record a new one"><i class="ti ti-arrow-up-right"></i>New quote</button> <button class="icon-btn" onclick="openHistory('${x.id}')" title="Price history"><i class="ti ti-history"></i></button> <button class="icon-btn" onclick="openItem('${x.id}')" title="Edit (correct typo, no history)"><i class="ti ti-edit"></i></button></td>`:''}
    </tr>`;}).join('')+'</tbody></table>';
}

// ── Our Products (rollup) ──
function renderProducts(){
  const ql=((document.getElementById('pSearch')||{}).value||'').toLowerCase();
  const rows=ourProducts().filter(g=>!ql||g.name.toLowerCase().includes(ql)||(g.useFor||'').toLowerCase().includes(ql)||(g.category||'').toLowerCase().includes(ql));
  const el=document.getElementById('productsTable'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No products yet — add items and they’ll group here by the name you give them.</div>'; return; }
  el.innerHTML='<table><thead><tr><th>Our product</th><th>What we use it for</th><th>Category</th><th>Vendors</th><th>Best unit cost</th></tr></thead><tbody>'+
    rows.map(g=>{ const costs=g.items.map(x=>unitCost(x.price,x.packSize)).filter(c=>c!=null); const best=costs.length?Math.min.apply(null,costs):null; const vend=new Set(g.items.map(x=>x.vendorId)).size;
      return `<tr style="cursor:pointer" onclick="compareProduct('${esc(g.key)}')">
        <td><b>${esc(g.name)}</b></td>
        <td class="muted">${esc(g.useFor||'—')}</td>
        <td>${g.category?`<span class="chip cat">${esc(g.category)}</span>`:'—'}</td>
        <td>${vend}</td>
        <td class="unit-cost">${best!=null?fmtMoney(best):'—'}</td>
      </tr>`;}).join('')+'</tbody></table>';
}

// ── Compare ──
function fillProductPicker(){
  const sel=document.getElementById('cmpProduct'); if(!sel) return; const cur=sel.value;
  sel.innerHTML='<option value="">Choose one of your products…</option>'+ourProducts().map(g=>`<option value="${esc(g.key)}">${esc(g.name)}${g.category?' — '+esc(g.category):''}</option>`).join('');
  if(cur) sel.value=cur;
}
function fillOurNameList(){ const dl=document.getElementById('ourNameList'); if(dl) dl.innerHTML=ourProducts().map(g=>`<option value="${esc(g.name)}">`).join(''); }
function compareProduct(key){ showView('compare'); const sel=document.getElementById('cmpProduct'); if(sel) sel.value=key; renderCompare(); }
function renderCompare(){
  const sel=document.getElementById('cmpProduct'); const out=document.getElementById('cmpResult'); if(!out) return;
  const key=sel?sel.value:''; if(!key){ out.innerHTML='<div class="empty">Pick one of your products to see how every vendor packs and prices it — cheapest unit cost first.</div>'; return; }
  const g=ourProducts().find(x=>x.key===key); if(!g){ out.innerHTML='<div class="empty">No data for that product.</div>'; return; }
  let list=g.items.map(x=>({...x,_uc:unitCost(x.price,x.packSize)})).sort((a,b)=>{ if(a._uc==null)return 1; if(b._uc==null)return -1; return a._uc-b._uc; });
  const costs=list.map(x=>x._uc).filter(c=>c!=null); const lowest=costs.length?Math.min.apply(null,costs):null;
  out.innerHTML =
    `<div class="cmp-meta"><span>Product: <b>${esc(g.name)}</b></span>${g.useFor?`<span>Used for: <b>${esc(g.useFor)}</b></span>`:''}<span>Vendor options: <b>${list.length}</b></span></div>`+

    '<div class="hint" style="margin-top:10px">Unit cost = price ÷ pack size. Make sure items you’re comparing use the same unit (e.g. all per lb).</div>';
}

// ════════ ALERTS ════════
function computeAlerts(){
  const groups=ourProducts();
  // 1. Stale (>=30 days)
  const stale=[];
  items.forEach(x=>{ const d=daysSince(lastQuoteDateOf(x)); if(d!=null && d>=30) stale.push({x,d}); });
  stale.sort((a,b)=>b.d-a.d);

  // 2. Single-source products (only 1 vendor carrying it) — backup-quote risk
  const single=[];
  groups.forEach(g=>{ const vendorSet=new Set(g.items.map(i=>i.vendorId)); if(vendorSet.size===1) single.push({g, vendorId:[...vendorSet][0]}); });

  // 3. Dormant vendors (no quote in 60+ days, or never)
  const dormant=[];
  vendors.forEach(v=>{
    const vItems=items.filter(i=>i.vendorId===v.id);
    if(!vItems.length){ dormant.push({v, lastDays:null, reason:'no items yet'}); return; }
    let newest=null;
    vItems.forEach(i=>{ const d=lastQuoteDateOf(i); if(d && (!newest || d>newest)) newest=d; });
    const age=newest?daysSince(newest):null;
    if(age==null||age>=60) dormant.push({v, lastDays:age, reason:newest?('last quote '+age+' days ago'):'no dated quotes'});
  });
  dormant.sort((a,b)=>(b.lastDays||9999)-(a.lastDays||9999));

  // 4. Unit mismatches — same product, vendors using different units
  const unitMismatch=[];
  groups.forEach(g=>{
    const unitSet=new Set();
    g.items.forEach(i=>{ if(i.unit) unitSet.add(String(i.unit).toLowerCase().trim()); });
    if(unitSet.size>1) unitMismatch.push({g, units:[...unitSet]});
  });

  // 5. Missing data — items without price or pack size (can't compute unit cost)
  const missing=items.filter(x=>{
    const p=parseFloat(x.price), s=parseFloat(x.packSize);
    return !(isFinite(p)&&p>0) || !(isFinite(s)&&s>0);
  });

  // 6. Likely duplicate product names — conservative: after lowercasing + stripping spaces/punct
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const seen={};
  groups.forEach(g=>{ const k=norm(g.name); if(!k) return; (seen[k]=seen[k]||[]).push(g); });
  const dupes=Object.values(seen).filter(arr=>arr.length>1);

  return { stale, single, dormant, unitMismatch, missing, dupes };
}

      <button class="fix" onclick="compareProduct('${esc(g.key)}')">Compare \u2192</button>

  if(a.dormant.length){

    html += a.dormant.map(({v,lastDays,reason})=>`<div class="alert-row">
      <div class="what"><b>${esc(v.name)}</b>${v.contact||v.rep?`<div class="sub">${esc(v.contact||v.rep)}${v.phone?(' \u00b7 '+esc(v.phone)):''}</div>`:''}</div>
      <div class="age ${lastDays>=120?'hi':(lastDays>=60?'md':'')}">${lastDays!=null?lastDays+' days':esc(reason)}</div>

// ════════ DASHBOARD ════════
function daysSince(dateStr){
  if(!dateStr) return null;
  const p=String(dateStr).split('-'); if(p.length!==3) return null;
  const d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  const ms=Date.now()-d.getTime(); if(isNaN(ms)||ms<0) return 0;
  return Math.floor(ms/86400000);
}
function lastQuoteDateOf(x){
  // best available "as-of" date: explicit date field, else when the record was touched
  if(x.date) return x.date;
  const ts=x.updatedAt||x.createdAt;
  if(!ts) return '';
  const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function userLabel(){ return prettyName(authUser); }

function renderDashboard(){
  const el=document.getElementById('dashBody'); if(!el) return;
  if(!items.length && !vendors.length){
    el.innerHTML='<div class="dash-empty">Welcome. Add a few vendors and items, then this dashboard will show price changes, stale quotes, your best buys, and recent activity.</div>';
    return;
  }
  const groups=ourProducts();
  const vendorCount=vendors.length;
  const productCount=groups.length;
  const itemCount=items.length;
  // staleness — based on each vendor item's "as-of" date
  const stale30=[], stale60=[];
  items.forEach(x=>{ const d=daysSince(lastQuoteDateOf(x)); if(d!=null){ if(d>=60) stale60.push({x,d}); else if(d>=30) stale30.push({x,d}); } });

  // price changes — derive from priceHistory (last 30 days)
  const cutoff=Date.now()-30*86400000;
  const recent=priceHistory.filter(h=>(h.ts||0)>=cutoff && h.itemId);
  // for each archived row, pair with the current item to compute change
  const changes=[];
  recent.forEach(h=>{
    const cur=items.find(x=>x.id===h.itemId); if(!cur) return;
    const oldUc=unitCost(h.price,h.packSize), newUc=unitCost(cur.price,cur.packSize);
    if(oldUc==null||newUc==null||oldUc===0) return;
    const pct=(newUc-oldUc)/oldUc*100;
    changes.push({ ourName:cur.ourName, vendor:vendorName(cur.vendorId), oldUc, newUc, unit:cur.unit||'unit', pct, ts:h.ts });
  });
  changes.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  const topChanges=changes.slice(0,6);

  // best buys — lowest unit cost per product (where determinable)
  const bestBuys=groups.map(g=>{
    const costs=g.items.map(x=>({x,uc:unitCost(x.price,x.packSize)})).filter(z=>z.uc!=null);
    if(!costs.length) return null;
    costs.sort((a,b)=>a.uc-b.uc);
    return { name:g.name, vendor:vendorName(costs[0].x.vendorId), uc:costs[0].uc, unit:g.items[0].unit||'unit', vendorCount:new Set(g.items.map(z=>z.vendorId)).size };
  }).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8);

  // recent activity — last 10 items by updatedAt/createdAt
  const recentItems=items.slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).slice(0,10);

  el.innerHTML =
    // tiles
    '<div class="dash-grid">'+
      tile('Vendors', vendorCount)+
      tile('Products you buy', productCount)+
      tile('Vendor items', itemCount)+
      tile('Stale 30+ days', stale30.length, stale30.length?'warn':'')+
      tile('Stale 60+ days', stale60.length, stale60.length?'alert':'')+
    '</div>'+

    // price changes
    '<div class="dash-sec"><div class="dash-sec-title">Price changes <span class="note">last 30 days</span></div>'+
      (topChanges.length
        ? '<div class="card"><table><thead><tr><th>Product</th><th>Vendor</th><th>Was</th><th>Now</th><th>Change</th></tr></thead><tbody>'+
            topChanges.map(c=>`<tr>
              <td><b>${esc(c.ourName)}</b></td>
              <td>${esc(c.vendor)}</td>
              <td class="muted">${fmtMoney(c.oldUc)}/${esc(c.unit)}</td>
              <td class="unit-cost">${fmtMoney(c.newUc)}/${esc(c.unit)}</td>
              <td class="${c.pct>=0?'change-up':'change-down'}">${(c.pct>=0?'+':'')+c.pct.toFixed(1)+'%'}</td>
            </tr>`).join('')+'</tbody></table></div>'
        : '<div class="dash-empty">No price changes recorded yet. Use “New quote” on an item to log a price update.</div>')+
    '</div>'+

    // stale prices
    '<div class="dash-sec"><div class="dash-sec-title">Needs a fresh quote</div>'+
      (stale30.length+stale60.length
        ? '<div class="card"><table><thead><tr><th>Product</th><th>Vendor</th><th>Last quoted</th><th>Age</th></tr></thead><tbody>'+
            stale60.concat(stale30).map(({x,d})=>`<tr>
              <td><b>${esc(x.ourName)}</b></td>
              <td>${esc(vendorName(x.vendorId))}</td>
              <td class="muted">${fmtDate(lastQuoteDateOf(x))}</td>
              <td class="${d>=60?'stale-60':'stale-30'}">${d} days</td>
            </tr>`).join('')+'</tbody></table></div>'
        : '<div class="dash-empty">All quotes are under 30 days old — looking good.</div>')+
    '</div>'+

    // best buys
    '<div class="dash-sec"><div class="dash-sec-title">Best buys <span class="note">lowest unit cost per product</span></div>'+
      (bestBuys.length
        ? '<div class="card"><table><thead><tr><th>Product</th><th>Cheapest vendor</th><th>Unit cost</th><th>Vendors</th></tr></thead><tbody>'+
            bestBuys.map(b=>`<tr style="cursor:pointer" onclick="compareProduct('${esc(normName(b.name))}')">
              <td><b>${esc(b.name)}</b></td>
              <td>${esc(b.vendor)}</td>
              <td class="unit-cost">${fmtMoney(b.uc)}/${esc(b.unit)}</td>
              <td>${b.vendorCount}</td>
            </tr>`).join('')+'</tbody></table></div>'
        : '<div class="dash-empty">Add items with pack size + price so unit costs can be compared.</div>')+
    '</div>'+

    // recent activity
    '<div class="dash-sec"><div class="dash-sec-title">Recent activity</div>'+
      (recentItems.length
        ? '<div class="card"><table><thead><tr><th>When</th><th>Product</th><th>Vendor</th><th>Price</th></tr></thead><tbody>'+
            recentItems.map(x=>{ const ts=x.updatedAt||x.createdAt||0; const when=ts?new Date(ts).toLocaleString():''; return `<tr>
              <td class="muted">${esc(when)}</td>
              <td><b>${esc(x.ourName)}</b></td>
              <td>${esc(vendorName(x.vendorId))}</td>
              <td>${fmtMoney(x.price)}</td>
            </tr>`;}).join('')+'</tbody></table></div>'
        : '<div class="dash-empty">No items yet.</div>')+
    '</div>';
}
function tile(label,val,cls){
  return `<div class="dash-tile ${cls||''}"><div class="k">${esc(label)}</div><div class="v">${val}</div></div>`;
}

function openNewQuote(itemId){
  if(!canEdit()) return;
  const x=items.find(q=>q.id===itemId); if(!x) return;
  openModal(`<div class="modal-head"><div class="h">New price quote</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="hist-current">
      <div class="sub" style="font-weight:600;color:var(--brass-deep)">Current price on file</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:3px">
        <div><b>${esc(x.ourName)}</b> <span class="muted">— ${esc(vendorName(x.vendorId))}</span><div class="sub">${esc(x.vendorItemName||'')}${x.vendorCode?' · #'+esc(x.vendorCode):''}</div></div>
        <div class="price">${fmtMoney(x.price)} <span class="muted" style="font-size:11px">/${esc(x.packSize||'?')} ${esc(x.unit||'')}</span></div>
      </div>
    </div>
    <div class="hint" style="margin-bottom:10px">The current price will be saved as history. The new one becomes the active price.</div>
    <div class="fld-row">
      <div class="fld"><label>New pack size *</label><input id="nq_pack" type="number" step="any" value="${esc(x.packSize||'')}"><div class="hint">Usually unchanged.</div></div>
      <div class="fld"><label>New pack price *</label><input id="nq_price" type="number" step="any" placeholder="e.g. 95.00"></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>Date</label><input id="nq_date" type="date" value="${(new Date()).toISOString().slice(0,10)}"></div>
      <div class="fld"><label>Notes (optional)</label><input id="nq_notes" placeholder="e.g. seasonal, holiday surcharge"></div>
    </div>
    <div class="hint" id="nq_uc"></div>
    <div class="hint" id="nq_change" style="margin-top:4px"></div>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveNewQuote('${itemId}')">Save new quote</button></div>`);
  const upd=()=>{
    const np=parseFloat(val('nq_price')), nk=parseFloat(val('nq_pack'));
    const newUc=unitCost(np,nk), oldUc=unitCost(x.price,x.packSize);
    document.getElementById('nq_uc').innerHTML = newUc!=null?('New unit cost: <b>'+fmtMoney(newUc)+'/'+esc(x.unit||'unit')+'</b>'):'';
    let c=''; if(newUc!=null&&oldUc!=null&&oldUc>0){ const pct=(newUc-oldUc)/oldUc*100; c='Change vs. last: <b class="'+(pct>=0?'change-up':'change-down')+'">'+(pct>=0?'+':'')+pct.toFixed(1)+'%</b>'; }
    document.getElementById('nq_change').innerHTML=c;
  };
  ['nq_pack','nq_price'].forEach(i=>{ const e=document.getElementById(i); if(e) e.addEventListener('input',upd); });
  setTimeout(()=>document.getElementById('nq_price').focus(),60);
}
async function saveNewQuote(itemId){
  const x=items.find(q=>q.id===itemId); if(!x){ alert('Item not found.'); return; }
  const pack=parseFloat(val('nq_pack')), price=parseFloat(val('nq_price'));
  if(!isFinite(price)||price<=0){ alert('Enter the new pack price.'); return; }
  if(!isFinite(pack)||pack<=0){ alert('Enter the pack size.'); return; }
  // 1) archive current price to history
  const histDoc={
    itemId, ourName:x.ourName||'', vendorId:x.vendorId||'',
    price: x.price||0, packSize: x.packSize||0, unit: x.unit||'',
    packDesc: x.packDesc||'', vendorItemName: x.vendorItemName||'', vendorCode: x.vendorCode||'',
    date: x.date||'', notes: x.notes||'',
    archivedAt: Date.now(), archivedBy: userLabel(), ts: x.updatedAt||x.createdAt||Date.now()
  };
  try{
    await db.collection('priceHistory').add(histDoc);
    // 2) update current item with new price
    await db.collection('vendorItems').doc(itemId).set({
      price, packSize: pack,
      date: val('nq_date')||x.date||'',
      notes: val('nq_notes')||x.notes||'',
      updatedAt: Date.now(), updatedBy: userLabel()
    },{merge:true});
    closeModal(); toast('New price recorded ✓');
  }catch(e){ alert('Could not save: '+e.message); }
}
