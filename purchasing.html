<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier Caterers — Purchasing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg2:#FCFAF6;--bg3:#F7F3EC;
  --text:#2B2420;--text2:#6B6058;--text3:#9A8E84;
  --border:#EAE2D6;--border2:#DDD3C4;
  --maroon:#8B1A1A;--maroon-deep:#6E1414;--maroon-tint:#F3E4E2;
  --brass:#B0894B;--brass-deep:#8C6B36;--brass-tint:#F6EEDF;
  --green:#2E7D5B;--green-bg:#E4F1EA;--green-text:#216B47;
  --radius:9px;--radius-lg:14px;
  --shadow:0 1px 2px rgba(43,36,32,.04),0 4px 14px rgba(43,36,32,.06);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5}
.serif{font-family:'Fraunces',Georgia,serif}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--maroon);text-decoration:none}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(247,243,236,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;color:var(--maroon);display:flex;align-items:center;gap:9px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brass),var(--brass-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.topbar .spacer{flex:1}
.topbar .who{font-size:12.5px;color:var(--text2)}
.topbar .tb-link{font-size:12.5px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.topbar .tb-link:hover{border-color:var(--border2)}

/* ── tabs ── */
.tabs{display:flex;gap:4px;padding:10px 20px 0;background:transparent;flex-wrap:wrap}
.tab{padding:9px 16px;border:none;background:transparent;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:9px 9px 0 0;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--maroon);border-bottom-color:var(--maroon);background:var(--bg)}

.wrap{padding:20px;max-width:1200px;margin:0 auto}
.view{display:none}
.view.active{display:block}

.row-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.row-head .title{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;flex:1}
.search{flex:1;min-width:200px;max-width:340px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}
.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}

.btn{padding:9px 15px;border:none;border-radius:9px;background:var(--maroon);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--maroon-deep)}
.btn.ghost{background:var(--bg2);color:var(--text2);border:1px solid var(--border2)}
.btn.ghost:hover{background:var(--bg3);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12px}

/* ── cards / tables ── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
.muted{color:var(--text3)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--brass-tint);color:var(--brass-deep)}
.chip.cat{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.lowest{background:var(--green-bg) !important}
.lowest td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.tag-low{font-size:10px;font-weight:700;color:var(--green-text);text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.unit-cost{font-family:'Fraunces',Georgia,serif;font-weight:600}
.empty{text-align:center;color:var(--text3);padding:48px 20px;font-size:14px}
.icon-btn{border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:16px;padding:5px;border-radius:6px}
.icon-btn:hover{background:var(--bg3);color:var(--maroon)}

/* compare picker */
.cmp-pick{margin-bottom:18px}
.cmp-pick select{width:100%;max-width:420px;padding:11px 13px;border:1px solid var(--border2);border-radius:10px;background:var(--bg)}
.cmp-meta{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;color:var(--text2);font-size:13px}
.cmp-meta b{color:var(--text);font-family:'Fraunces',Georgia,serif}

/* ── modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(43,36,32,.4);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:520px;box-shadow:0 20px 60px rgba(43,36,32,.3);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head .h{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600}
.modal-body{padding:18px 20px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--bg2)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text)}
.fld textarea{min-height:60px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--maroon)}
.fld-row{display:flex;gap:10px}
.fld-row .fld{flex:1}
.hint{font-size:11px;color:var(--text3);margin-top:3px}

/* ── login ── */
.login-bg{position:fixed;inset:0;background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--bg);border-radius:18px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}
.lg-title{font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;color:var(--maroon)}
.lg-sub{font-size:13px;color:var(--text2);margin:5px 0 18px}
.lg-users{display:flex;flex-direction:column;gap:9px}
.lg-user{padding:12px;border:1px solid var(--border2);border-radius:10px;background:var(--bg2);font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.lg-user:hover{border-color:var(--maroon);background:var(--maroon-tint)}
.lg-input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:10px;margin-bottom:10px;font-size:14px}
.lg-input:focus{outline:none;border-color:var(--maroon)}
.lg-go{width:100%;padding:12px;border:none;border-radius:10px;background:var(--maroon);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.lg-back{margin-top:10px;background:none;border:none;color:var(--text3);font-size:12.5px;cursor:pointer}
.lg-err{color:#c0392b;font-size:12.5px;min-height:16px;margin-bottom:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){.fld-row{flex-direction:column;gap:0}.wrap{padding:14px}.topbar{padding:10px 14px}.brand small{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-bg" id="loginOverlay">
  <div class="login-card" id="loginStep"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand"><span class="mark serif">P</span><div>Purchasing<small>Premier Caterers</small></div></div>
    <div class="spacer"></div>
    <span class="who" id="whoBar"></span>
    <a class="tb-link" href="./index.html"><i class="ti ti-arrow-left"></i> Operations Hub</a>
    <button class="tb-link" onclick="logout()" style="cursor:pointer"><i class="ti ti-logout"></i> Log out</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="compare" onclick="showView('compare')">Compare Prices</button>
    <button class="tab" data-view="pricing" onclick="showView('pricing')">All Quotes</button>
    <button class="tab" data-view="products" onclick="showView('products')">Products</button>
    <button class="tab" data-view="vendors" onclick="showView('vendors')">Vendors</button>
  </div>

  <div class="wrap">
    <!-- COMPARE -->
    <div class="view active" id="view-compare">
      <div class="row-head"><div class="title">Compare Prices</div></div>
      <div class="cmp-pick">
        <select id="cmpProduct" onchange="renderCompare()"><option value="">Choose a product to compare…</option></select>
      </div>
      <div id="cmpResult"></div>
    </div>

    <!-- PRICING / ALL QUOTES -->
    <div class="view" id="view-pricing">
      <div class="row-head">
        <div class="title">All Quotes</div>
        <div class="search"><i class="ti ti-search"></i><input id="qSearch" placeholder="Search vendor, product, category…" oninput="renderPricing()"></div>
        <button class="btn" id="addQuoteBtn" onclick="openQuote()"><i class="ti ti-plus"></i> Add quote</button>
      </div>
      <div class="card"><div id="pricingTable"></div></div>
    </div>

    <!-- PRODUCTS -->
    <div class="view" id="view-products">
      <div class="row-head">
        <div class="title">Products</div>
        <div class="search"><i class="ti ti-search"></i><input id="pSearch" placeholder="Search products…" oninput="renderProducts()"></div>
        <button class="btn" id="addProductBtn" onclick="openProduct()"><i class="ti ti-plus"></i> Add product</button>
      </div>
      <div class="card"><div id="productsTable"></div></div>
    </div>

    <!-- VENDORS -->
    <div class="view" id="view-vendors">
      <div class="row-head">
        <div class="title">Vendors</div>
        <div class="search"><i class="ti ti-search"></i><input id="vSearch" placeholder="Search vendors…" oninput="renderVendors()"></div>
        <button class="btn" id="addVendorBtn" onclick="openVendor()"><i class="ti ti-plus"></i> Add vendor</button>
      </div>
      <div class="card"><div id="vendorsTable"></div></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ════════════════ FIREBASE (same project as the main app) ════════════════
const firebaseConfig = {
  apiKey: "AIzaSyCeBI51t7ydOt6uOuvJ1BjQhwiX9d8jaJc",
  authDomain: "premier-caterers-internal-app.firebaseapp.com",
  projectId: "premier-caterers-internal-app",
  storageBucket: "premier-caterers-internal-app.firebasestorage.app",
  messagingSenderId: "471701398759",
  appId: "1:471701398759:web:559a7bee3b645ce545ee42"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ════════════════ AUTH (shared with the main app) ════════════════
const roles = {
  admin:   {canEdit:true},  kenny:   {canEdit:true},  shelley: {canEdit:true},
  josh:    {canEdit:false}, kitchen: {canEdit:false}
};
const OWNER_HASH   = 'd4ae28692a6a51cd93378a6ae5d3c004920edfaaa688e4dbeefb8cbe4730dcae';
const DEFAULT_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
let authUser=null, currentRole=null;

async function pcHash(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function loginRoleFor(u){ return u==='owner' ? 'admin' : u; }
function prettyName(u){ return u==='owner'?'Kenny / Admin':(u?u.charAt(0).toUpperCase()+u.slice(1):''); }
function canEdit(){ return !!(roles[currentRole] && roles[currentRole].canEdit); }

function showLogin(){
  authUser=null; currentRole=null;
  document.getElementById('app').style.display='none';
  const ov=document.getElementById('loginOverlay'); ov.style.display='flex';
  document.getElementById('loginStep').innerHTML =
    `<div class="lg-title">Purchasing</div><div class="lg-sub">Who's signing in?</div>
     <div class="lg-users">
       <button class="lg-user" onclick="loginPick('owner')">Kenny / Admin</button>
       <button class="lg-user" onclick="loginPick('shelley')">Shelley</button>
       <button class="lg-user" onclick="loginPick('josh')">Josh</button>
       <button class="lg-user" onclick="loginPick('kitchen')">Kitchen</button>
     </div>`;
}
function loginPick(u){
  if(u==='kitchen'){ finishLogin('kitchen'); return; }
  document.getElementById('loginStep').innerHTML =
    `<div class="lg-title">${prettyName(u)}</div><div class="lg-sub">Enter your password</div>
     <input id="lgPw" type="password" class="lg-input" placeholder="Password" onkeydown="if(event.key==='Enter')loginSubmit('${u}')">
     <div id="lgErr" class="lg-err"></div>
     <button class="lg-go" onclick="loginSubmit('${u}')">Sign in</button>
     <button class="lg-back" onclick="showLogin()">&larr; back</button>`;
  setTimeout(()=>{const i=document.getElementById('lgPw'); if(i)i.focus();},60);
}
async function loginSubmit(u){
  const pw=(document.getElementById('lgPw')||{}).value||'';
  const err=document.getElementById('lgErr'); if(err) err.textContent='';
  const h=await pcHash(pw);
  if(u==='owner'){ if(h===OWNER_HASH){ finishLogin('owner'); } else if(err){ err.textContent='Incorrect password.'; } return; }
  let doc=null;
  try{ const s=await db.collection('appAuth').doc(u).get(); if(s.exists) doc=s.data(); }catch(e){}
  const storedHash = (doc&&doc.hash) ? doc.hash : DEFAULT_HASH;
  if(h!==storedHash){ if(err) err.textContent='Incorrect password.'; return; }
  finishLogin(u);
}
function finishLogin(u){
  authUser=u; currentRole=loginRoleFor(u);
  try{ localStorage.setItem('pcSession', JSON.stringify({user:u, ts:Date.now()})); }catch(e){}
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoBar').textContent = prettyName(u);
  applyEditPerms();
  startData();
}
function logout(){ try{ localStorage.removeItem('pcSession'); }catch(e){} showLogin(); }
function tryResumeSession(){
  try{
    const s=JSON.parse(localStorage.getItem('pcSession')||'null');
    if(s && s.user && (s.user==='owner' || roles[loginRoleFor(s.user)])){ finishLogin(s.user); return true; }
  }catch(e){}
  return false;
}
function applyEditPerms(){
  const show = canEdit();
  ['addQuoteBtn','addProductBtn','addVendorBtn'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display = show?'inline-flex':'none'; });
}

// ════════════════ DATA ════════════════
let vendors=[], products=[], prices=[];
let _started=false;
function startData(){
  if(_started) return; _started=true;
  db.collection('vendors').onSnapshot(s=>{ vendors=s.docs.map(d=>({id:d.id,...d.data()})); onData(); });
  db.collection('products').onSnapshot(s=>{ products=s.docs.map(d=>({id:d.id,...d.data()})); onData(); });
  db.collection('vendorPrices').onSnapshot(s=>{ prices=s.docs.map(d=>({id:d.id,...d.data()})); onData(); });
}
function onData(){ renderAll(); }
function renderAll(){ renderVendors(); renderProducts(); renderPricing(); fillProductPicker(); renderCompare(); }

function vendorName(id){ const v=vendors.find(x=>x.id===id); return v?v.name:'(unknown vendor)'; }
function product(id){ return products.find(x=>x.id===id); }
function productName(id){ const p=product(id); return p?p.name:'(unknown product)'; }
function fmtMoney(n){ n=parseFloat(n); return isNaN(n)?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const p=String(d).split('-'); return p.length===3?(parseInt(p[1])+'/'+parseInt(p[2])+'/'+p[0].slice(-2)):d; }
function unitCost(price, packSize){ price=parseFloat(price); packSize=parseFloat(packSize); if(isNaN(price)||isNaN(packSize)||packSize<=0) return null; return price/packSize; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ════════════════ VIEWS ════════════════
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.view===v));
  const el=document.getElementById('view-'+v); if(el) el.classList.add('active');
}

// ── Vendors ──
function renderVendors(){
  const q=(document.getElementById('vSearch')||{}).value||''; const ql=q.toLowerCase();
  const rows=vendors.filter(v=>!ql || (v.name||'').toLowerCase().includes(ql) || (v.rep||'').toLowerCase().includes(ql) || (v.contact||'').toLowerCase().includes(ql))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const el=document.getElementById('vendorsTable'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No vendors yet.'+(canEdit()?' Click “Add vendor” to start.':'')+'</div>'; return; }
  el.innerHTML='<table><thead><tr><th>Vendor</th><th>Contact</th><th>Phone</th><th>Email</th><th>Terms</th><th>Status</th>'+(canEdit()?'<th></th>':'')+'</tr></thead><tbody>'+
    rows.map(v=>`<tr>
      <td><b>${esc(v.name)}</b></td>
      <td>${esc(v.contact||v.rep||'—')}</td>
      <td>${esc(v.phone||'—')}</td>
      <td>${v.email?`<a href="mailto:${esc(v.email)}">${esc(v.email)}</a>`:'—'}</td>
      <td>${esc(v.terms||'—')}</td>
      <td>${v.active===false?'<span class="muted">Inactive</span>':'<span class="chip" style="background:var(--green-bg);color:var(--green-text)">Active</span>'}</td>
      ${canEdit()?`<td style="text-align:right;white-space:nowrap"><button class="icon-btn" onclick="openVendor('${v.id}')"><i class="ti ti-edit"></i></button></td>`:''}
    </tr>`).join('')+'</tbody></table>';
}

// ── Products ──
function renderProducts(){
  const q=(document.getElementById('pSearch')||{}).value||''; const ql=q.toLowerCase();
  const rows=products.filter(p=>!ql || (p.name||'').toLowerCase().includes(ql) || (p.category||'').toLowerCase().includes(ql) || (p.code||'').toLowerCase().includes(ql))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const el=document.getElementById('productsTable'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No products yet.'+(canEdit()?' Click “Add product” to start.':'')+'</div>'; return; }
  el.innerHTML='<table><thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Code</th><th>Quotes</th>'+(canEdit()?'<th></th>':'')+'</tr></thead><tbody>'+
    rows.map(p=>{ const n=prices.filter(x=>x.productId===p.id).length;
      return `<tr>
      <td><b>${esc(p.name)}</b>${p.description?`<div class="muted" style="font-size:11.5px">${esc(p.description)}</div>`:''}</td>
      <td>${p.category?`<span class="chip cat">${esc(p.category)}</span>`:'—'}</td>
      <td>${esc(p.unit||'—')}</td>
      <td class="muted">${esc(p.code||'—')}</td>
      <td>${n?`<a href="#" onclick="compareProduct('${p.id}');return false">${n} quote${n>1?'s':''}</a>`:'<span class="muted">none</span>'}</td>
      ${canEdit()?`<td style="text-align:right;white-space:nowrap"><button class="icon-btn" onclick="openProduct('${p.id}')"><i class="ti ti-edit"></i></button></td>`:''}
    </tr>`;}).join('')+'</tbody></table>';
}

// ── Pricing / all quotes ──
function renderPricing(){
  const q=(document.getElementById('qSearch')||{}).value||''; const ql=q.toLowerCase();
  const rows=prices.map(x=>{ const p=product(x.productId); return {...x, _v:vendorName(x.vendorId), _p:productName(x.productId), _cat:(p&&p.category)||'', _u:(p&&p.unit)||x.unit||''}; })
    .filter(x=>!ql || x._v.toLowerCase().includes(ql) || x._p.toLowerCase().includes(ql) || x._cat.toLowerCase().includes(ql))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const el=document.getElementById('pricingTable'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div class="empty">No quotes yet.'+(canEdit()?' Add vendors and products, then record a quote.':'')+'</div>'; return; }
  el.innerHTML='<table><thead><tr><th>Date</th><th>Product</th><th>Vendor</th><th>Pack</th><th>Price</th><th>Unit cost</th><th>Type</th>'+(canEdit()?'<th></th>':'')+'</tr></thead><tbody>'+
    rows.map(x=>{ const uc=unitCost(x.price,x.packSize);
      return `<tr>
      <td class="muted">${fmtDate(x.date)}</td>
      <td><b>${esc(x._p)}</b></td>
      <td>${esc(x._v)}</td>
      <td>${x.packSize?esc(x.packSize)+' '+esc(x._u):'—'}</td>
      <td>${fmtMoney(x.price)}</td>
      <td class="unit-cost">${uc!=null?fmtMoney(uc)+'<span class="muted" style="font-weight:400">/'+esc(x._u||'unit')+'</span>':'—'}</td>
      <td><span class="muted">${esc(x.quoteType||'—')}</span></td>
      ${canEdit()?`<td style="text-align:right;white-space:nowrap"><button class="icon-btn" onclick="openQuote('${x.id}')"><i class="ti ti-edit"></i></button></td>`:''}
    </tr>`;}).join('')+'</tbody></table>';
}

// ── Compare ──
function fillProductPicker(){
  const sel=document.getElementById('cmpProduct'); if(!sel) return;
  const cur=sel.value;
  const withQuotes=products.filter(p=>prices.some(x=>x.productId===p.id)).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  sel.innerHTML='<option value="">Choose a product to compare…</option>'+withQuotes.map(p=>`<option value="${p.id}">${esc(p.name)}${p.category?' — '+esc(p.category):''}</option>`).join('');
  if(cur) sel.value=cur;
}
function compareProduct(pid){ showView('compare'); const sel=document.getElementById('cmpProduct'); if(sel){ sel.value=pid; } renderCompare(); }
function renderCompare(){
  const sel=document.getElementById('cmpProduct'); const out=document.getElementById('cmpResult'); if(!out) return;
  const pid=sel?sel.value:''; if(!pid){ out.innerHTML='<div class="empty">Pick a product above to see every vendor’s latest price, cheapest first.</div>'; return; }
  const p=product(pid);
  // latest quote per vendor
  const byVendor={};
  prices.filter(x=>x.productId===pid).forEach(x=>{ const k=x.vendorId; if(!byVendor[k] || String(x.date||'')>String(byVendor[k].date||'')) byVendor[k]=x; });
  let list=Object.values(byVendor).map(x=>({...x,_uc:unitCost(x.price,x.packSize)}));
  list.sort((a,b)=>{ if(a._uc==null) return 1; if(b._uc==null) return -1; return a._uc-b._uc; });
  const lowest = list.length && list[0]._uc!=null ? list[0]._uc : null;
  const unit=(p&&p.unit)||'unit';
  out.innerHTML =
    `<div class="cmp-meta"><span>Product: <b>${esc(p?p.name:'')}</b></span>${p&&p.category?`<span>Category: <b>${esc(p.category)}</b></span>`:''}<span>Vendors quoting: <b>${list.length}</b></span></div>`+
    '<div class="card"><table><thead><tr><th>Vendor</th><th>Pack size</th><th>Package price</th><th>Unit cost</th><th>Last quoted</th></tr></thead><tbody>'+
    list.map(x=>`<tr class="${x._uc!=null&&lowest!=null&&x._uc===lowest?'lowest':''}">
      <td><b>${esc(vendorName(x.vendorId))}</b></td>
      <td>${x.packSize?esc(x.packSize)+' '+esc(unit):'—'}</td>
      <td>${fmtMoney(x.price)}</td>
      <td class="unit-cost">${x._uc!=null?fmtMoney(x._uc)+'<span class="muted" style="font-weight:400">/'+esc(unit)+'</span>':'—'}${x._uc!=null&&lowest!=null&&x._uc===lowest?'<span class="tag-low">lowest</span>':''}</td>
      <td class="muted">${fmtDate(x.date)}</td>
    </tr>`).join('')+'</tbody></table></div>';
}

// ════════════════ MODALS / CRUD ════════════════
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); document.getElementById('modal').innerHTML=''; }
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalBg').classList.add('show'); }
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }

// Vendor
function openVendor(id){
  if(!canEdit()) return;
  const v = id?vendors.find(x=>x.id===id):{};
  openModal(`<div class="modal-head"><div class="h">${id?'Edit vendor':'New vendor'}</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="fld"><label>Vendor name *</label><input id="v_name" value="${esc(v.name||'')}"></div>
    <div class="fld-row"><div class="fld"><label>Contact person</label><input id="v_contact" value="${esc(v.contact||'')}"></div><div class="fld"><label>Sales rep</label><input id="v_rep" value="${esc(v.rep||'')}"></div></div>
    <div class="fld-row"><div class="fld"><label>Phone</label><input id="v_phone" value="${esc(v.phone||'')}"></div><div class="fld"><label>Email</label><input id="v_email" value="${esc(v.email||'')}"></div></div>
    <div class="fld"><label>Website</label><input id="v_website" value="${esc(v.website||'')}"></div>
    <div class="fld-row"><div class="fld"><label>Payment terms</label><input id="v_terms" value="${esc(v.terms||'')}" placeholder="e.g. Net 30"></div><div class="fld"><label>Delivery days</label><input id="v_delivery" value="${esc(v.deliveryDays||'')}" placeholder="e.g. Mon, Thu"></div></div>
    <div class="fld"><label>Minimum order</label><input id="v_min" value="${esc(v.minOrder||'')}"></div>
    <div class="fld"><label>Notes</label><textarea id="v_notes">${esc(v.notes||'')}</textarea></div>
    <div class="fld"><label><input type="checkbox" id="v_active" ${v.active===false?'':'checked'} style="width:auto;margin-right:6px">Active vendor</label></div>
  </div>
  <div class="modal-foot">${id?`<button class="btn ghost" onclick="deleteVendor('${id}')" style="margin-right:auto;color:#c0392b">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveVendor('${id||''}')">Save</button></div>`);
  setTimeout(()=>document.getElementById('v_name').focus(),60);
}
async function saveVendor(id){
  const name=val('v_name'); if(!name){ alert('Vendor name is required.'); return; }
  const data={ name, contact:val('v_contact'), rep:val('v_rep'), phone:val('v_phone'), email:val('v_email'), website:val('v_website'), terms:val('v_terms'), deliveryDays:val('v_delivery'), minOrder:val('v_min'), notes:val('v_notes'), active:document.getElementById('v_active').checked, updatedAt:Date.now() };
  try{ if(id){ await db.collection('vendors').doc(id).set(data,{merge:true}); } else { data.createdAt=Date.now(); await db.collection('vendors').add(data); } closeModal(); toast('Vendor saved ✓'); }
  catch(e){ alert('Could not save: '+e.message); }
}
async function deleteVendor(id){
  if(!confirm('Delete this vendor? Their past quotes will stay in the records.')) return;
  try{ await db.collection('vendors').doc(id).delete(); closeModal(); toast('Vendor deleted'); }catch(e){ alert('Could not delete: '+e.message); }
}

// Product
const CATEGORIES=['Meat','Dairy','Frozen','Produce','Dry Goods','Beverages','Cleaning Supplies','Paper Products','Smallwares','Other'];
function openProduct(id){
  if(!canEdit()) return;
  const p = id?products.find(x=>x.id===id):{};
  openModal(`<div class="modal-head"><div class="h">${id?'Edit product':'New product'}</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="fld"><label>Product name *</label><input id="p_name" value="${esc(p.name||'')}" placeholder="e.g. Chicken Breast"><div class="hint">Keep it generic — one entry per item, no vendor wording.</div></div>
    <div class="fld-row">
      <div class="fld"><label>Category</label><select id="p_cat">${CATEGORIES.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fld"><label>Standard unit *</label><input id="p_unit" value="${esc(p.unit||'')}" placeholder="e.g. lb, each, case"><div class="hint">The unit you compare on.</div></div>
    </div>
    <div class="fld"><label>Internal code (optional)</label><input id="p_code" value="${esc(p.code||'')}"></div>
    <div class="fld"><label>Description / notes</label><textarea id="p_desc">${esc(p.description||'')}</textarea></div>
  </div>
  <div class="modal-foot">${id?`<button class="btn ghost" onclick="deleteProduct('${id}')" style="margin-right:auto;color:#c0392b">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveProduct('${id||''}')">Save</button></div>`);
  setTimeout(()=>document.getElementById('p_name').focus(),60);
}
async function saveProduct(id){
  const name=val('p_name'), unit=val('p_unit');
  if(!name){ alert('Product name is required.'); return; }
  if(!unit){ alert('Standard unit is required (e.g. lb) — it’s how prices are compared.'); return; }
  const data={ name, unit, category:val('p_cat'), code:val('p_code'), description:val('p_desc'), updatedAt:Date.now() };
  try{ if(id){ await db.collection('products').doc(id).set(data,{merge:true}); } else { data.createdAt=Date.now(); await db.collection('products').add(data); } closeModal(); toast('Product saved ✓'); }
  catch(e){ alert('Could not save: '+e.message); }
}
async function deleteProduct(id){
  if(prices.some(x=>x.productId===id)){ alert('This product has price quotes — remove or reassign those first.'); return; }
  if(!confirm('Delete this product?')) return;
  try{ await db.collection('products').doc(id).delete(); closeModal(); toast('Product deleted'); }catch(e){ alert('Could not delete: '+e.message); }
}

// Quote (price record)
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function openQuote(id){
  if(!canEdit()) return;
  if(!vendors.length || !products.length){ alert('Add at least one vendor and one product first.'); return; }
  const x = id?prices.find(q=>q.id===id):{date:today(), quoteType:'Weekly'};
  const vOpts=vendors.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(v=>`<option value="${v.id}" ${x.vendorId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');
  const pOpts=products.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(p=>`<option value="${p.id}" ${x.productId===p.id?'selected':''}>${esc(p.name)}${p.unit?' ('+esc(p.unit)+')':''}</option>`).join('');
  openModal(`<div class="modal-head"><div class="h">${id?'Edit quote':'New price quote'}</div><button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
  <div class="modal-body">
    <div class="fld"><label>Product *</label><select id="q_product">${pOpts}</select></div>
    <div class="fld"><label>Vendor *</label><select id="q_vendor">${vOpts}</select></div>
    <div class="fld-row">
      <div class="fld"><label>Pack size *</label><input id="q_pack" type="number" step="any" value="${esc(x.packSize||'')}" placeholder="e.g. 40"><div class="hint">How many units in the pack.</div></div>
      <div class="fld"><label>Package price *</label><input id="q_price" type="number" step="any" value="${esc(x.price||'')}" placeholder="e.g. 92.50"></div>
    </div>
    <div class="fld-row">
      <div class="fld"><label>Date quoted</label><input id="q_date" type="date" value="${esc(x.date||today())}"></div>
      <div class="fld"><label>Quote type</label><select id="q_type">${['Weekly','Spot','Contract','Catalog'].map(t=>`<option ${x.quoteType===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="fld"><label>Notes</label><input id="q_notes" value="${esc(x.notes||'')}" placeholder="e.g. fresh, frozen, brand"></div>
    <div class="hint" id="q_uc"></div>
  </div>
  <div class="modal-foot">${id?`<button class="btn ghost" onclick="deleteQuote('${id}')" style="margin-right:auto;color:#c0392b">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveQuote('${id||''}')">${id?'Save':'Add quote'}</button></div>`);
  const upd=()=>{ const uc=unitCost(val('q_price'),val('q_pack')); const p=product(val('q_product')); document.getElementById('q_uc').innerHTML = uc!=null?('Unit cost: <b>'+fmtMoney(uc)+'/'+esc((p&&p.unit)||'unit')+'</b>'):''; };
  ['q_pack','q_price','q_product'].forEach(i=>{ const e=document.getElementById(i); if(e) e.addEventListener('input',upd); }); upd();
}
async function saveQuote(id){
  const productId=val('q_product'), vendorId=val('q_vendor'), packSize=val('q_pack'), price=val('q_price');
  if(!productId||!vendorId){ alert('Pick a product and a vendor.'); return; }
  if(!packSize||!price){ alert('Pack size and price are required.'); return; }
  const data={ productId, vendorId, packSize:parseFloat(packSize), price:parseFloat(price), date:val('q_date')||today(), quoteType:val('q_type'), notes:val('q_notes'), updatedAt:Date.now() };
  try{ if(id){ await db.collection('vendorPrices').doc(id).set(data,{merge:true}); } else { data.createdAt=Date.now(); await db.collection('vendorPrices').add(data); } closeModal(); toast('Quote saved ✓'); }
  catch(e){ alert('Could not save: '+e.message); }
}
async function deleteQuote(id){
  if(!confirm('Delete this price quote?')) return;
  try{ await db.collection('vendorPrices').doc(id).delete(); closeModal(); toast('Quote deleted'); }catch(e){ alert('Could not delete: '+e.message); }
}

let _toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),2200); }
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

// ════════════════ START ════════════════
if(!tryResumeSession()) showLogin();
</script>
