<!-- Premier Caterers Grocery | Phase 1-4 + 127-dish library -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Premier Caterers — Grocery</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#f0f0ec;
  --text:#1a1a18;--text2:#6b6b65;--text3:#9a9a94;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --maroon:#8B1A1A;--maroon-bg:#f7ecec;
  --blue-bg:#E6F1FB;--blue-text:#0C447C;--blue-mid:#185FA5;--blue-border:#B5D4F4;
  --amber-bg:#FAEEDA;--amber-text:#633806;--amber-border:#FAC775;
  --green-bg:#EAF3DE;--green-text:#27500A;--green-border:#97C459;
  --coral-bg:#FAECE7;--coral-text:#712B13;--coral-border:#E8A98F;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#282826;--bg3:#323230;
  --text:#f0f0ec;--text2:#a0a09a;--text3:#68685e;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
  --maroon:#C0392B;--maroon-bg:#3a1f1d;
  --blue-bg:#042C53;--blue-text:#B5D4F4;--blue-mid:#378ADD;
  --amber-bg:#412402;--amber-text:#FAC775;
  --green-bg:#173404;--green-text:#C0DD97;
  --coral-bg:#4A1B0C;--coral-text:#F5C4B3;
}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
.ti{font-style:normal}
a{color:var(--maroon);text-decoration:none}

/* Topbar */
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1rem;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex-shrink:0}
.brand-mark{width:30px;height:30px;background:var(--maroon-bg);color:var(--maroon);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:17px}
.brand small{font-weight:400;color:var(--text3);font-size:12px}
.spacer{flex:1}
.weeknav{display:flex;align-items:center;gap:4px}
.we-pill{font-size:14px;font-weight:700;color:#fff;background:var(--maroon);padding:6px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);min-width:150px;justify-content:center}
.wbtn{width:30px;height:30px;border:0.5px solid var(--border2);background:var(--bg);border-radius:8px;color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:16px}
.wbtn:hover{background:var(--bg2)}
.applink{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);white-space:nowrap}
.applink:hover{background:var(--bg2)}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1rem;overflow-x:auto}
.tab{padding:12px 14px;font-size:13.5px;font-weight:500;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--maroon);border-bottom-color:var(--maroon)}
.tab .cnt{font-size:11px;background:var(--bg3);color:var(--text2);border-radius:9px;padding:0 6px;min-width:16px;text-align:center}

.wrap{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 4rem}
.empty{text-align:center;color:var(--text3);font-size:14px;padding:3rem 1rem}
.muted{color:var(--text3)}

/* Event card */
.ev{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.1rem;overflow:hidden}
.ev-head{display:flex;align-items:center;gap:10px;padding:.85rem 1rem;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.job-pill{font-size:12px;font-weight:700;color:var(--maroon);background:var(--maroon-bg);border-radius:6px;padding:2px 8px}
.ev-name{font-weight:600;font-size:15px}
.ev-meta{font-size:12px;color:var(--text3)}
.mode-tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.mode-catered{background:var(--blue-bg);color:var(--blue-text)}
.mode-dropoff{background:var(--amber-bg);color:var(--amber-text)}
.ev-count{margin-left:auto;font-size:12px;color:var(--text2);background:var(--bg2);border-radius:10px;padding:1px 9px}

/* Grocery table */
.gt{width:100%;border-collapse:collapse;font-size:13.5px}
.gt th{text-align:left;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);font-weight:600;padding:7px 8px;border-bottom:0.5px solid var(--border)}
.gt td{padding:2px 6px;border-bottom:0.5px solid var(--border)}
.gt tr:last-child td{border-bottom:none}
.gt input,.gt select{width:100%;border:1px solid transparent;background:transparent;color:var(--text);padding:5px 6px;border-radius:6px}
.gt input:hover,.gt select:hover{background:var(--bg2)}
.gt input:focus,.gt select:focus{outline:none;background:var(--bg);border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon-bg)}
.col-sec{width:20%}.col-kit{width:54px}.col-item{width:34%}.col-qty{width:74px}.col-ven{width:16%}.col-x{width:30px}
.kit-cell{padding:0 6px!important}
.kit{width:100%;border:none;border-radius:6px;font-weight:700;font-size:12px;text-align:center;padding:6px 2px;cursor:pointer;-webkit-appearance:none;appearance:none}
.kit-P{background:var(--green-bg);color:var(--green-text)}
.kit-D{background:var(--blue-bg);color:var(--blue-text)}
.kit-M{background:var(--coral-bg);color:var(--coral-text)}
.kit-X{background:var(--bg2);color:var(--text2)}
.rowx{border:none;background:none;color:var(--text3);font-size:15px;width:26px;height:26px;border-radius:6px;opacity:.5}
.ev:hover .rowx,.rowx:hover{opacity:1}.rowx:hover{background:var(--coral-bg);color:var(--coral-text)}
.ev-foot{display:flex;gap:8px;padding:.6rem 1rem;flex-wrap:wrap}
.addbtn{font-size:12.5px;font-weight:500;color:var(--maroon);background:var(--maroon-bg);border:none;border-radius:var(--radius);padding:7px 12px;display:inline-flex;align-items:center;gap:5px}
.addbtn.ghost{background:none;color:var(--text2);border:0.5px solid var(--border2)}
.addbtn:hover{filter:brightness(.97)}

/* By-vendor */
.vend-block{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.9rem;overflow:hidden}
.vend-head{display:flex;align-items:center;gap:8px;padding:.7rem 1rem;border-bottom:0.5px solid var(--border);font-weight:600;font-size:14px}
.vend-head .ti{color:var(--maroon)}
.vend-head .n{margin-left:auto;font-size:12px;color:var(--text2);background:var(--bg2);border-radius:10px;padding:1px 9px}
.vend-copy{font-size:11.5px;color:var(--text2);border:0.5px solid var(--border2);background:var(--bg);border-radius:6px;padding:4px 9px;display:inline-flex;gap:4px;align-items:center}
.vrow{display:flex;align-items:center;gap:8px;padding:6px 1rem;font-size:13.5px;border-bottom:0.5px solid var(--border)}
.vrow:last-child{border-bottom:none}
.vrow .vk{flex-shrink:0;width:22px;height:20px;border-radius:4px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.vrow .vi{flex:1}
.vrow .vq{flex-shrink:0;color:var(--text2);font-size:12.5px;font-weight:600}
.vrow .vfor{flex-shrink:0;color:var(--text3);font-size:11px;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.instock-note{font-size:12px;color:var(--text3);background:var(--bg2);border-radius:var(--radius);padding:.6rem .9rem;margin-bottom:.9rem;display:flex;gap:8px;align-items:center}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text2)}
.chk input{width:16px;height:16px;accent-color:var(--maroon)}

/* Library + vendors lists */
.lib-row,.ven-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:.7rem .9rem;margin-bottom:7px}
.lib-row:hover,.ven-row:hover{border-color:var(--border2)}
.lib-name{font-weight:600;font-size:14px}
.lib-sec{font-size:11px;color:var(--text3)}
.lib-comp{font-size:12px;color:var(--text2);margin-left:auto;background:var(--bg2);border-radius:10px;padding:1px 9px}
.iconbtn{border:none;background:none;color:var(--text3);font-size:16px;width:30px;height:30px;border-radius:6px}
.iconbtn:hover{background:var(--bg2);color:var(--text)}
.search{width:100%;max-width:340px;padding:9px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);margin-bottom:1rem}
.pri{background:var(--maroon);color:#fff;border:none;border-radius:var(--radius);padding:9px 15px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pri:hover{filter:brightness(1.05)}
.flag{font-size:10.5px;font-weight:700;color:var(--amber-text);background:var(--amber-bg);border-radius:5px;padding:2px 7px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;align-items:center;padding:1rem 1.1rem;border-bottom:0.5px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--bg)}
.modal-h .iconbtn{margin-left:auto}
.modal-b{padding:1.1rem}
.fld{margin-bottom:.9rem}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:9px 11px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text)}
.comp-edit{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.comp-edit input,.comp-edit select{padding:7px 8px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px}
.modal-f{display:flex;gap:8px;padding:1rem 1.1rem;border-top:0.5px solid var(--border);position:sticky;bottom:0;background:var(--bg)}
.modal-f .pri{flex:1;justify-content:center}
.btn-cancel{background:var(--bg2);color:var(--text2);border:none;border-radius:var(--radius);padding:9px 15px;font-size:13.5px}

/* Pick-dish list */
.pick{max-height:50vh;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);cursor:pointer}
.pick-row:hover{background:var(--bg2)}
.pick-row .pn{font-size:13.5px;font-weight:500}
.pick-row .ps{font-size:11px;color:var(--text3)}
.pick-row .pc{margin-left:auto;font-size:11px;color:var(--text3)}

/* Toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:900;pointer-events:none}
.toast.show{opacity:.95}

/* Menu builder */
.builder-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:flex;align-items:stretch;justify-content:center;padding:0}
.builder{background:var(--bg3);width:100%;max-width:780px;display:flex;flex-direction:column;height:100%}
.builder-head{background:var(--bg);border-bottom:0.5px solid var(--border);padding:.85rem 1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.builder-head .bt{font-weight:600;font-size:15px}
.builder-head .bsub{font-size:12px;color:var(--text3)}
.builder-head select{margin-left:auto;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12.5px}
.builder-search{background:var(--bg);padding:0 1rem .8rem;border-bottom:0.5px solid var(--border)}
.builder-search input{width:100%;padding:9px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text)}
.builder-body{flex:1;overflow-y:auto;padding:.8rem 1rem 1rem}
.bsec{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden}
.bsec-head{display:flex;align-items:center;gap:8px;padding:.7rem .9rem;font-weight:600;font-size:13.5px;cursor:pointer}
.bsec-head .chev{color:var(--text3);font-size:15px;transition:transform .15s}
.bsec.collapsed .chev{transform:rotate(-90deg)}
.bsec-head .sc{margin-left:auto;font-size:11px;color:var(--text2);background:var(--bg2);border-radius:10px;padding:1px 9px}
.bsec-head .sc.on{background:var(--maroon);color:#fff}
.bsec-list{border-top:0.5px solid var(--border)}
.bsec.collapsed .bsec-list{display:none}
.bdish{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;font-size:13.5px}
.bdish:last-child{border-bottom:none}
.bdish:hover{background:var(--bg2)}
.bdish input{width:17px;height:17px;accent-color:var(--maroon);flex-shrink:0}
.bdish.sel{background:var(--maroon-bg)}
.bdish .bn{flex:1}
.bdish .bc{font-size:11px;color:var(--text3)}
.builder-foot{background:var(--bg);border-top:0.5px solid var(--border);padding:.8rem 1rem;display:flex;align-items:center;gap:12px}
.builder-foot .cnt{font-size:13px;color:var(--text2)}
.builder-foot .build{margin-left:auto;background:var(--maroon);color:#fff;border:none;border-radius:var(--radius);padding:11px 20px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.builder-foot .build:hover{filter:brightness(1.07)}
.bclose{border:none;background:none;color:var(--text3);font-size:20px;width:32px;height:32px;border-radius:6px}
.bclose:hover{background:var(--bg2);color:var(--text)}
.bempty{color:var(--text3);font-size:13px;text-align:center;padding:2rem}

@media(max-width:640px){
  .col-sec{width:auto}.col-item{width:auto}.col-ven{width:auto}
  .ev-meta{width:100%}
  .gt{font-size:13px}
  .applink span{display:none}
}

/* ===== Phase 3: Menu document ===== */
.mdoc-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:650;display:flex;align-items:stretch;justify-content:center}
.mdoc-shell{background:var(--bg3);width:100%;max-width:920px;display:flex;flex-direction:column;height:100%}
.mdoc-toolbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:.7rem 1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mdoc-seg{display:inline-flex;border:0.5px solid var(--border2);border-radius:8px;overflow:hidden}
.mdoc-seg button{border:none;background:var(--bg);color:var(--text2);font-size:13px;font-weight:600;padding:7px 16px}
.mdoc-seg button.on{background:var(--maroon);color:#fff}
.mdoc-tool-sp{flex:1}
.mdoc-print-btn{background:var(--maroon);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mdoc-x{border:none;background:none;color:var(--text3);font-size:20px;width:34px;height:34px;border-radius:6px}
.mdoc-x:hover{background:var(--bg2);color:var(--text)}
.mdoc-scroll{flex:1;overflow-y:auto;padding:1.5rem 1rem 3rem;display:flex;justify-content:center}
.mdoc-print{background:#fff;color:#1a1a18;width:100%;max-width:760px;min-height:100%;padding:46px 54px;box-shadow:0 6px 30px rgba(0,0,0,.25);font-family:Georgia,'Times New Roman',serif}
.mdoc-print.internal{max-width:860px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.mdoc-head{text-align:center;border-bottom:2px solid #8B1A1A;padding-bottom:14px;margin-bottom:24px}
.mdoc-brand{font-family:Georgia,serif;font-size:26px;letter-spacing:5px;color:#8B1A1A;font-weight:700}
.mdoc-brand small{display:block;letter-spacing:6px;font-size:10px;color:#8B1A1A;font-weight:400;margin-top:3px}
.mdoc-evline{margin-top:11px;font-size:13px;color:#555;font-family:-apple-system,sans-serif}
.mdoc-evline b{color:#1a1a18}
.mdoc-sec{margin:0 0 22px}
.mdoc-sec h3{text-align:center;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:#8B1A1A;margin:0 0 9px;font-family:-apple-system,sans-serif;font-weight:700}
.mdoc-dish{text-align:center;font-size:15px;line-height:1.75;color:#1a1a18}
.mdoc-isec{display:flex;border:1px solid #ddd;border-bottom:none}
.mdoc-print.internal .mdoc-isec:last-child{border-bottom:1px solid #ddd}
.mdoc-isec .ml{flex:0 0 42%;padding:9px 13px;border-right:1px solid #ddd}
.mdoc-isec .mr{flex:1;padding:7px 11px}
.mdoc-isec .secname{font-weight:700;font-size:12.5px;color:#8B1A1A;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.mdoc-isec .mdish{font-size:13px;line-height:1.55;color:#1a1a18}
.mdoc-grow{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0;border-bottom:0.5px solid #eee}
.mdoc-grow:last-child{border-bottom:none}
.mdoc-k{flex-shrink:0;width:18px;height:16px;border-radius:3px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mdoc-k.P{background:#EAF3DE;color:#27500A}.mdoc-k.D{background:#E6F1FB;color:#0C447C}
.mdoc-k.M{background:#FAECE7;color:#712B13}.mdoc-k.X{background:#f0f0ec;color:#777}
.mdoc-gi{flex:1}.mdoc-gq{color:#666;font-size:11px;min-width:34px;text-align:right}
.mdoc-gv{color:#999;font-size:11px;min-width:54px;text-align:right}
.mdoc-empty{text-align:center;color:#999;padding:48px 20px;font-size:14px}
@media print{
  body{background:#fff}
  body>*:not(#menuDocHost){display:none!important}
  #menuDocHost .mdoc-bg{position:static;background:#fff;display:block}
  #menuDocHost .mdoc-shell{max-width:none;height:auto;display:block}
  #menuDocHost .mdoc-toolbar{display:none!important}
  #menuDocHost .mdoc-scroll{overflow:visible;padding:0;display:block}
  #menuDocHost .mdoc-print{box-shadow:none;max-width:none;width:auto;padding:20px;min-height:0}
}

.mdoc-arrh{font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#8B1A1A;font-weight:700;font-family:-apple-system,sans-serif;border-bottom:1px solid #ddd;padding-bottom:4px;margin:26px 0 10px}
.mdoc-arr{white-space:pre-wrap;font-size:13.5px;line-height:1.7;font-family:-apple-system,sans-serif;color:#1a1a18;outline:none;border:1px dashed transparent;border-radius:6px;padding:6px 8px;min-height:1em}
.mdoc-arr:hover{border-color:#e3c9c9}
.mdoc-arr:focus{border-color:#8B1A1A;background:#fcf6f6}
.mdoc-contract{white-space:pre-wrap;font-size:11.5px;line-height:1.6;font-family:-apple-system,sans-serif;color:#333;padding:4px 8px;page-break-inside:avoid}
@media print{ .mdoc-arr{border-color:transparent!important;background:none!important} }

.mdoc-est{width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;margin-top:2px}
.mdoc-est th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#aaa;font-weight:600;padding:0 6px 5px;border-bottom:1px solid #ddd}
.mdoc-est th.q,.mdoc-est th.p,.mdoc-est th.a{text-align:right}
.mdoc-est td{padding:0;border-bottom:0.5px solid #f1f1ec;vertical-align:middle}
.mdoc-est td.a{text-align:right;color:#1a1a18;white-space:nowrap;padding-right:6px;font-variant-numeric:tabular-nums;width:84px}
.mdoc-est td:nth-child(2),.mdoc-est td:nth-child(3){width:64px}
.mdoc-est td:last-child{width:22px;text-align:center}

.mdoc-tot .grand{font-weight:700;font-size:15px;border-top:1px solid #ddd;border-bottom:2px solid #8B1A1A;margin:5px 0;padding:7px 6px}
.mdoc-tot .bal{font-weight:700}.mdoc-tot .bal span:last-child{color:#8B1A1A}
.mdoc-tot .edep{max-width:96px;text-align:right;padding:3px 5px}

  ['premier',true],['aisle',false],['bertram',false],['chefs',false],['rd',false],['gg',false],

// ---------- Utilities ----------
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function weekDate(off){ return new Date(Date.UTC(2026,5,7) + off*7*24*60*60*1000); } // Jun 7 2026 = Sunday
function weekKey(off){ return weekDate(off).toISOString().split('T')[0]; }
function weekLabel(off){ const d=weekDate(off); return 'W/E '+MONTHS[d.getUTCMonth()]+' '+d.getUTCDate(); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function displayJob(j){ if(!j) return ''; const p=String(j).split('-'); return p.length>1?('#'+p[1]):('#'+String(j).replace('#','')); }
function eventMode(e){ return (e && e.type==='dropoff') ? 'dropoff' : 'catered'; }
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400); }

// ---------- Listeners ----------
function startListeners(){
  db.collection('events').onSnapshot(s=>{ events=s.docs.map(d=>({id:d.id,...d.data()})); render(); updateCounts(); });
  db.collection('groceryDishes').onSnapshot(s=>{ dishes=s.docs.map(d=>({id:d.id,...d.data()})); if(tab==='lib'||tab==='week')render(); updateCounts(); });
  db.collection('groceryVendors').onSnapshot(s=>{
    vendors=s.docs.map(d=>({id:d.id,...d.data()}));
    if(vendors.length===0){ seedVendors(); }
    if(tab==='ven'||tab==='week'||tab==='vendor')render(); updateCounts();
  });
  watchItems();
}
function watchItems(){
  if(itemsUnsub) itemsUnsub();
  itemsUnsub = db.collection('groceryItems').where('weekOf','==',weekKey(weekOffset))
    .onSnapshot(s=>{ items=s.docs.map(d=>({id:d.id,...d.data()})); if(tab==='week'||tab==='vendor')render(); updateCounts(); });
}
function seedVendors(){
  const batch=db.batch();
  DEFAULT_VENDORS.forEach(([name,inStock],i)=>{
    const id=genId(); batch.set(db.collection('groceryVendors').doc(id),{name,inStock,order:i});
  });
  batch.commit().then(()=>toast('Vendor list ready'));
}

// ---------- Firestore writes ----------
function saveItem(it){ db.collection('groceryItems').doc(it.id).set(it); }
function delItem(id){ db.collection('groceryItems').doc(id).delete(); }
function addItem(eventId, partial){
  const it={ id:genId(), eventId, weekOf:weekKey(weekOffset),
    section:'', kitchen:'X', item:'', qty:'', vendor:'',
    order:Date.now(), ...partial };
  saveItem(it);
}

// ---------- Counts ----------
function updateCounts(){
  const wk=weekKey(weekOffset);
  document.getElementById('cnt-week').textContent = events.filter(e=>(e.weekOf||'')===wk).length;
  document.getElementById('cnt-lib').textContent = dishes.length;
  document.getElementById('cnt-ven').textContent = vendors.length;
  document.getElementById('wePill').textContent = weekLabel(weekOffset);
}

// ---------- Navigation ----------
function changeWeek(d){ weekOffset+=d; updateCounts(); watchItems(); render(); }
function setTab(t){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active'); render(); }

// ---------- Render dispatch ----------
function render(){
  const v=document.getElementById('view');
  if(tab==='week') v.innerHTML=renderWeek();
  else if(tab==='vendor') v.innerHTML=renderVendorView();
  else if(tab==='lib') v.innerHTML=renderLibrary();
  else if(tab==='ven') v.innerHTML=renderVendors();
}

// ===== TAB: This week (per-event grocery lists) =====
function vendorOptions(sel){
  const opts=['<option value="">vendor…</option>'].concat(
    vendors.slice().sort((a,b)=>a.name.localeCompare(b.name))
      .map(v=>`<option value="${esc(v.name)}"${v.name===sel?' selected':''}>${esc(v.name)}</option>`));
  return opts.join('');
}
function sectionOptions(sel){
  const set=[...new Set(SECTIONS.concat(sel&&!SECTIONS.includes(sel)?[sel]:[]))];
  return ['<option value="">section…</option>'].concat(
    set.map(s=>`<option value="${esc(s)}"${s===sel?' selected':''}>${esc(s)}</option>`)).join('');
}
function itemRow(it){
  return `<tr data-id="${it.id}">
    <td class="col-sec"><select onchange="editItem('${it.id}','section',this.value)">${sectionOptions(it.section)}</select></td>
    <td class="col-kit kit-cell"><select class="kit kit-${it.kitchen||'X'}" onchange="editItem('${it.id}','kitchen',this.value);this.className='kit kit-'+this.value">
      ${KITCHENS.map(k=>`<option value="${k}"${k===(it.kitchen||'X')?' selected':''}>${k}</option>`).join('')}</select></td>
    <td class="col-item"><input value="${esc(it.item)}" placeholder="item" oninput="editItemDebounced('${it.id}','item',this.value)"></td>
    <td class="col-qty"><input value="${esc(it.qty)}" placeholder="qty" oninput="editItemDebounced('${it.id}','qty',this.value)"></td>
    <td class="col-ven"><select onchange="editItem('${it.id}','vendor',this.value)">${vendorOptions(it.vendor)}</select></td>
    <td class="col-x"><button class="rowx" onclick="delItem('${it.id}')" title="Remove">×</button></td>
  </tr>`;
}
function renderWeek(){
  const wk=weekKey(weekOffset);
  const wkEvents=events.filter(e=>(e.weekOf||'')===wk)
    .sort((a,b)=>(displayJob(a.job)).localeCompare(displayJob(b.job),undefined,{numeric:true}));
  if(wkEvents.length===0) return `<div class="empty"><i class="ti ti-calendar-off" style="font-size:30px;display:block;margin-bottom:8px"></i>No events for ${weekLabel(weekOffset)}.<br>Use the arrows to change week, or add events in the main app.</div>`;
  return wkEvents.map(e=>{
    const mode=eventMode(e);
    const rows=items.filter(it=>it.eventId===e.id).sort((a,b)=>(a.order||0)-(b.order||0));
    return `<div class="ev">
      <div class="ev-head">
        <span class="job-pill">${esc(displayJob(e.job))}</span>
        <span class="ev-name">${esc(e.name||'Untitled')}</span>
        <span class="mode-tag mode-${mode}">${mode==='dropoff'?'Drop-off':'Catered'}</span>
        <span class="ev-meta">${esc(e.typeLabel||e.type||'')}${e.guests?' · '+esc(e.guests)+' guests':''}</span>
        <span class="ev-count">${rows.length} item${rows.length===1?'':'s'}</span>
      </div>
      ${rows.length? `<table class="gt"><thead><tr>
          <th class="col-sec">Section</th><th class="col-kit">Kit</th><th class="col-item">Item</th>
          <th class="col-qty">Qty</th><th class="col-ven">Vendor</th><th class="col-x"></th>
        </tr></thead><tbody>${rows.map(itemRow).join('')}</tbody></table>`
        : `<div style="padding:1rem;color:var(--text3);font-size:13px">No items yet.</div>`}
      <div class="ev-foot">
        <button class="addbtn" style="background:var(--maroon);color:#fff" onclick="openBuilder('${e.id}')"><i class="ti ti-clipboard-list"></i> Build menu</button>
        <button class="addbtn ghost" onclick="addItem('${e.id}')"><i class="ti ti-plus"></i> Add item</button>
        <button class="addbtn ghost" onclick="openPickDish('${e.id}')"><i class="ti ti-books"></i> Add one dish</button>
        <button class="addbtn ghost" onclick="openMenuDoc('${e.id}')"><i class="ti ti-file-text"></i> Menu</button>
      </div>
    </div>`;
  }).join('');
}

// inline edits
let editT={};
function editItem(id,field,val){ const it=items.find(x=>x.id===id); if(!it)return; it[field]=val; saveItem(it); }
function editItemDebounced(id,field,val){ const it=items.find(x=>x.id===id); if(!it)return; it[field]=val;
  clearTimeout(editT[id+field]); editT[id+field]=setTimeout(()=>saveItem(it),450); }

// ===== TAB: By vendor =====
function renderVendorView(){
  const wk=weekKey(weekOffset);
  const evName=id=>{ const e=events.find(x=>x.id===id); return e?(displayJob(e.job)+' '+(e.name||'')):''; };
  const inStockNames=new Set(vendors.filter(v=>v.inStock).map(v=>v.name));
  const all=items.filter(it=>it.item && it.item.trim());
  const orderable=all.filter(it=>!inStockNames.has(it.vendor));
  const inStock=all.filter(it=>inStockNames.has(it.vendor)||!it.vendor);

  if(all.length===0) return `<div class="empty">No grocery items this week yet. Add some on the <a href="#" onclick="setTab('week');return false">This week</a> tab.</div>`;

  // group orderable by vendor
  const groups={};
  orderable.forEach(it=>{ const v=it.vendor||'(no vendor)'; (groups[v]=groups[v]||[]).push(it); });
  const vnames=Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  let html=`<div class="toolbar">
    <label class="chk"><input type="checkbox" ${consolidate?'checked':''} onchange="consolidate=this.checked;render()"> Consolidate duplicates (same item + vendor)</label>
  </div>`;

  html+=vnames.map(v=>{
    let list=groups[v];
    let bodyRows;
    if(consolidate){
      const m={};
      list.forEach(it=>{ const k=(it.item||'').toLowerCase().trim();
        if(!m[k]) m[k]={item:it.item,kitchen:it.kitchen,qtys:[]};
        if(it.qty) m[k].qtys.push(it.qty); });
      bodyRows=Object.values(m).map(r=>`<div class="vrow">
        <span class="vk kit-${r.kitchen||'X'}">${r.kitchen||'X'}</span>
        <span class="vi">${esc(r.item)}</span>
        <span class="vq">${esc(r.qtys.join(' + '))}</span></div>`).join('');
    } else {
      bodyRows=list.map(it=>`<div class="vrow">
        <span class="vk kit-${it.kitchen||'X'}">${it.kitchen||'X'}</span>
        <span class="vi">${esc(it.item)}</span>
        <span class="vq">${esc(it.qty)}</span>
        <span class="vfor">${esc(evName(it.eventId))}</span></div>`).join('');
    }
    const copyText=list.map(it=>`${it.item}${it.qty?' — '+it.qty:''}`).join('\n');
    return `<div class="vend-block">
      <div class="vend-head"><i class="ti ti-truck-delivery"></i> ${esc(v)}
        <span class="n">${list.length}</span>
        <button class="vend-copy" onclick='copyVendor(${JSON.stringify(copyText)})'><i class="ti ti-copy"></i> Copy</button></div>
      ${bodyRows}
    </div>`;
  }).join('');

  if(inStock.length){
    html+=`<div class="instock-note"><i class="ti ti-package"></i>
      <span><b>${inStock.length} in-stock / Premier item${inStock.length===1?'':'s'}</b> are on the kitchen list but excluded from vendor orders.</span></div>`;
  }
  return html;
}
function copyVendor(text){ navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')); }

// ===== TAB: Dish library =====
function renderLibrary(){
  const q=libSearch.toLowerCase();
  const list=dishes.filter(d=>!q || (d.name||'').toLowerCase().includes(q) || (d.section||'').toLowerCase().includes(q))
    .sort((a,b)=>(a.section||'').localeCompare(b.section||'')|| (a.name||'').localeCompare(b.name||''));
  const notImported = STARTER_DISHES.filter(s=>!dishes.some(x=>(x.name||'').toLowerCase().trim()===s.name.toLowerCase().trim())).length;
  let html=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
      <input class="search" placeholder="Search dishes…" value="${esc(libSearch)}" oninput="libSearch=this.value;render()" style="margin:0">
      <button class="pri" onclick="openDishEdit()"><i class="ti ti-plus"></i> New dish</button>
      ${notImported>0?`<button class="addbtn ghost" onclick="importStarter()"><i class="ti ti-download"></i> Import starter library (${notImported})</button>`:''}</div>`;
  if(list.length===0) html+=`<div class="empty">${dishes.length===0?'No dishes yet. Add your standardized dishes here — each one stores its grocery breakdown once and reuses it forever.':'No dishes match your search.'}</div>`;
  html+=list.map(d=>`<div class="lib-row">
      <div><div class="lib-name">${esc(d.name)}</div><div class="lib-sec">${esc(d.section||'—')}</div></div>
      <span class="lib-comp">${(d.components||[]).length} component${(d.components||[]).length===1?'':'s'}</span>
      <button class="iconbtn" onclick="openDishEdit('${d.id}')"><i class="ti ti-pencil"></i></button>

async function openBuilder(eventId){
  builderEventId=eventId; builderSel=new Set(); builderSearch=''; builderCollapsed={};
  try{
    const snap=await db.collection('groceryMenus').doc(eventId).get();
    if(snap.exists){ (snap.data().dishIds||[]).forEach(id=>builderSel.add(id)); }
  }catch(e){}
  // if no saved menu, pre-select dishes already exploded into this event's grocery
  if(builderSel.size===0){
    items.filter(it=>it.eventId===eventId && it.menuDish).forEach(it=>builderSel.add(it.menuDish));
  }
  let host=document.getElementById('builderHost');
  if(!host){ host=document.createElement('div'); host.id='builderHost'; document.body.appendChild(host); }
  host.innerHTML=renderBuilder();
}
function closeBuilder(){ const h=document.getElementById('builderHost'); if(h)h.remove(); builderEventId=null; }
function reRenderBuilder(){
  const h=document.getElementById('builderHost'); if(!h)return;
  const body=h.querySelector('.builder-body'); const sc=body?body.scrollTop:0;
  const focused=document.activeElement&&document.activeElement.id==='builderSearch';
  h.innerHTML=renderBuilder();
  const nb=h.querySelector('.builder-body'); if(nb)nb.scrollTop=sc;
  if(focused){ const s=document.getElementById('builderSearch'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); } }
}
function renderBuilder(){
  const e=events.find(x=>x.id===builderEventId); const mode=eventMode(e);
  const q=builderSearch.toLowerCase().trim();
  const tmplOpts=['<option value="">Start from template…</option>'].concat(Object.keys(TEMPLATES).map(t=>`<option value="${esc(t)}">${esc(t)}</option>`)).join('');
  // group dishes by section in SECTIONS order
  const bySec={};
  dishes.forEach(d=>{ const s=d.section||'Other'; (bySec[s]=bySec[s]||[]).push(d); });
  const order=SECTIONS.concat(Object.keys(bySec).filter(s=>!SECTIONS.includes(s)));
  let body='';
  order.forEach(sec=>{
    let list=(bySec[sec]||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if(q) list=list.filter(d=>(d.name||'').toLowerCase().includes(q));
    if(list.length===0) return;
    const selN=list.filter(d=>builderSel.has(d.id)).length;
    const collapsed=builderCollapsed[sec]?'collapsed':'';
    body+=`<div class="bsec ${collapsed}">
      <div class="bsec-head" onclick="toggleBsec('${esc(sec)}')">
        <i class="ti ti-chevron-down chev"></i> ${esc(sec)}
        <span class="sc ${selN?'on':''}">${selN?selN+' selected':list.length}</span>
      </div>
      <div class="bsec-list">
        ${list.map(d=>{
          const on=builderSel.has(d.id);
          const n=mode==='dropoff'?'ready':((d.components||[]).length+' comp');
          return `<label class="bdish ${on?'sel':''}">
            <input type="checkbox" ${on?'checked':''} onchange="toggleBuilderDish('${d.id}')">
            <span class="bn">${esc(d.name)}</span><span class="bc">${n}</span></label>`;
        }).join('')}
      </div></div>`;
  });
  if(!body) body=`<div class="bempty">No dishes match "${esc(builderSearch)}".</div>`;
  const n=builderSel.size;
  return `<div class="builder-bg" onclick="if(event.target===this)closeBuilder()"><div class="builder">
    <div class="builder-head">
      <div><div class="bt">Build menu</div><div class="bsub">${esc(e?e.name:'')} · ${mode==='dropoff'?'drop-off (ready dishes)':'catered (explodes to components)'}</div></div>
      <select onchange="applyTemplate(this.value)">${tmplOpts}</select>
      <button class="bclose" onclick="closeBuilder()"><i class="ti ti-x"></i></button>
    </div>
    <div class="builder-search"><input id="builderSearch" placeholder="Search dishes…" value="${esc(builderSearch)}" oninput="builderSearch=this.value;reRenderBuilder()"></div>
    <div class="builder-body">${body}</div>
    <div class="builder-foot">
      <span class="cnt">${n} dish${n===1?'':'es'} selected</span>
      <button class="build" onclick="buildGrocery()"><i class="ti ti-checklist"></i> Build grocery list</button>
    </div>
  </div></div>`;
}
function toggleBsec(sec){ builderCollapsed[sec]=!builderCollapsed[sec]; reRenderBuilder(); }
function toggleBuilderDish(id){ if(builderSel.has(id))builderSel.delete(id); else builderSel.add(id); reRenderBuilder(); }
function applyTemplate(name){
  if(!name) return;
  const wanted=TEMPLATES[name]||[];
  const byName=new Map(dishes.map(d=>[(d.name||'').toLowerCase().trim(),d.id]));
  let added=0;
  wanted.forEach(nm=>{ const id=byName.get(nm.toLowerCase().trim()); if(id){ builderSel.add(id); added++; } });
  reRenderBuilder();
  toast(added? ('Template added — '+added+' dishes'):'Import the dish library first');
}
async function buildGrocery(){
  const eid=builderEventId; const e=events.find(x=>x.id===eid); const mode=eventMode(e);
  const sel=[...builderSel];
  const desired=new Map(); // key dishId::comp -> row
  sel.forEach(did=>{
    const d=dishes.find(x=>x.id===did); if(!d)return;
    if(mode==='dropoff'){
      const item=(d.dropoff&&d.dropoff.item)||d.name;
      desired.set(did+'::'+item,{section:d.section||'',kitchen:(d.dropoff&&d.dropoff.kitchen)||'X',item,vendor:(d.dropoff&&d.dropoff.vendor)||'',menuDish:did,comp:item});
    } else {
      (d.components||[]).forEach(c=>{ desired.set(did+'::'+c.item,{section:d.section||'',kitchen:c.kitchen||'X',item:c.item,vendor:c.vendor||'',menuDish:did,comp:c.item}); });
    }
  });
  const existing=items.filter(it=>it.eventId===eid && it.menuDish);
  const existingKeys=new Set();
  const batch=db.batch(); let order=Date.now();
  existing.forEach(it=>{ const key=it.menuDish+'::'+(it.comp||it.item); existingKeys.add(key);
    if(!desired.has(key)) batch.delete(db.collection('groceryItems').doc(it.id)); });
  desired.forEach((v,key)=>{ if(!existingKeys.has(key)){ const id=genId();
    batch.set(db.collection('groceryItems').doc(id),{id,eventId:eid,weekOf:weekKey(weekOffset),section:v.section,kitchen:v.kitchen,item:v.item,qty:'',vendor:v.vendor,order:order++,menuDish:v.menuDish,comp:v.comp}); } });
  batch.set(db.collection('groceryMenus').doc(eid),{eventId:eid,dishIds:sel,updated:Date.now()},{merge:true});
  try{ await batch.commit(); closeBuilder(); toast('Grocery built from menu ✓'); }
  catch(err){ alert('Build failed: '+err.message); }
}

let _estSaveT;
function estSave(){ clearTimeout(_estSaveT); const eid=menuDocEventId, est=JSON.parse(JSON.stringify(menuDocEstimate));
  _estSaveT=setTimeout(()=>{ if(eid) db.collection('groceryMenus').doc(eid).set({eventId:eid,estimate:est,updated:Date.now()},{merge:true}).catch(()=>{}); },600); }
function estLine(i,f,v){ if(!menuDocEstimate.lines[i])return; menuDocEstimate.lines[i][f]=v; estRecalc(); estSave(); }
function estField(f,v){ menuDocEstimate[f]=v; estRecalc(); estSave(); }
function estAddLine(){ menuDocEstimate.lines.push({desc:'',qty:'',price:''}); estRerender(); estSave(); }
function estDelLine(i){ menuDocEstimate.lines.splice(i,1); estRerender(); estSave(); }
function estCategory(d){ d=(d||'').toLowerCase();
  if(/waiter|bartend|staff|chef|manager|rabbinic|mashgiach|supervis/.test(d)) return 'Staffing';
  if(/logistic|delivery|deposit|gratuit/.test(d)) return 'Logistics';
  return 'Food'; }
function estUnit(d){ d=(d||'').toLowerCase();
  if(/guest/.test(d)) return 'guest';
  if(/each|staff|waiter|bartend|chef|person/.test(d)) return 'person';
  return 'event'; }
async function saveQuoteToMainApp(){
  const eid=menuDocEventId; if(!eid) return;
  const e=events.find(x=>x.id===eid)||{};
  const lines=(menuDocEstimate.lines||[]).map((l,i)=>({
    id:'g'+i, category:estCategory(l.desc), description:l.desc||'',
    qty:parseFloat(l.qty||0)||0, unit:estUnit(l.desc), price:parseFloat(l.price||0)||0 }));
  if(lines.length===0){ toast('Add an estimate line first'); return; }
  const fin={ lines, deposit:parseFloat(menuDocEstimate.deposit||0)||0,
    taxExempt:!!menuDocEstimate.taxExempt, logisticsRate:EST_LOG };
  let existing=null;
  try{ const s=await db.collection('invoices').doc(eid).get(); if(s.exists) existing=s.data(); }catch(err){}
  if(existing){
    const st=existing.status||'quote';
    const msg=(st!=='quote')
      ? 'An invoice already exists for this event and is marked "'+st+'". Replacing it overwrites its line items and pricing with this estimate (its status and contact info are kept). Continue?'
      : 'A quote already exists for this event in the main app. Update its line items and pricing with this estimate? (Contact info and status are kept.)';
    if(!confirm(msg)) return;
    try{ await db.collection('invoices').doc(eid).set(Object.assign({},existing,fin,{updated:Date.now()})); toast('Quote updated in main app \u2713'); }
    catch(err){ toast('Could not save \u2014 check connection'); }
  } else {
    const inv=Object.assign({ eventId:eid, status:'quote', quoteNumber:e.job||'', clientName:e.name||'',
      eventType:e.typeLabel||e.type||'', eventDate:e.dayLabel||'', address:e.addr||'',
      clientPhone:'', clientEmail:'', notes:'',
      createdAt:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) }, fin);
    try{ await db.collection('invoices').doc(eid).set(inv); toast('Quote sent to main app \u2713'); }
    catch(err){ toast('Could not save \u2014 check connection'); }
  }
}
function menuDocHeader(e){
  return `<div class="mdoc-head"><div class="mdoc-brand">PREMIER CATERERS<small>FINE KOSHER CATERING</small></div>
    <div class="mdoc-evline"><b>${esc(displayJob(e&&e.job))}${e&&e.name?(' · '+esc(e.name)):''}</b>${e&&e.typeLabel?(' · '+esc(e.typeLabel)):''}${e&&e.guests?(' · '+esc(e.guests)+' guests'):''}</div></div>`;
}
function renderMenuDoc(){
  const e=events.find(x=>x.id===menuDocEventId);
  const selected=menuDocDishIds.map(id=>dishes.find(d=>d.id===id)).filter(Boolean);
  let bodyHtml;
  if(menuDocMode==='edit'){ bodyHtml='<div class="mdoc-print" style="max-width:780px;margin:0 auto">'+renderTemplateEdit()+'</div>'; }
  else if(menuDocMode==='client'){
    const order=SECTIONS.concat([...new Set(selected.map(d=>d.section||'Other'))].filter(s=>!SECTIONS.includes(s)));
    let secs='';
    order.forEach(sec=>{ const ds=selected.filter(d=>(d.section||'Other')===sec); if(ds.length===0) return;
      secs+=`<div class="mdoc-sec"><h3>${esc(sec)}</h3>${ds.map(d=>`<div class="mdoc-dish">${esc(d.name)}</div>`).join('')}</div>`; });
    if(!secs) secs=`<div class="mdoc-empty">No menu selected yet. Use \u201cBuild menu\u201d first, then reopen.</div>`;
    if(menuDocTemplateMenu) secs=renderTemplateClientHtml();
    bodyHtml=`<div class="mdoc-print">${menuDocHeader(e)}${renderCoverEditor(e)}${secs}${menuDocEstimateContract()}</div>`;
  } else {
    const evItems=items.filter(it=>it.eventId===menuDocEventId);
    const gsecs=evItems.map(it=>it.section||'Other');
    const order=SECTIONS.concat([...new Set(selected.map(d=>d.section||'Other').concat(gsecs))].filter(s=>!SECTIONS.includes(s)));
    let rows='';
    order.forEach(sec=>{
      const ds=selected.filter(d=>(d.section||'Other')===sec);
      const gi=evItems.filter(it=>(it.section||'Other')===sec).sort((a,b)=>(a.order||0)-(b.order||0));
      if(ds.length===0 && gi.length===0) return;
      rows+=`<div class="mdoc-isec"><div class="ml"><div class="secname">${esc(sec)}</div>${ds.map(d=>`<div class="mdish">${esc(d.name)}</div>`).join('')||'<div class="mdish" style="color:#aaa">\u2014</div>'}</div>`+
        `<div class="mr">${gi.map(it=>`<div class="mdoc-grow"><span class="mdoc-k ${it.kitchen||'X'}">${esc(it.kitchen||'X')}</span><span class="mdoc-gi">${esc(it.item)}</span><span class="mdoc-gq">${esc(it.qty||'')}</span><span class="mdoc-gv">${esc(it.vendor||'')}</span></div>`).join('')||'<div style="color:#bbb;font-size:12px;padding:4px 0">no grocery rows</div>'}</div></div>`;
    });
    if(!rows) rows=`<div class="mdoc-empty">Nothing to show yet. Build the menu and grocery first.</div>`;
    bodyHtml=`<div class="mdoc-print internal">${menuDocHeader(e)}${rows}</div>`;
  }
  return `<div class="mdoc-bg" onclick="if(event.target===this)closeMenuDoc()"><div class="mdoc-shell">
    <div class="mdoc-toolbar">
      <div class="mdoc-seg"><button class="${menuDocMode==='client'?'on':''}" onclick="setMenuDocMode('client')">Client</button><button class="${menuDocMode==='internal'?'on':''}" onclick="setMenuDocMode('internal')">Internal</button></div>
      <span style="font-size:12px;color:var(--text3)">${menuDocMode==='client'?'Menu only — for the client':'Menu + grocery — kitchen copy'}</span>
      <div class="mdoc-tool-sp"></div>
      ${menuDocTemplateMenu?('<button class="mdoc-quote-btn" onclick="setMenuDocMode(\''+(menuDocMode==='edit'?'client':'edit')+'\')"><i class="ti ti-'+(menuDocMode==='edit'?'check':'edit')+'"></i> '+(menuDocMode==='edit'?'Done editing':'Edit menu')+'</button>'):''}
      <button class="mdoc-quote-btn" onclick="downloadMenuPdf()"><i class="ti ti-download"></i> Download PDF</button>
      <button class="mdoc-quote-btn" onclick="saveQuoteToMainApp()"><i class="ti ti-receipt"></i> Save as quote</button>
      <button class="mdoc-print-btn" onclick="printMenuDoc()"><i class="ti ti-printer"></i> Print</button>
      <button class="mdoc-x" onclick="closeMenuDoc()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mdoc-scroll">${bodyHtml}</div>
  </div></div>`;
}

function coverAuto(e,inq){
  inq=inq||{}; e=e||{};
  const name=[inq.firstName,inq.lastName].filter(Boolean).join(' ').trim();
  let dateStr=e.dayLabel||'';
  if(inq.eventDate){ const d=new Date(inq.eventDate+'T12:00:00Z'); if(!isNaN(d)) dateStr=d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',year:'numeric'}); }
  return { eventName:inq.eventName||'', clientName:name||e.name||'', eventDate:dateStr,
    guests:String(inq.guestCount||e.guests||''), venueName:inq.venueName||'',
    venueAddr:inq.venueLocation||e.addr||'', venueContact:'', venuePhone:'',
    clientPhone:inq.phone||e.phone||'', clientEmail:inq.email||e.email||'', notes:inq.comments||'' };
}
function mergeCover(auto,saved){ const out=Object.assign({},auto); if(saved){ for(const k in saved){ const v=saved[k]; if(v!=null && String(v).trim()!=='') out[k]=v; } } return out; }
let _coverSaveT;
function coverSave(){ clearTimeout(_coverSaveT); const eid=menuDocEventId, cov=JSON.parse(JSON.stringify(menuDocCoverSaved||{}));
  _coverSaveT=setTimeout(()=>{ if(eid) db.collection('groceryMenus').doc(eid).set({eventId:eid,cover:cov,updated:Date.now()},{merge:true}).catch(()=>{}); },600); }
function coverField(f,v){ if(!menuDocCover) menuDocCover={}; menuDocCover[f]=v; menuDocCoverSaved[f]=v; coverSave(); }

function coverInput(label,key,val,ph){
  return '<label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:#667;font-weight:600;text-transform:uppercase;letter-spacing:.04em">'+esc(label)+
    '<input value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'" oninput="coverField(\''+key+'\',this.value)" '+
    'style="font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;color:#222;padding:7px 9px;border:1px solid #d8dadf;border-radius:7px;background:#fff;font-family:inherit"></label>';
}
function renderCoverEditor(e){
  const c=menuDocCover||{};
  return '<div style="border:1px solid #e6e6ea;border-radius:12px;padding:16px 16px 18px;margin:0 0 18px;background:#fafafb">'+
    '<div style="font-weight:700;font-size:14px;color:#1a1a1a;margin-bottom:3px">Cover page details</div>'+
    '<div style="font-size:12px;color:#888;margin-bottom:14px">Auto-filled from the inquiry. Edit any field to override — your changes are saved for this event. (Venue contact &amp; phone aren’t in the inquiry form, so add those here.)</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px">'+
      coverInput('Event name','eventName',c.eventName,'e.g. Bar Mitzvah of Daniel')+
      coverInput('Client name','clientName',c.clientName,(e&&e.name)||'')+
      coverInput('Date of event','eventDate',c.eventDate,(e&&e.dayLabel)||'')+
      coverInput('Number of guests','guests',c.guests,(e&&e.guests)||'')+
      coverInput('Venue name','venueName',c.venueName,'The hall / shul')+
      coverInput('Venue address','venueAddr',c.venueAddr,(e&&e.addr)||'')+
      coverInput('Venue contact person','venueContact',c.venueContact,'')+
      coverInput('Venue phone','venuePhone',c.venuePhone,'')+
      coverInput('Client phone','clientPhone',c.clientPhone,'')+
      coverInput('Client email','clientEmail',c.clientEmail,'')+
      '<label style="grid-column:1/-1;display:flex;flex-direction:column;gap:3px;font-size:11px;color:#667;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Notes / comments'+
      '<textarea oninput="coverField(\'notes\',this.value)" placeholder="Special information, allergies, timing, etc." '+
      'style="font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;color:#222;padding:8px 9px;border:1px solid #d8dadf;border-radius:7px;background:#fff;font-family:inherit;min-height:60px;resize:vertical">'+esc(c.notes||'')+'</textarea></label>'+
    '</div></div>';
}

function _loadScriptOnce(srcUrl){
  return new Promise((res,rej)=>{ if([...document.scripts].some(s=>s.src===srcUrl)) return res();
    const s=document.createElement('script'); s.src=srcUrl; s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load '+srcUrl)); document.head.appendChild(s); });
}
async function ensureJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return;
  await _loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await _loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
}

// Header (logo + yellow Job # badge) and footer (page X of Y + last modified) on EVERY page.
function drawFrame(doc,e,cov,p,total,modStr,PW,PH,M){
  const lw=132, lh=lw/PC_LOGO_RATIO;
  try{ doc.addImage(PC_LOGO,'JPEG',M,28,lw,lh); }catch(_){}
  const job=displayJob(e&&e.job)||'#—';
  const isDrop=e&&(e.type==='dropoff'||/drop\s*off/i.test(e.typeLabel||''));
  const label=(isDrop?'DROP OFF ':'EVENT ')+job;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  const tw=doc.getTextWidth(label), bw=tw+26, bh=26, bx=PW-M-bw, by=33;
  doc.setFillColor(255,221,0);
  if(doc.roundedRect) doc.roundedRect(bx,by,bw,bh,5,5,'F'); else doc.rect(bx,by,bw,bh,'F');
  doc.setTextColor(25,25,25);
  doc.text(label, bx+bw/2, by+bh/2+4, {align:'center'});
  doc.setDrawColor(222,222,226); doc.setLineWidth(0.7); doc.line(M,102,PW-M,102);
  doc.line(M,PH-44,PW-M,PH-44);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140);
  doc.text('Last modified: '+modStr, M, PH-30);
  doc.text('Page '+p+' of '+total, PW-M, PH-30, {align:'right'});
  doc.setTextColor(150,30,30);
  doc.text('PREMIER CATERERS  \u00b7  Fine Kosher Catering', PW/2, PH-30, {align:'center'});
}

async function downloadMenuPdf(opts){
    opts=opts||{};
    if(menuDocTemplateMenu){ return buildTemplateMenuPdf(opts); }
  try{
    toast('Building PDF\u2026');
    await ensureJsPdf();
    const e=events.find(x=>x.id===menuDocEventId)||{};
    const cov=menuDocCover||{};
    const { jsPDF }=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'letter'});
    const PW=doc.internal.pageSize.getWidth();
    const PH=doc.internal.pageSize.getHeight();
    const M=46, TOP=128, BOT=726, IM=M+34;

    // ---------- COVER (page 1) ----------
    let y=170;
    doc.setFont('times','bold'); doc.setFontSize(15); doc.setTextColor(70);
    doc.text('EVENT MENU & PROPOSAL', PW/2, y, {align:'center', charSpace:2.4}); y+=36;
    doc.setFont('times','bold'); doc.setFontSize(24); doc.setTextColor(20);
    const headline=cov.eventName || cov.clientName || e.name || 'Event';
    doc.text(headline, PW/2, y, {align:'center'}); y+=22;
    const sub=[(e.typeLabel||e.type||''), cov.eventDate].filter(Boolean).join('     \u00b7     ');
    if(sub){ doc.setFont('times','normal'); doc.setFontSize(13); doc.setTextColor(110); doc.text(sub, PW/2, y, {align:'center'}); }
    y+=22; doc.setDrawColor(150,30,30); doc.setLineWidth(1.2); doc.line(PW/2-90,y,PW/2+90,y); y+=30;

    const rows=[]; const add=(l,v)=>{ if(v!=null && String(v).trim()!=='') rows.push([l,String(v)]); };
    add('Client', cov.clientName||e.name);
    if(cov.eventName) add('Event', cov.eventName);
    add('Event type', e.typeLabel||e.type);
    add('Date of event', cov.eventDate);
    add('Number of guests', cov.guests);
    add('Venue', cov.venueName);
    add('Venue address', cov.venueAddr);
    add('Venue contact', [cov.venueContact, cov.venuePhone].filter(Boolean).join('  \u00b7  '));
    add('Client phone', cov.clientPhone);
    add('Client email', cov.clientEmail);
    doc.autoTable({ startY:y, margin:{left:IM,right:IM}, body:rows.length?rows:[['','']], theme:'plain',
      styles:{font:'times',fontSize:12,cellPadding:{top:6,bottom:6,left:2,right:2},textColor:35},
      columnStyles:{0:{fontStyle:'bold',cellWidth:150,textColor:95},1:{textColor:30}},
      didDrawCell:(d)=>{ if(d.column.index===1){ doc.setDrawColor(232,232,236); doc.setLineWidth(0.5); doc.line(IM, d.cell.y+d.cell.height, PW-IM, d.cell.y+d.cell.height); } } });
    let ay=(doc.lastAutoTable?doc.lastAutoTable.finalY:y)+26;
    if(cov.notes && cov.notes.trim()){
      if(ay>BOT-60) ay=BOT-60;
      doc.setFont('times','bold'); doc.setFontSize(12); doc.setTextColor(95); doc.text('Notes', IM, ay); ay+=16;
      doc.setFont('times','normal'); doc.setFontSize(11); doc.setTextColor(40);
      doc.text(doc.splitTextToSize(cov.notes.trim(), PW-2*IM), IM, ay);
    }

    // ---------- MENU PAGES (current order; descriptions come later) ----------
    const selected=menuDocDishIds.map(id=>dishes.find(d=>d.id===id)).filter(Boolean);
    if(selected.length){
      doc.addPage(); y=TOP;
      doc.setFont('times','bold'); doc.setFontSize(16); doc.setTextColor(20); doc.text('Menu', M, y); y+=8;
      doc.setDrawColor(150,30,30); doc.setLineWidth(1); doc.line(M,y,PW-M,y); y+=22;
      const order=SECTIONS.concat([...new Set(selected.map(d=>d.section||'Other'))].filter(s=>!SECTIONS.includes(s)));
      order.forEach(sec=>{
        const ds=selected.filter(d=>(d.section||'Other')===sec); if(!ds.length) return;
        if(y>BOT-46){ doc.addPage(); y=TOP; }
        doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(150,30,30);
        doc.text(String(sec).toUpperCase(), M, y, {charSpace:0.6}); y+=16;
        doc.setFont('times','normal'); doc.setFontSize(12.5); doc.setTextColor(35);
        ds.forEach(d=>{
          const lines=doc.splitTextToSize(d.name, PW-2*M-14);
          if(y+lines.length*15>BOT){ doc.addPage(); y=TOP; }
          doc.text(lines, M+14, y); y+=lines.length*15+3;
        });
        y+=12;
      });
    }

    // ---------- FRAME every page ----------
    const total=doc.getNumberOfPages();
    const modStr=new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
    for(let p=1;p<=total;p++){ doc.setPage(p); drawFrame(doc,e,cov,p,total,modStr,PW,PH,M); }

    const safe=((cov.clientName||e.name||'event')+'').replace(/[^\w\- ]/g,'').trim();
    const fname=('Premier Menu '+(displayJob(e.job)||'')+' '+safe).replace(/\s+/g,' ').trim()+'.pdf';
    if(opts.mode==='print'){
      try{ doc.autoPrint(); const url=doc.output('bloburl'); const w=window.open(url,'_blank');
        if(!w){ doc.save(fname); toast('Pop-up blocked \u2014 saved the PDF instead'); } else { toast('Opening print\u2026'); } }
      catch(_){ doc.save(fname); toast('PDF ready \u2713'); }
    } else { doc.save(fname); toast('PDF ready \u2713'); }
  }catch(err){ console.error('PDF error',err); toast('PDF failed: '+(err&&err.message||err)); }
}

function templateIdFor(e){ if(!e) return null; const t=(e.type||'').toLowerCase(), l=(e.typeLabel||'').toLowerCase(); if(/wedding|aufruf/.test(l)) return 'wedding'; if(t==='dinner') return 'wedding'; return null; } // wedding template for now; more types as we build them
function tmplBuild(tid){
  const tpl=MENU_TEMPLATES[tid]; const m=JSON.parse(JSON.stringify(tpl));
  (m.phases||[]).forEach(ph=>(ph.stations||[]).forEach(st=>{
    st.on=false;
    (st.items||[]).forEach(it=>it.on=false);
    (st.groups||[]).forEach(g=>(g.items||[]).forEach(it=>it.on=false));
    (st.orItems||[]).forEach(it=>it.on=false);
    if(st.entreeSides){
      st.entreeSides.potatoes=(st.entreeSides.potatoes||[]).map(p=>typeof p==='string'?{n:p,on:false}:Object.assign({on:false},p));
      st.entreeSides.vegetables=(st.entreeSides.vegetables||[]).map(p=>typeof p==='string'?{n:p,on:false}:Object.assign({on:false},p));
    }
  }));
  m.templateId=tid; m.pricing=Object.assign({}, tpl.pricing||{});
  return m;
}

  const li=it=>'<div class="mdoc-dish">'+esc(it.n||it.name)+(it.d?(' <span style="font-size:11px;color:#888">'+esc(it.d)+'</span>'):'')+'</div>';
  let h='';
  (m.phases||[]).forEach(ph=>{
    const sts=(ph.stations||[]).filter(stationVisible); if(!sts.length) return;
    h+='<div class="mdoc-sec" style="text-align:center;margin-top:16px"><h3 style="display:inline-block">'+esc(ph.title)+'</h3></div>';
    sts.forEach(st=>{
      h+='<div class="mdoc-sec"><h4 style="margin:10px 0 3px;font-size:14px">'+esc(st.name)
        +(st.choose!==undefined?(' <span style="font-weight:400;font-size:12px;color:#777">(choose '+esc(st.choose)+')</span>'):'')+'</h4>';
      if(st.desc) h+='<div style="font-size:12px;color:#555;margin-bottom:3px">'+esc(st.desc)+'</div>';
      (st.groups||[]).forEach(g=>{ const its=(g.items||[]).filter(i=>i.on!==false); if(its.length) h+='<div style="font-weight:600;font-size:12px">'+esc(g.label)+'</div>'+its.map(li).join(''); });
      (st.items||[]).filter(i=>i.on!==false).forEach(it=>h+=li(it));
      const ors=(st.orItems||[]).filter(i=>i.on!==false);
      ors.forEach((it,idx)=>{ if(idx>0) h+='<div style="color:#999;font-size:12px">~or~</div>'; h+=li(it); });
      if(Array.isArray(st.servedWith)&&st.servedWith.length) h+='<div style="font-size:11px;font-weight:600;margin-top:3px">Served with</div>'+st.servedWith.map(x=>'<div class="mdoc-dish" style="padding-left:12px">'+esc(x)+'</div>').join('');
      if(st.note) h+='<div style="font-size:11px;color:#666;margin-top:2px">'+esc(st.note)+'</div>';
      if(st.entreeSides){ const pots=(st.entreeSides.potatoes||[]).filter(i=>i&&i.on===true), vegs=(st.entreeSides.vegetables||[]).filter(i=>i&&i.on===true); if(pots.length||vegs.length){ h+='<div style="font-size:11px;font-weight:600;margin-top:3px">'+esc(st.entreeSides.label||'')+'</div>'; pots.concat(vegs).forEach(i=>h+=li(i)); } }
      h+='</div>';
    });
  });
  return h;
}

// ── STAGE 2: full template menu PDF (matches the approved format) ──
function menuLastUpdateStr(){
  const d=new Date(); const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return days[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()+' '+hh+':'+mm;
}
async function buildTemplateMenuPdf(opts){
  opts=opts||{};
  try{
    toast('Building PDF\u2026');
    await ensureJsPdf();
    const m=menuDocTemplateMenu; if(!m){ toast('No template menu'); return; }
    const e=events.find(x=>x.id===menuDocEventId)||{};
    const cov=menuDocCover||{};
    const includeArr = true;   // always include Arrangements for now (manual toggle to come)
    const { jsPDF }=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'letter'});
    const PW=612, PH=792, M=54, RM=PW-M, MIDX=M+250, BODY_TOP=152, BODY_BOT=726;
    let y=BODY_TOP;

    const isDrop=e&&(e.type==='dropoff'||/drop\s*off/i.test(e.typeLabel||''));
    const tagLabel=(isDrop?'DROP OFF ':'EVENT ')+(displayJob(e.job)||'#\u2014');
    const evName=((cov.eventName||cov.clientName||e.name||'')+(e.typeLabel?('  '+e.typeLabel):'')).trim();
    const hdrRows=[['Date: ',cov.eventDate||e.dayLabel||''],['Type of event: ',e.typeLabel||e.type||''],
      ['Guest count: ',cov.guests||e.guests||''],['',''],['Venue: ',cov.venueName||''],
      ['Location: ',cov.venueAddr||e.addr||''],['',''],['Contact: ',cov.clientName||e.name||''],
      ['Email: ',cov.clientEmail||''],['Phone: ',cov.clientPhone||''],['Party planner: ',cov.planner||'']];

    function setF(b,sz,col){ doc.setFont('helvetica',b?'bold':'normal'); doc.setFontSize(sz); col=col||[0,0,0]; doc.setTextColor(col[0],col[1],col[2]); }
    function drawHeader(){
      try{ doc.addImage(PC_LOGO,'JPEG', M+4, 28, 150, 74); }catch(_){}
      setF(true,10,[0,0,0]); const tw=doc.getTextWidth(tagLabel), tgw=tw+16;
      doc.setFillColor(255,255,0); doc.rect(RM-tgw,30,tgw,16,'F');
      doc.setTextColor(0,0,0); doc.text(tagLabel, RM-tgw+8, 41);
      if(evName){ setF(true,9,[0,0,0]); const nw=doc.getTextWidth(evName);
        doc.setFillColor(255,255,0); doc.rect(M+8,120,nw+8,13,'F');
        doc.setTextColor(0,0,0); doc.text(evName, M+12, 129); }
      let yy=40;
      hdrRows.forEach(r=>{ if(r[0]){ setF(false,8.5,[30,30,30]); doc.text(r[0], MIDX+12, yy);
        const lw=doc.getTextWidth(r[0]); setF(true,8.5,[30,30,30]); doc.text(String(r[1]||''), MIDX+12+lw, yy); } yy+=8.4; });
      doc.setDrawColor(225,225,225); doc.setLineWidth(0.5); doc.line(M,138,RM,138);
    }
    function drawFooter(pg,total){
      doc.setDrawColor(210,210,210); doc.setLineWidth(0.6); doc.line(M,740,RM,740);
      setF(false,7.5,[115,115,115]);
      doc.text('201-250-9487', M, 752);
      doc.text('events@thepremiercaterer.com', M, 762);
      doc.text('OU & PCK Kosher Supervision', M, 772);
      const pgs='Page '+pg+' of '+total; doc.text(pgs, RM-doc.getTextWidth(pgs), 752);
      doc.text('Last update:', RM-doc.getTextWidth('Last update:'), 762);
      const dt=menuLastUpdateStr(); doc.text(dt, RM-doc.getTextWidth(dt), 772);
    }
    function need(h){ if(y+h>BODY_BOT){ doc.addPage(); drawHeader(); y=BODY_TOP; } }
    function writeText(txt,x,sz,b,col,gap,wrap,ul){
      const lines = wrap ? doc.splitTextToSize(String(txt),wrap) : [String(txt)];
      lines.forEach(ln=>{ need(sz+gap); setF(b,sz,col); doc.text(ln,x,y);
        if(ul){ const w=doc.getTextWidth(ln); doc.setDrawColor((col||[0,0,0])[0],(col||[0,0,0])[1],(col||[0,0,0])[2]); doc.setLineWidth(0.6); doc.line(x,y+1.5,x+w,y+1.5); }
        y+=sz+gap; });
    }
    function sectionHeader(label,sz){ sz=sz||11.5; need(sz+6); setF(true,sz,[0,0,0]); doc.text(label,M,y);
      const w=doc.getTextWidth(label); doc.setDrawColor(0,0,0); doc.setLineWidth(0.7); doc.line(M,y+1.5,M+w,y+1.5); return w; }
    function phaseHeader(title,instr){ y+=24; const sz=instr?12:14; need(sz+8); setF(true,sz,[0,0,0]);
      const tw=doc.getTextWidth(title); doc.text(title, PW/2, y, {align:'center'});
      if(!instr){ doc.setDrawColor(0,0,0); doc.setLineWidth(0.8); doc.line(PW/2-tw/2,y+2,PW/2+tw/2,y+2); } y+=20; }
    function itemLine(it,x){ x=x||(M+4); const name=String(it.n||it.name||''); const wrapw=RM-x-10;
      const lines=doc.splitTextToSize(name,wrapw);
      lines.forEach((ln,i)=>{ need(13); setF(false,10.5,[0,0,0]); doc.text(ln,x,y);
        if(i===lines.length-1){ const w=doc.getTextWidth(ln+' ');
          if(it.d){ setF(false,7.5,[60,60,60]); doc.text(String(it.d),x+w,y); }
          if(it.up){ setF(true,7.5,[60,60,60]); doc.text('('+it.up+')',x+w,y); } }
        y+=13; }); }
    function station(st){
      y+=20; let suffix='';
      if(st.choose!==undefined) suffix='(choose '+st.choose+')';
      if(st.upcharge) suffix='(additional '+st.upcharge+')';
      const w=sectionHeader(st.name);
      if(suffix){ setF(false,8.5,[80,80,80]); doc.text(suffix, M+w+4, y); }
      y+=15;
      if(st.desc) writeText(st.desc, M+4, 9.5, false, [50,50,50], 2.5, RM-M-8);
      (st.groups||[]).forEach(g=>{ const its=(g.items||[]).filter(i=>i.on!==false); if(!its.length) return;
        y+=3; writeText(g.label, M+4, 10, true, [0,0,0], 3, null, true); its.forEach(it=>itemLine(it)); });
      (st.items||[]).filter(i=>i.on!==false).forEach(it=>itemLine(it));
      if(st.note) writeText(st.note, M+4, 8, true, [40,40,40], 3, RM-M-8);
      if(st.fillers) writeText(st.fillers, M+18, 8.5, false, [50,50,50], 3, RM-M-22);
      (st.options||[]).forEach(op=>itemLine({n:'(optional) '+op.name, up:'additional '+op.upcharge}));
      if(Array.isArray(st.servedWith)&&st.servedWith.length){ y+=2; writeText('Served with', M+24, 8.5, true, [0,0,0], 2);
        st.servedWith.forEach(x2=>writeText(x2, M+24, 10, false, [0,0,0], 2)); }
      if(st.sauces) writeText(st.sauces, M+24, 9, false, [50,50,50], 2, RM-M-28);
      if(st.servedNote) writeText(st.servedNote, M+18, 8.5, false, [50,50,50], 2);
      if(st.optionBlock){ const ob=st.optionBlock; y+=3;
        writeText(ob.name+'  (additional '+ob.upcharge+')', M+18, 9.5, true, [0,0,0], 3, null, true);
        (ob.items||[]).forEach(x2=>writeText(x2, M+18, 10, false, [0,0,0], 2)); }
      if(st.orItems){ const ors=(st.orItems||[]).filter(i=>i.on!==false); let first=true;
        ors.forEach(it=>{ if(!first){ need(12); setF(false,9,[100,100,100]); doc.text('~or~', M+4, y); y+=12; } itemLine(it); first=false; });
        if(st.optionalCourse){ const oc=st.optionalCourse; y+=28; sectionHeader('Soup Course'); y+=15;
          writeText('Optional \u2014 additional '+oc.upcharge, M+4, 10, false, [0,0,0], 3); } }
      if(st.entreeSides){ const es=st.entreeSides;
        const pots=(es.potatoes||[]).filter(i=>i&&i.on===true), vegs=(es.vegetables||[]).filter(i=>i&&i.on===true);
        if(pots.length||vegs.length){ y+=4;
          writeText(es.label, M+18, 8.5, true, [0,0,0], 4, RM-M-22);
          pots.forEach(i=>writeText(i.n, M+18, 10, false, [0,0,0], 2)); y+=4;
          vegs.forEach(i=>writeText(i.n, M+18, 10, false, [0,0,0], 2)); } }
      if(st.coffee){ y+=4; need(14); setF(true,9.5,[0,0,0]); doc.text(st.coffee, PW/2, y, {align:'center'}); y+=14; }
    }

    // ---- build body ----
    drawHeader();
    writeText('Notes:', M, 10, false, [0,0,0], 3);
    (m.phases||[]).forEach(ph=>{
      const sts=(ph.stations||[]).filter(stationVisible);
      if(!sts.length) return;
      phaseHeader(ph.title, !!ph.instruction);
      sts.forEach(st=>station(st));
    });
    if(includeArr){
      doc.addPage(); drawHeader(); y=BODY_TOP;
      phaseHeader('Arrangements', false);
      const p=m.pricing||{};
      writeText('Based on a minimum of '+(p.perPersonMin||'')+' people the cost will be $'+(p.perPerson||'')+' per person', M, 11, false,[0,0,0],4);
      [['Waiters / bartenders / Chefs @ $'+(p.staffEach||'')+' each'],
       ['Staffing for cocktail hour only @ $'+(p.cocktailStaffEach||'')+' each'],
       ['Management fee @ $'+(p.managementFee||'')],
       ['Rabbinical supervision @ $'+(p.rabbinical||'')],
       ['Logistics fee @ '+(p.logisticsPct||'')+'%'],
       ['Sales tax @ '+(p.taxPct||'')+'%'],['Gratuity']].forEach(r=>writeText(r[0], M+24, 11, false,[0,0,0],4));
      y+=14; writeText('CONTRACT', M, 10, true,[0,0,0],5,null,true);
      String(CONTRACT_TEXT).split('\n').forEach(ln=>{ if(ln.trim()) writeText(ln.trim(), M, 8.5, false,[40,40,40],4, RM-M); else y+=4; });
    }

    // ---- footers (page X of Y) ----
    const total=doc.getNumberOfPages();
    for(let p=1;p<=total;p++){ doc.setPage(p); drawFooter(p,total); }

    const safe=((cov.clientName||e.name||'event')+'').replace(/[^\w\- ]/g,'').trim();
    const fname=('Premier Menu '+(displayJob(e.job)||'')+' '+safe).replace(/\s+/g,' ').trim()+'.pdf';
    if(opts.mode==='print'){
      try{ doc.autoPrint(); const url=doc.output('bloburl'); const w2=window.open(url,'_blank');
        if(!w2){ doc.save(fname); toast('Pop-up blocked \u2014 saved the PDF instead'); } else { toast('Opening print\u2026'); } }
      catch(_){ doc.save(fname); toast('PDF ready \u2713'); }
    } else { doc.save(fname); toast('PDF ready \u2713'); }
  }catch(err){ console.error('template PDF error',err); toast('PDF failed: '+(err&&err.message||err)); }
}

// expose for inline handlers
Object.assign(window,{changeWeek,setTab,addItem,delItem,editItem,editItemDebounced,
  openPickDish,applyDish,openDishEdit,saveDish,addCompRow,renderCompRows,deleteDish,
  openVendorEdit,saveVendor,deleteVendor,closeModal,copyVendor,importStarter,
  openBuilder,closeBuilder,reRenderBuilder,toggleBsec,toggleBuilderDish,applyTemplate,buildGrocery,openMenuDoc,closeMenuDoc,setMenuDocMode,printMenuDoc,estLine,estField,estAddLine,estDelLine,saveQuoteToMainApp,coverField,downloadMenuPdf,tmplToggleStation,tmplToggleItem,tmplChoose,tmplPrice});

// ---------- Go ----------
updateCounts();
startListeners();
render();
</script>
